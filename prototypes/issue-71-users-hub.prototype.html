<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — the Users hub (user approval, switches, invitations)</title>
<!--
  PROTOTYPE, throwaway. Ticket: "Prototype: the Users hub — user approval, switches and invitations"
  (zzubyr7x/Nerve-Centre#71). Question: what does the Users hub look like on screen?

  Three whole-page takes of the one User approval page, inside one Shell, switchable with
  ?variant=A|B|C (or the arrows / ← → keys), crossed with a seat switcher (?seat=exco|gl):
    A  Table      — the KEPSA-portal shape: tabs over a dense table, rows expand into switches
    B  Inbox      — list on the left, one person at a time on the right
    C  Workbench  — counts as the tabs, a card per person with switches on its face, invite always open
  Everything lives in memory. Reload resets it. Open questions are amber.
-->
<style>
/* ==========================================================================
   SAVE7 LOOK — the visual vocabulary every prototype on the Nerve Centre map
   shares. Taken from the KEPSA presentation ("KEPSA Slides - SANS"), which the
   user gave on 2026-10-07 as the design direction for the OS and all prototypes.

   Colours were sampled from the rendered PDF, not guessed. Typeface is
   Montserrat (embedded in the deck: Regular, Medium, SemiBold, Bold, italics).

   Use it: paste this file into a prototype's <style> block and put
   class="save7-look" on <body>. A prototype is inlined rather than linked so it
   opens by double-click and survives being emailed; this file is the one source
   the copies are taken from.

   TWO EXTENSIONS beyond what the deck shows, both for small text:
   --teal-ink and --pink-ink are darker twins of the brand teal and pink. The
   brand values are fine for titles, fills and shapes (as the deck uses them) but
   fall below readable contrast as small body text on white.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap');

:root {
  /* brand */
  --navy: #0C173B;
  --teal: #00B7B5;
  --pink: #ED186B;
  --amber: #FFC550;          /* connectors, pins, third-in-sequence — never a main colour */
  --ink: #585858;            /* body text */

  /* tints (card borders, fills, blobs) */
  --teal-border: #E6F7F7;
  --teal-fill: #F4FBFB;
  --mint: #F3FBFB;
  --pink-border: #FCE8F0;
  --pink-fill: #FFF5F7;
  --pink-head: #FCDCE8;
  --amber-fill: #FFF6DD;     /* derived from the amber, for flag callouts */

  /* small-text twins (extension — see header) */
  --teal-ink: #007F7D;
  --pink-ink: #C70F58;
  --amber-ink: #8A5B00;

  --radius: 20px;
  --radius-sm: 12px;
  --font: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }

.save7-look {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink);
  background: #fff;
}

/* ---- the two backdrop blobs: pale mint top-right, pale pink bottom-left ---- */
.save7-look::before,
.save7-look::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  z-index: -1;
  pointer-events: none;
}
.save7-look::before { top: -22vw; right: -16vw; width: 52vw; height: 52vw; background: var(--mint); }
.save7-look::after  { bottom: -20vw; left: -12vw; width: 38vw; height: 38vw; background: var(--pink-fill); }

/* ---- the two-circle motif: big teal, smaller pink, overlapping ---- */
.circles { position: relative; width: 104px; height: 96px; flex: none; }
.circles::before,
.circles::after { content: ''; position: absolute; border-radius: 50%; }
.circles::before { top: 0; right: 0; width: 72px; height: 72px; background: var(--teal); }
.circles::after  { bottom: 0; left: 6px; width: 44px; height: 44px; background: var(--pink); }

/* ---- type ---- */
.eyebrow { margin: 0 0 4px; font-weight: 600; font-size: 13px; color: var(--pink-ink); }
.eyebrow.teal { color: var(--teal-ink); }
.title { margin: 0; font-weight: 700; color: var(--navy); line-height: 1.15; letter-spacing: -0.01em; }
.title .dot { color: var(--pink); }
.title .accent { color: var(--teal); }
h1.title { font-size: 40px; }
h2.title { font-size: 26px; }
h3.title { font-size: 18px; }
.lede { color: var(--ink); font-size: 15px; max-width: 70ch; }
.strong { font-weight: 700; color: var(--navy); }
.muted { color: #8a8a8a; }
.mono { font-variant-numeric: tabular-nums; }

/* ---- cards: white, large radius, hairline tinted border; alternate teal/pink ---- */
.card {
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius);
  padding: 20px 22px;
}
.card.pink { border-color: var(--pink-border); }
.card.tint-teal { background: var(--teal-fill); }
.card.tint-pink { background: var(--pink-fill); }
.card-label { margin: 0 0 10px; font-weight: 700; font-size: 15px; color: var(--navy); }

/* ---- number pills ("01", "BARRIER 01") ---- */
.num {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--teal);
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.num.pink { background: var(--pink); }
.num.amber { background: var(--amber); color: var(--navy); }

/* ---- buttons: outlined teal pill; pink for the primary ---- */
.btn {
  font: 600 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal);
  border-radius: 999px;
  padding: 8px 16px;
  cursor: pointer;
  transition: background 0.12s;
}
.btn:hover { background: var(--teal-fill); }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 700; }
.btn.primary:hover { background: #d4125d; }
.btn.quiet { border-color: transparent; color: var(--ink); }
.btn.quiet:hover { background: var(--teal-fill); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* ---- status chips: small, pale ---- */
.chip {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--teal-border);
  color: var(--teal-ink);
  white-space: nowrap;
}
.chip.pink { background: var(--pink-border); color: var(--pink-ink); }
.chip.amber { background: #FFEFC2; color: var(--amber-ink); }
.chip.grey { background: #F1F1F3; color: #666; }

/* ---- tabs: pill row, active in pink ---- */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  font: 600 13px var(--font);
  color: var(--ink);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
}
.tab:hover { background: var(--teal-fill); }
.tab[aria-selected="true"] { background: var(--pink-fill); border-color: var(--pink); color: var(--pink-ink); }

/* ---- form controls ---- */
input[type="text"], select {
  font: 500 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
}
input[type="text"]::placeholder { color: #a5a5a5; }

/* ---- labelled field rows ---- */
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
.fields dt { font-weight: 600; font-size: 12px; color: #8a8a8a; align-self: center; }
.fields dd { margin: 0; color: var(--navy); font-weight: 600; }

/* ---- timeline bar: alternating teal and pink segments, amber pin on the current one ---- */
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
.bar > i { flex: 1; background: var(--teal); }
.bar > i:nth-child(even) { background: var(--pink); }
.bar > i.todo { opacity: 0.22; }

/* ---- callout: amber, for open questions the user should react to ---- */
.flag {
  background: var(--amber-fill);
  border: 1.5px solid #FFE7A8;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12.5px;
  color: #5a4300;
}
.flag b { color: var(--amber-ink); }

/* ---- logo ---- */
.logo { display: block; height: 22px; width: auto; }


/* ===================== prototype-only layout ===================== */
html, body { height: 100%; }
body.save7-look { background: #fff; }
.proto-banner { position: sticky; top: 0; z-index: 30; background: var(--amber-fill); border-bottom: 1.5px solid #FFE7A8; color: #5a4300; font-size: 12px; padding: 6px 16px; text-align: center; }
.proto-banner b { color: var(--amber-ink); }

/* ---- the Shell: KEPSA-portal white sidebar, pink-tinted active item ---- */
.shell { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 31px); }
.side { background: #fff; border-right: 1.5px solid var(--teal-border); padding: 18px 12px 120px; position: sticky; top: 31px; height: calc(100vh - 31px); overflow-y: auto; }
.side .logo { height: 24px; margin: 4px 10px 18px; }
.nav { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.nav li a { display: block; padding: 7px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 500; }
.nav li a:hover { background: var(--teal-fill); }
.nav li.group { margin: 12px 10px 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9a9a9a; }
.nav li.sub a { padding-left: 22px; }
.nav li.sub2 a { padding-left: 34px; font-size: 12.5px; }
.nav li a.active { background: var(--pink-fill); color: var(--pink-ink); font-weight: 700; }
.nav li a.dash { font-weight: 700; color: var(--navy); }
.main { padding: 22px 28px 140px; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.crumb { font-size: 12px; color: #8a8a8a; }
.crumb b { color: var(--navy); }
.me { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.me .who { text-align: right; line-height: 1.25; }
.me .who b { color: var(--navy); display: block; }

/* ---- shared bits ---- */
.av { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; background: var(--teal); flex: none; }
.av.p { background: var(--pink); }
.av.lg { width: 56px; height: 56px; font-size: 18px; }
.av.ghost { background: #fff; border: 1.5px dashed var(--amber); color: var(--amber-ink); }
.av.gone { background: #d6d6d6; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.sm { font-size: 12px; }
.xs { font-size: 11px; }
.btn.sm { padding: 5px 12px; font-size: 12px; }
.btn.ok { border-color: var(--teal); background: var(--teal); color: #fff; }
.btn.ok:hover { background: #00a3a1; }
.btn.danger { border-color: #D92D20; color: #B42318; }
.btn.danger:hover { background: #FEF3F2; }
.btn.danger.solid { background: #D92D20; color: #fff; }
.search { position: relative; }
.search input { width: 100%; padding: 10px 14px 10px 36px; border-radius: 999px; font-size: 13.5px; }
.search::before { content: '⌕'; position: absolute; left: 14px; top: 50%; transform: translateY(-52%); color: #a5a5a5; font-size: 17px; }
.tab .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--teal-border); color: var(--teal-ink); font-size: 11px; text-align: center; }
.tab[aria-selected="true"] .n { background: var(--pink); color: #fff; }
.tab .n.hit { background: var(--amber); color: var(--navy); }
.lock { font-size: 11px; color: #8a8a8a; }
.lock::before { content: '🔒 '; font-size: 10px; }
.flag { margin: 10px 0; }
textarea { font: 500 13px var(--font); color: var(--navy); border: 1.5px solid var(--teal-border); border-radius: var(--radius-sm); padding: 8px 12px; width: 100%; resize: vertical; min-height: 54px; }
input[type="email"] { font: 500 13px var(--font); color: var(--navy); background: #fff; border: 1.5px solid var(--teal-border); border-radius: var(--radius-sm); padding: 9px 12px; }
.empty { padding: 28px; text-align: center; color: #8a8a8a; font-size: 13px; }
.note { font-size: 12px; color: #8a8a8a; }

/* the toggle switch */
.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 12.5px; color: var(--navy); font-weight: 600; }
.sw input { position: absolute; opacity: 0; width: 0; height: 0; }
.sw .tr { width: 36px; height: 20px; border-radius: 999px; background: #dcdcdc; position: relative; transition: background .15s; flex: none; }
.sw .tr::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.sw input:checked + .tr { background: var(--teal); }
.sw input:checked + .tr::after { transform: translateX(16px); }
.sw input:focus-visible + .tr { outline: 3px solid var(--amber); outline-offset: 2px; }
.sw.off { cursor: not-allowed; opacity: .55; }

/* switch board (shared by all three takes; each lays it out its own way) */
.sboard { display: grid; gap: 10px; }
.sboard.grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.sitem { border: 1.5px solid var(--teal-border); border-radius: var(--radius-sm); padding: 10px 12px; background: #fff; }
.sitem:nth-child(even) { border-color: var(--pink-border); }
.sitem .sh { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.sitem .sh b { color: var(--navy); font-size: 12.5px; }
.sitem .owner { font-size: 10.5px; color: #8a8a8a; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.sitem.locked { background: #fafafa; }
.seatchips { display: flex; flex-wrap: wrap; gap: 4px; }
.seated { margin-top: 8px; padding: 10px; border-radius: var(--radius-sm); background: var(--teal-fill); display: grid; gap: 8px; font-size: 12px; }
.seated label { display: inline-flex; gap: 5px; align-items: center; margin-right: 10px; }
.confirm { margin-top: 8px; padding: 10px; border-radius: var(--radius-sm); background: #FEF3F2; border: 1.5px solid #FECDCA; font-size: 12px; color: #7A271A; }

/* toast */
.toast { position: fixed; right: 18px; bottom: 84px; z-index: 60; max-width: 380px; background: var(--navy); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.18); opacity: 0; transform: translateY(8px); transition: opacity .18s, transform .18s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }

/* dialog */
.scrim { position: fixed; inset: 0; background: rgba(17, 24, 64, .28); z-index: 50; display: grid; place-items: center; padding: 16px; }
.dialog { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: #fff; border-radius: var(--radius); padding: 22px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }

/* invite composer (shared) */
.inv .steps { display: grid; gap: 14px; }
.inv .stp { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; }
.inv .stp .num { padding: 3px 0; width: 26px; text-align: center; }
.inv .stp.dim { opacity: .4; }
.linkbox { display: flex; gap: 8px; align-items: center; background: var(--teal-fill); border: 1.5px dashed var(--teal); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 12.5px; color: var(--navy); font-weight: 600; word-break: break-all; }
.refuse { background: #FEF3F2; border: 1.5px solid #FECDCA; color: #7A271A; border-radius: var(--radius-sm); padding: 9px 12px; font-size: 12.5px; }
.good { background: var(--teal-fill); border: 1.5px solid var(--teal-border); color: var(--teal-ink); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 12.5px; }

/* ===================== take A: table ===================== */
.A-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.A-tools { display: grid; gap: 12px; margin-bottom: 14px; }
.tbl-wrap { border: 1.5px solid var(--teal-border); border-radius: var(--radius); overflow-x: auto; background: #fff; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a8a8a; font-weight: 700; padding: 11px 14px; background: var(--teal-fill); border-bottom: 1.5px solid var(--teal-border); }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--teal-border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.sel td { background: var(--pink-fill); }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--teal-fill); }
.tbl tr.open td { background: var(--teal-fill); }
.tbl td.exp { background: #fff !important; padding: 16px 18px 18px; }
.tbl .person { display: flex; align-items: center; gap: 10px; }
.tbl .person b { color: var(--navy); display: block; font-size: 13px; }
.tbl .person span { font-size: 11.5px; color: #8a8a8a; }
.bulk { position: sticky; top: 40px; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--navy); color: #fff; border-radius: 999px; padding: 8px 10px 8px 18px; margin-bottom: 10px; font-size: 13px; }
.bulk .btn { border-color: #fff; }
.alsoin { font-size: 12px; color: #8a8a8a; }
.alsoin button { background: none; border: 0; color: var(--pink-ink); font: 600 12px var(--font); cursor: pointer; text-decoration: underline; padding: 0 2px; }

/* ===================== take B: inbox ===================== */
.B { display: grid; grid-template-columns: 370px 1fr; gap: 18px; align-items: start; }
.B-list { border: 1.5px solid var(--teal-border); border-radius: var(--radius); background: #fff; overflow: hidden; position: sticky; top: 46px; max-height: calc(100vh - 140px); display: flex; flex-direction: column; }
.B-list .lhead { padding: 14px; display: grid; gap: 10px; border-bottom: 1.5px solid var(--teal-border); background: var(--teal-fill); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border: 1.5px solid var(--teal-border); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; font: 600 11.5px var(--font); color: var(--ink); padding: 6px 4px; border-radius: 999px; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--pink); color: #fff; }
.seg button .n { opacity: .75; }
.B-items { overflow-y: auto; }
.B-item { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--teal-border); cursor: pointer; }
.B-item:hover { background: var(--teal-fill); }
.B-item.cur { background: var(--pink-fill); box-shadow: inset 3px 0 0 var(--pink); }
.B-item b { color: var(--navy); font-size: 13px; display: block; }
.B-item .sub { font-size: 11.5px; color: #8a8a8a; }
.B-item input[type=checkbox] { accent-color: var(--pink); width: 16px; height: 16px; }
.B-invite { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1.5px solid var(--teal-border); cursor: pointer; color: var(--pink-ink); font-weight: 700; font-size: 13px; }
.B-invite:hover, .B-invite.cur { background: var(--pink-fill); }
.B-group { padding: 8px 14px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9a9a9a; background: #fafafa; }
.B-pane { min-height: 420px; }
.B-pane .phead { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
.B-bulkbar { padding: 10px 14px; border-bottom: 1.5px solid var(--teal-border); display: flex; align-items: center; gap: 8px; font-size: 12.5px; background: #fff; }

/* ===================== take C: workbench ===================== */
.C-top { display: grid; grid-template-columns: 1fr 330px; gap: 20px; align-items: start; }
.C-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0 18px; }
.stat { text-align: left; border: 1.5px solid var(--teal-border); border-radius: var(--radius); padding: 14px 16px; background: #fff; cursor: pointer; font-family: var(--font); }
.stat:nth-child(even) { border-color: var(--pink-border); }
.stat .big { font-size: 30px; font-weight: 700; color: var(--navy); line-height: 1; display: block; margin-top: 6px; }
.stat .lbl { font-size: 12px; font-weight: 700; color: var(--ink); }
.stat .hint { font-size: 11px; color: #8a8a8a; display: block; margin-top: 4px; }
.stat[aria-selected="true"] { background: var(--pink-fill); border-color: var(--pink); }
.stat[aria-selected="true"] .big { color: var(--pink-ink); }
.C-queue { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.qcard { border: 1.5px solid var(--teal-border); border-radius: var(--radius); padding: 14px 16px; background: #fff; display: grid; gap: 10px; position: relative; }
.qcard:nth-child(even) { border-color: var(--pink-border); }
.qcard.sel { background: var(--pink-fill); border-color: var(--pink); }
.qcard .top { display: flex; gap: 10px; align-items: center; }
.qcard .top b { color: var(--navy); display: block; font-size: 13.5px; }
.qcard .top span { font-size: 11.5px; color: #8a8a8a; }
.qcard .pick { position: absolute; top: 12px; right: 12px; accent-color: var(--pink); width: 17px; height: 17px; }
.C-people { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.pcard { border: 1.5px solid var(--teal-border); border-radius: var(--radius); background: #fff; padding: 16px 18px; display: grid; gap: 12px; }
.pcard:nth-child(even) { border-color: var(--pink-border); }
.pcard .top { display: flex; gap: 12px; align-items: center; }
.pcard .top b { color: var(--navy); display: block; font-size: 14px; }
.pcard .top span { font-size: 11.5px; color: #8a8a8a; }
.pcard .face { display: grid; gap: 8px; border-top: 1px solid var(--teal-border); padding-top: 10px; }
.pcard .line { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; }
.pcard .line .k { color: #8a8a8a; font-weight: 600; font-size: 11.5px; }
.C-invite { position: sticky; top: 46px; border: 1.5px solid var(--pink-border); border-radius: var(--radius); background: var(--pink-fill); padding: 18px; overflow: hidden; }
.C-invite .circles { position: absolute; right: -30px; top: -26px; transform: scale(.7); opacity: .9; }
.ledger { border-left: 2px solid var(--teal-border); margin-left: 64px; }
.lent { position: relative; padding: 6px 0 16px 20px; }
.lent::before { content: ''; position: absolute; left: -7px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--pink); border: 2px solid #fff; }
.lent .when { position: absolute; left: -76px; top: 8px; width: 60px; text-align: right; font-size: 11px; font-weight: 700; color: #8a8a8a; }
.lent .box { border: 1.5px solid var(--teal-border); border-radius: var(--radius-sm); padding: 10px 14px; background: #fff; font-size: 12.5px; }
.lent.del::before { background: #bdbdbd; }

/* ===================== the prototype switcher ===================== */
.pswitch { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 6px; background: #111; color: #fff; border-radius: 999px; padding: 6px 8px; box-shadow: 0 10px 30px rgba(0,0,0,.35); font: 600 12px system-ui, -apple-system, sans-serif; white-space: nowrap; max-width: calc(100vw - 16px); overflow-x: auto; }
.pswitch button { font: inherit; color: #fff; background: #2a2a2a; border: 0; border-radius: 999px; padding: 6px 11px; cursor: pointer; }
.pswitch button:hover { background: #3a3a3a; }
.pswitch button.on { background: #FFC550; color: #111; }
.pswitch .lbl { padding: 0 8px; min-width: 130px; text-align: center; }
.pswitch .sep { width: 1px; height: 20px; background: #444; margin: 0 4px; }
.pswitch .k { color: #999; font-weight: 500; padding-left: 4px; }

@media (max-width: 980px) {
  .B { grid-template-columns: 1fr; }
  .B-list { position: static; max-height: 420px; }
  .C-top { grid-template-columns: 1fr; }
  .C-invite { position: static; }
  .C-stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; padding: 10px 16px; border-right: 0; border-bottom: 1.5px solid var(--teal-border); }
  .side .nav { display: none; }
  .side .logo { margin: 4px 0; }
  .main { padding: 16px 16px 140px; }
}
</style>
</head>

let DB = seed();

const isExco = p => p.seats.some(s => EXCO.includes(s));
const isTechHead = p => p.seats.includes('Head · Tech');

// Who may flip which switch. Returns { ok, why } — why is shown under a locked switch.
function can(sw, p) {
  const self = p.id === actor().id;
  switch (sw) {
    case 'seats': return actorIsExco() ? { ok: true, why: "National Exco's" } : { ok: false, why: "National Exco's alone" };
    case 'sa':
      if (!actorIsExco()) return { ok: false, why: "National Exco's alone" };
      if (isExco(p)) return { ok: false, why: 'Exco hold it, irrevocably' };
      if (isTechHead(p)) return { ok: false, why: 'The Tech Head holds it by seat' };
      if (!hasSeat(p)) return { ok: false, why: 'Never held by a Volunteer — give a seat first' };
      return { ok: true, why: "National Exco's" };
    case 'delete':
      if (!actorIsExco()) return { ok: false, why: "National Exco's alone" };
      if (self) return { ok: false, why: 'Not your own account' };
      return { ok: true, why: "National Exco's alone" };
    case 'active':
      if (self) return { ok: false, why: 'Not your own account' };

      return { ok: true, why: 'Branchless — yours' };
    case 'branch': return { ok: true, why: "Exco's and the General Liaison's" };
  }

// ---- acts ----
function approve(ids) {
  const got = DB.pending.filter(r => ids.includes(r.id));
  DB.pending = DB.pending.filter(r => !ids.includes(r.id));
  got.forEach(r => DB.people.unshift({ id: 'p-' + r.id, name: r.name, email: r.email, branch: r.branch, seats: [], status: 'active', since: TODAY, seen: 'Not yet', approvedBy: actor().name }));
  UI.sel.clear();
  toast(got.length === 1 ? `Approved ${got[0].name} into ${branchOf(got[0].branch)}. Next time they sign in, they reach their Dashboard. Nothing is emailed.` : `Approved ${got.length} people, each into the branch they named. Nothing is emailed — they find out by signing in.`);
}
function reject(id, reason) {
  const r = DB.pending.find(x => x.id === id);
  DB.pending = DB.pending.filter(x => x.id !== id);
  DB.rejected.unshift({ id: 'x-' + id, name: r.name, email: r.email, branch: r.branch, reason: reason.trim(), by: actor().name, on: TODAY });
  UI.sel.delete(id); UI.rejecting = null;
  toast(`Rejected ${r.name}${reason.trim() ? ', with a reason they will see' : ', with no reason given'}. They may ask again.`);
}
function setActive(id, on) {

}

function setSeats(id, seats) {
  const p = DB.people.find(x => x.id === id);
  p.seats = seats; if (!seats.length) p.sa = false;
  UI.seating = null;
  toast(`${p.name}'s seats: ${seats.length ? seats.join(', ') : 'none — a Volunteer'}. Their Shell rebuilds from these.`);
}
function del(id) {
  const p = DB.people.find(x => x.id === id);
  DB.people = DB.people.filter(x => x.id !== id);
  DB.deleted.unshift({ id: 'd-' + id, name: p.name, email: p.email, branch: p.branch, on: TODAY, by: actor().name });
  UI.confirming = null; if (UI.open === id) UI.open = null;
  toast(`${p.name}'s account is gone for good — kept as a record in Deleted. Not a ban: they may ask for access again.`);
}
function withdrawInvite(id) {
  const p = DB.people.find(x => x.id === id);
  DB.people = DB.people.filter(x => x.id !== id);
  if (UI.open === id) UI.open = null;
  toast(`Invitation to ${p.email} withdrawn. No account existed, so nothing goes to Deleted.`);
}
// Invite: the three outcomes the glossary names.
function tryInvite(addr) {
  addr = addr.trim().toLowerCase();
  if (!/^[^@\s]+@save7\.org$/.test(addr)) return { kind: 'refuse', msg: 'An invitation goes to a Save7 address (…@save7.org) that you have arranged.' };
  const ex = DB.people.find(p => p.email === addr);
  if (ex && ex.status === 'invited') return { kind: 'refuse', msg: `${addr} is already invited and waiting for its first sign-in. Copy the link again from the Approved tab.` };
  if (ex && ex.status === 'deactivated') return { kind: 'refuse', msg: `${ex.name} already has an account, deactivated. Reactivate it instead.` };
  if (ex) return { kind: 'refuse', msg: `${ex.name} is already approved.` };
  const pend = DB.pending.find(r => r.email === addr);
  if (pend) {
    DB.pending = DB.pending.filter(r => r !== pend);
    DB.people.unshift({ id: 'p-' + pend.id, name: pend.name, email: addr, branch: pend.branch, seats: [], status: 'active', invitedBy: actor().name, since: TODAY, seen: 'Not yet' });
    return { kind: 'pending', msg: `${pend.name} was already waiting in Pending — the invitation approves that request. The branch they named (${branchOf(pend.branch)}) stands.`, addr };
  }
  DB.people.unshift({ id: 'p-inv-' + Date.now(), name: addr, email: addr, branch: null, seats: [], status: 'invited', invitedBy: actor().name, since: TODAY, seen: '—' });
  return { kind: 'new', msg: `${addr} is approved. It shows on the Approved tab as “Invited — not signed in yet” until its first sign-in, branchless and owned by the General Liaison.`, addr };
}
const mailto = addr => `mailto:${addr}?subject=${encodeURIComponent('You are invited to Save7 OS')}&body=${encodeURIComponent(`Hi,\n\nYou have been invited to Save7 OS. Sign in with this Save7 address at:\n\n${SIGNIN}\n\nYou are already approved, so there is no course to finish first.\n\n— ${actor().name}, ${actor().role}`)}`;

// ---- search across all four tabs ----
const TABS = [['pending', 'Pending'], ['approved', 'Approved'], ['rejected', 'Rejected'], ['deleted', 'Deleted']];
function rowsOf(tab) { return tab === 'pending' ? DB.pending : tab === 'approved' ? DB.people : tab === 'rejected' ? DB.rejected : DB.deleted; }
function match(r, q) { if (!q) return true; q = q.toLowerCase(); return [r.name, r.email, r.branch || 'no branch', ...(r.seats || [])].some(v => String(v).toLowerCase().includes(q)); }
function results(tab) { return rowsOf(tab).filter(r => match(r, UI.q)); }
function counts() { return Object.fromEntries(TABS.map(([k]) => [k, results(k).length])); }

// =====================================================================
// UI state
// =====================================================================
const params = new URLSearchParams(location.search);
const UI = {
  variant: ['A', 'B', 'C'].includes(params.get('variant')) ? params.get('variant') : 'A',
  seat: params.get('seat') === 'gl' ? 'gl' : 'exco',
  tab: 'pending', q: '', sel: new Set(), open: null, rejecting: null, seating: null, confirming: null,
  inviting: false, invite: null, cur: null,
};
const VARIANTS = { A: 'Table', B: 'Inbox', C: 'Workbench' };

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 5200); }

// ---- shared renderers (small parts all takes reuse; layout is each take's own) ----
function statusChip(p) {
  if (p.status === 'invited') return '<span class="chip amber">Invited — not signed in yet</span>';
  if (p.status === 'deactivated') return '<span class="chip grey">Deactivated</span>';
  return '<span class="chip">Active</span>';
}
function seatChips(p) {
  const c = p.seats.map((s, i) => `<span class="chip ${i % 2 ? 'pink' : ''}">${esc(s)}</span>`);
  if (superAdmin(p)) c.push('<span class="chip amber">Super Admin</span>');
  return c.length ? `<span class="seatchips">${c.join('')}</span>` : '<span class="note">Volunteer — no seat</span>';
}
function toggle(name, id, on, perm, label) {
  return `<label class="sw ${perm.ok ? '' : 'off'}"><input type="checkbox" data-sw="${name}" data-id="${id}" ${on ? 'checked' : ''} ${perm.ok ? '' : 'disabled'}><span class="tr"></span>${label}</label>`;
}
function seatEditor(p) {
  const exco = EXCO.find(s => p.seats.includes(s)) || '';
  const box = (v, lab) => `<label><input type="checkbox" name="seat" value="${esc(v)}" ${p.seats.includes(v) ? 'checked' : ''}> ${esc(lab || v)}</label>`;
  return `<div class="seated" data-seated="${p.id}">
    <div><b>Exco seat</b> <select name="exco"><option value="">None</option>${EXCO.map(s => `<option ${s === exco ? 'selected' : ''}>${s}</option>`).join('')}</select> ${box('General Liaison')}</div>
    <div><b>At ${esc(branchOf(p.branch))}</b> ${p.branch ? BSEATS.map(s => box(s)).join('') : '<span class="note">Branch seats need a branch — move them first.</span>'}</div>
    <div><b>Department Head of</b> ${DEPTS.map(d => box('Head · ' + d, d)).join('')}</div>
    <div class="flag" style="margin:0"><b>Open question.</b> Is a seat assigned here, one person at a time — or from the seat's side (“who is UCT's Branch Manager?”), where giving it to someone takes it off the last holder? This editor can leave a branch with two Branch Managers.</div>
    <div class="row"><button class="btn sm primary" data-act="saveSeats" data-id="${p.id}">Save seats</button><button class="btn sm quiet" data-act="cancelSeats">Cancel</button></div>
  </div>`;
}
// The five switches. layout: 'grid' | 'list'
function switchBoard(p, layout) {
  if (p.status === 'invited') {
    return `<div class="good">Invited by <b>${esc(p.invitedBy)}</b> on ${esc(p.since)}. Nobody has signed in on this address yet, so there is no account to switch — only an invitation to withdraw.</div>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-act="copyLink">Copy the link again</button><button class="btn sm danger" data-act="withdrawInvite" data-id="${p.id}">Withdraw invitation</button></div>
      <div class="flag"><b>Open question.</b> A withdrawn invitation leaves no trace — it isn't an account, so it can't go to Deleted. Should withdrawals be recorded somewhere (who withdrew whose invitation, when)?</div>`;
  }
  const cs = can('seats', p), ca = can('sa', p), cd = can('delete', p), cact = can('active', p), cb = can('branch', p);
  const item = (title, owner, body, locked) => `<div class="sitem ${locked ? 'locked' : ''}"><div class="sh"><b>${title}</b></div>${body}<div class="owner" style="margin-top:6px">${locked ? `<span class="lock">${esc(owner)}</span>` : esc(owner)}</div></div>`;
  const seats = item('Seats', cs.why, `${seatChips(p)}${cs.ok ? (UI.seating === p.id ? seatEditor(p) : `<div style="margin-top:8px"><button class="btn sm" data-act="editSeats" data-id="${p.id}">Change seats</button></div>`) : ''}`, !cs.ok);
  const sa = item('Super Admin', ca.why, toggle('sa', p.id, superAdmin(p), ca, superAdmin(p) ? 'Reads every hub but Users & Meetings' : 'Off'), !ca.ok);
  const act = item('Active', cact.why, toggle('active', p.id, p.status === 'active', cact, p.status === 'active' ? 'Active' : 'Deactivated'), !cact.ok);
  const br = item('Branch', cb.why, `<select data-sw="branch" data-id="${p.id}" ${cb.ok ? '' : 'disabled'}><option value="">No branch</option>${BRANCHES.map(b => `<option ${b === p.branch ? 'selected' : ''}>${b}</option>`).join('')}</select>`, !cb.ok);
  const dl = item('Delete', cd.why, UI.confirming === p.id
    ? `<div class="confirm"><b>Delete ${esc(p.name)} for good?</b> The account cannot be restored. A record of who, when and by whom stays in Deleted. <div class="row" style="margin-top:8px"><button class="btn sm danger solid" data-act="del" data-id="${p.id}">Delete for good</button><button class="btn sm quiet" data-act="cancelDel">Keep</button></div></div>`
    : `<button class="btn sm danger" data-act="askDel" data-id="${p.id}" ${cd.ok ? '' : 'disabled'}>Delete account</button>`, !cd.ok);
  return `<div class="sboard ${layout === 'grid' ? 'grid' : ''}">${act}${br}${seats}${sa}${dl}</div>`;
}
function rejectBox(r) {
  return `<div style="display:grid;gap:8px">
    <textarea id="reason-${r.id}" placeholder="Reason (optional) — ${esc(r.name.split(' ')[0])} will see this when they sign in"></textarea>
    <div class="row"><button class="btn sm danger solid" data-act="doReject" data-id="${r.id}">Reject</button><button class="btn sm quiet" data-act="cancelReject">Cancel</button></div></div>`;
}
// The invite composer — the user's own three steps.
function inviteComposer(compact) {
  const s = UI.invite;
  const done = s && s.kind !== 'refuse';
  return `<div class="inv">
    ${compact ? '' : '<p class="eyebrow">Invite</p>'}
    <h3 class="title" style="font-size:${compact ? 16 : 20}px">Invite someone to Save7 OS<span class="dot">.</span></h3>
    <p class="sm" style="margin:6px 0 14px">They skip the course and arrive already approved. Save7 OS sends no email — you send it.</p>
    <div class="steps">
      <div class="stp"><span class="num">1</span><div>
        <div class="row"><input type="email" id="invAddr" class="grow" placeholder="name@save7.org" value="${esc(s ? s.addr || UI.invAddr || '' : UI.invAddr || '')}" ${done ? 'disabled' : ''} aria-label="Save7 address to invite">
        ${done ? '' : '<button class="btn primary sm" data-act="genLink">Generate link</button>'}</div>
        <p class="note" style="margin:6px 0 0">A Save7 address you've already arranged for them.</p>
        ${s && s.kind === 'refuse' ? `<div class="refuse" style="margin-top:8px">${esc(s.msg)}</div>` : ''}
      </div></div>
      <div class="stp ${done ? '' : 'dim'}"><span class="num pink">2</span><div>
        <b class="strong sm">Registration link</b>
        ${done ? `<div class="good" style="margin:8px 0">${esc(s.msg)}</div><div class="linkbox"><span class="grow">${SIGNIN}</span><button class="btn sm" data-act="copyLink">Copy</button></div>
        <div class="flag"><b>Open question.</b> The link only points at the Sign-in page, so every invitation “generates” the same address. Should it carry the invited address (so the Sign-in page fills it in), or should this step just say “here's the link to send”?</div>` : '<p class="note" style="margin:4px 0 0">Appears once the address is accepted.</p>'}
      </div></div>
      <div class="stp ${done ? '' : 'dim'}"><span class="num amber">3</span><div>
        <b class="strong sm">Send it yourself</b>
        <div class="row" style="margin-top:8px">
          ${done ? `<button class="btn sm" data-act="copyLink">Copy link</button><a class="btn sm primary" style="text-decoration:none" href="${mailto(s.addr)}">Open in my email client</a>` : '<button class="btn sm" disabled>Copy link</button><button class="btn sm" disabled>Open in my email client</button>'}
        </div>
        ${done ? '<div class="row" style="margin-top:10px"><button class="btn sm quiet" data-act="invAnother">Invite someone else</button></div>' : ''}
      </div></div>
    </div></div>`;
}

function renderA() {
  const c = counts(), q = UI.q, rows = results(UI.tab);
  const other = TABS.filter(([k]) => k !== UI.tab && q && c[k]).map(([k, t]) => `<button data-act="tab" data-tab="${k}">${t} (${c[k]})</button>`).join(' ');
  let body = '';
  if (UI.tab === 'pending') {
    const all = rows.length && rows.every(r => UI.sel.has(r.id));
    body = (UI.sel.size ? `<div class="bulk"><span class="grow"><b>${UI.sel.size}</b> selected</span><button class="btn sm ok" data-act="approveSel">Approve ${UI.sel.size}</button><button class="btn sm quiet" style="color:#fff" data-act="clearSel">Clear</button></div>` : '') +
    `<div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:36px"><input type="checkbox" data-act="selAll" ${all ? 'checked' : ''} aria-label="Select all"></th><th>Person</th><th>Branch they named</th><th>Asked</th><th>Normally answered by</th><th style="text-align:right">Answer</th></tr></thead><tbody>${
      rows.map((r, i) => `<tr class="${UI.sel.has(r.id) ? 'sel' : ''}"><td><input type="checkbox" data-act="sel" data-id="${r.id}" ${UI.sel.has(r.id) ? 'checked' : ''}></td>
        <td><div class="person"><span class="av ${i % 2 ? 'p' : ''}">${initials(r.name)}</span><div><b>${esc(r.name)}</b><span>${esc(r.email)}</span></div></div></td>
        <td>${r.branch ? esc(r.branch) : '<span class="chip grey">No branch</span>'}</td>
        <td class="mono">${esc(r.asked)}${r.again ? ' <span class="chip pink">Asked again</span>' : ''}</td>
        <td class="sm">${esc(answersFor(r))}</td>
        <td style="text-align:right">${UI.rejecting === r.id ? '' : `<div class="row" style="justify-content:flex-end"><button class="btn sm ok" data-act="approve" data-id="${r.id}">Approve</button><button class="btn sm danger" data-act="reject" data-id="${r.id}">Reject</button></div>`}</td></tr>
        ${UI.rejecting === r.id ? `<tr><td></td><td colspan="5" class="exp">${rejectBox(r)}</td></tr>` : ''}`).join('') || '<tr><td colspan="6" class="empty">Nobody is waiting.</td></tr>'
    }</tbody></table></div>
    <div class="flag"><b>Open question.</b> Select-all approves in bulk, but there's no bulk <em>reject</em> — a rejection is one person and one reason. Leave it out?</div>`;
  } else if (UI.tab === 'approved') {
    body = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Person</th><th>Branch</th><th>Seats</th><th>Status</th><th>Last seen</th><th></th></tr></thead><tbody>${
      rows.map((p, i) => `<tr class="click ${UI.open === p.id ? 'open' : ''}" data-act="openRow" data-id="${p.id}">
        <td><div class="person"><span class="av ${p.status === 'invited' ? 'ghost' : i % 2 ? 'p' : ''}">${initials(p.name)}</span><div><b>${esc(p.name)}</b><span>${esc(p.email)}</span></div></div></td>
        <td>${p.branch ? esc(p.branch) : '<span class="chip grey">No branch</span>'}</td>
        <td>${seatChips(p)}</td><td>${statusChip(p)}${p.invitedBy && p.status !== 'invited' ? `<div class="xs muted" style="margin-top:3px">Invited by ${esc(p.invitedBy)}</div>` : ''}</td>
        <td class="sm">${esc(p.seen)}</td><td class="sm" style="color:var(--pink-ink);font-weight:700">${UI.open === p.id ? 'Close ▴' : 'Switches ▾'}</td></tr>
        ${UI.open === p.id ? `<tr><td colspan="6" class="exp">${switchBoard(p, 'grid')}</td></tr>` : ''}`).join('') || '<tr><td colspan="6" class="empty">No one matches.</td></tr>'
    }</tbody></table></div>`;
  } else if (UI.tab === 'rejected') {
    body = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Person</th><th>Branch</th><th>Reason they were shown</th><th>Rejected by</th><th>On</th></tr></thead><tbody>${
      rows.map((r, i) => `<tr><td><div class="person"><span class="av ${i % 2 ? 'p' : ''}">${initials(r.name)}</span><div><b>${esc(r.name)}</b><span>${esc(r.email)}</span></div></div>${r.again ? '<span class="chip pink" style="margin-top:4px">Asked again — now Pending</span>' : ''}</td>
        <td>${esc(branchOf(r.branch))}</td><td class="sm">${r.reason ? '“' + esc(r.reason) + '”' : '<span class="note">No reason given</span>'}</td><td class="sm">${esc(r.by)}</td><td class="mono sm">${esc(r.on)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No rejections.</td></tr>'
    }</tbody></table></div>`;
  } else {
    body = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Who</th><th>Branch they were in</th><th>Deleted on</th><th>By</th></tr></thead><tbody>${
      rows.map(r => `<tr><td><div class="person"><span class="av gone">${initials(r.name)}</span><div><b>${esc(r.name)}</b><span>${esc(r.email)}</span></div></div></td><td>${esc(branchOf(r.branch))}</td><td class="mono sm">${esc(r.on)}</td><td class="sm">${esc(r.by)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nothing deleted.</td></tr>'
    }</tbody></table></div><p class="note" style="margin-top:10px">A record only. Nothing here can be restored, and it is not a ban — a deleted person may ask for access again.</p>`;
  }
  return `<div class="A-head"><div><p class="eyebrow">Users</p><h1 class="title" style="font-size:30px">User approval<span class="dot">.</span></h1></div>
      <button class="btn primary" data-act="openInvite">+ Invite someone</button></div>
    <div class="A-tools"><div class="search"><input type="text" id="q" placeholder="Search everyone — Pending, Approved, Rejected and Deleted" value="${esc(q)}"></div>
      <div class="row"><div class="tabs" role="tablist">${TABS.map(([k, t]) => `<button class="tab" role="tab" aria-selected="${UI.tab === k}" data-act="tab" data-tab="${k}">${t}<span class="n ${q && c[k] ? 'hit' : ''}">${c[k]}</span></button>`).join('')}</div>
      ${other ? `<span class="alsoin">Also matching in ${other}</span>` : ''}</div></div>
    ${body}`;
}

function renderB() {
  const c = counts(), q = UI.q;
  const tabsToShow = q ? TABS.filter(([k]) => c[k]) : TABS.filter(([k]) => k === UI.tab);
  const items = tabsToShow.map(([k, t]) => (q ? `<div class="B-group">${t} · ${c[k]}</div>` : '') + results(k).map((r, i) => {
    const key = k + ':' + r.id, cur = UI.cur === key;
    const sub = k === 'pending' ? `${branchOf(r.branch)} · asked ${r.asked}` : k === 'approved' ? `${branchOf(r.branch)} · ${r.status === 'invited' ? 'invited, not signed in' : r.status === 'deactivated' ? 'deactivated' : r.seats[0] || 'Volunteer'}` : k === 'rejected' ? `rejected ${r.on} by ${r.by}` : `deleted ${r.on} by ${r.by}`;
    return `<div class="B-item ${cur ? 'cur' : ''}" data-act="pick" data-key="${key}">
      ${k === 'pending' ? `<input type="checkbox" data-act="sel" data-id="${r.id}" ${UI.sel.has(r.id) ? 'checked' : ''} aria-label="Select ${esc(r.name)}">` : ''}
      <span class="av ${k === 'deleted' ? 'gone' : r.status === 'invited' ? 'ghost' : i % 2 ? 'p' : ''}">${initials(r.name)}</span>
      <div class="grow" style="min-width:0"><b>${esc(r.name)}</b><div class="sub">${esc(sub)}</div></div>
      ${k === 'approved' && r.status !== 'active' ? (r.status === 'invited' ? '<span class="chip amber">Invited</span>' : '<span class="chip grey">Off</span>') : ''}${r.again ? '<span class="chip pink">Again</span>' : ''}
    </div>`;
  }).join('')).join('') || '<div class="empty">No one matches.</div>';
  const pend = results('pending'), all = pend.length && pend.every(r => UI.sel.has(r.id));
  const bulk = (UI.tab === 'pending' || q) && pend.length ? `<div class="B-bulkbar"><label class="row" style="gap:6px"><input type="checkbox" data-act="selAll" ${all ? 'checked' : ''}> Select all pending</label><span class="grow"></span>${UI.sel.size ? `<button class="btn sm ok" data-act="approveSel">Approve ${UI.sel.size}</button>` : ''}</div>` : '';

  // right pane
  let pane;
  if (UI.cur === 'invite') pane = `<div class="card pink">${inviteComposer(false)}</div>`;
  else if (UI.cur) {
    const [k, id] = UI.cur.split(':'); const r = rowsOf(k).find(x => x.id === id);
    if (!r) pane = paneEmpty();
    else {
      const head = (sub, cls) => `<div class="phead"><span class="av lg ${cls || ''}">${initials(r.name)}</span><div><p class="eyebrow ${k === 'approved' ? 'teal' : ''}">${TABS.find(t => t[0] === k)[1]}</p><h2 class="title" style="font-size:24px">${esc(r.name)}</h2><div class="sm muted">${esc(r.email)}</div>${sub || ''}</div></div>`;
      if (k === 'pending') pane = `<div class="card">${head()}
        <dl class="fields"><dt>Branch they named</dt><dd>${esc(branchOf(r.branch))}</dd><dt>Finished the course</dt><dd>${esc(r.course)}</dd><dt>Asked</dt><dd>${esc(r.asked)}${r.again ? ' — asking again after a rejection' : ''}</dd><dt>Normally answered by</dt><dd>${esc(answersFor(r))}</dd></dl>
        <p class="note">An access request carries nothing else — no message, no free text.</p>
        <div style="margin-top:16px">${UI.rejecting === r.id ? rejectBox(r) : `<div class="row"><button class="btn ok" data-act="approve" data-id="${r.id}">Approve into ${esc(branchOf(r.branch))}</button><button class="btn danger" data-act="reject" data-id="${r.id}">Reject…</button></div>`}</div></div>`;
      else if (k === 'approved') pane = `<div class="card">${head(`<div class="row" style="margin-top:6px">${statusChip(r)}${r.invitedBy && r.status !== 'invited' ? `<span class="chip pink">Invited by ${esc(r.invitedBy)}</span>` : ''}</div>`, r.status === 'invited' ? 'ghost' : '')}
        ${r.status === 'invited' ? '' : `<dl class="fields" style="margin-bottom:16px"><dt>Branch</dt><dd>${esc(branchOf(r.branch))}</dd><dt>Seats</dt><dd>${seatChips(r)}</dd><dt>In since</dt><dd>${esc(r.since)}</dd><dt>Last seen</dt><dd>${esc(r.seen)}</dd></dl><p class="card-label">Switches</p>`}
        ${switchBoard(r, 'list')}</div>`;
      else if (k === 'rejected') pane = `<div class="card">${head()}<dl class="fields"><dt>Branch they named</dt><dd>${esc(branchOf(r.branch))}</dd><dt>Rejected by</dt><dd>${esc(r.by)}</dd><dt>On</dt><dd>${esc(r.on)}</dd><dt>Reason they see</dt><dd>${r.reason ? '“' + esc(r.reason) + '”' : '<span class="note">None given</span>'}</dd></dl>${r.again ? '<div class="good" style="margin-top:14px">They have asked again — the new request is in Pending. This rejection stays as it was.</div>' : '<p class="note" style="margin-top:14px">They may ask again whenever they like.</p>'}</div>`;
      else pane = `<div class="card">${head('', 'gone')}<dl class="fields"><dt>Branch they were in</dt><dd>${esc(branchOf(r.branch))}</dd><dt>Deleted on</dt><dd>${esc(r.on)}</dd><dt>By</dt><dd>${esc(r.by)}</dd></dl><p class="note" style="margin-top:14px">A record only — nothing to restore. Not a ban: they may ask for access again.</p></div>`;
    }
  } else pane = paneEmpty();

  return `<div class="row" style="margin-bottom:14px;align-items:flex-end"><div class="grow"><p class="eyebrow">Users</p><h1 class="title" style="font-size:28px">User approval<span class="dot">.</span></h1></div></div>
  <div class="B"><div class="B-list">
      <div class="lhead"><div class="search"><input type="text" id="q" placeholder="Search all four" value="${esc(q)}"></div>
        <div class="seg" role="tablist">${TABS.map(([k, t]) => `<button role="tab" aria-selected="${!q && UI.tab === k}" data-act="tab" data-tab="${k}">${t} <span class="n">${c[k]}</span></button>`).join('')}</div></div>
      <div class="B-invite ${UI.cur === 'invite' ? 'cur' : ''}" data-act="pick" data-key="invite"><span class="av p">+</span>Invite someone to Save7 OS</div>
      ${bulk}<div class="B-items">${items}</div>
    </div><div class="B-pane">${pane}</div></div>`;
}
function paneEmpty() {
  return `<div class="card tint-teal" style="display:flex;gap:18px;align-items:center"><div class="circles" aria-hidden="true"></div><div><h3 class="title">Pick someone on the left<span class="dot">.</span></h3><p class="sm">${DB.pending.length} ${DB.pending.length === 1 ? 'person is' : 'people are'} waiting in Pending. Tick several to approve them together.</p></div></div>`;
}

// =====================================================================
// TAKE C — Workbench
// =====================================================================
function renderC() {
  const c = counts(), q = UI.q;
  const hints = { pending: 'waiting for an answer', approved: `${DB.people.filter(p => p.status === 'invited').length} invited · ${DB.people.filter(p => p.status === 'deactivated').length} deactivated`, rejected: 'may ask again', deleted: 'a record, no restore' };
  const stats = `<div class="C-stats" role="tablist">${TABS.map(([k, t]) => `<button class="stat" role="tab" aria-selected="${UI.tab === k}" data-act="tab" data-tab="${k}"><span class="lbl">${t}</span><span class="big">${c[k]}</span><span class="hint">${q ? 'matching “' + esc(q) + '”' : hints[k]}</span></button>`).join('')}</div>`;
  const rows = results(UI.tab);
  let body;
  if (UI.tab === 'pending') {
    const all = rows.length && rows.every(r => UI.sel.has(r.id));
    body = `<div class="row" style="margin-bottom:12px"><h3 class="title grow">Waiting for an answer</h3>
      ${rows.length ? `<label class="row sm" style="gap:6px"><input type="checkbox" data-act="selAll" ${all ? 'checked' : ''}> Select all</label>` : ''}
      ${rows.length ? `<button class="btn ok" data-act="${UI.sel.size ? 'approveSel' : 'approveAll'}">${UI.sel.size ? `Approve ${UI.sel.size} selected` : `Approve all ${rows.length}`}</button>` : ''}</div>
      <div class="C-queue">${rows.map((r, i) => `<div class="qcard ${UI.sel.has(r.id) ? 'sel' : ''}"><input type="checkbox" class="pick" data-act="sel" data-id="${r.id}" ${UI.sel.has(r.id) ? 'checked' : ''} aria-label="Select ${esc(r.name)}">
        <div class="top"><span class="av ${i % 2 ? 'p' : ''}">${initials(r.name)}</span><div><b>${esc(r.name)}</b><span>${esc(r.email)}</span></div></div>
        <div class="row xs"><span class="chip ${r.branch ? '' : 'grey'}">${esc(branchOf(r.branch))}</span><span class="muted">asked ${esc(r.asked)}</span>${r.again ? '<span class="chip pink">Asked again</span>' : ''}</div>
        <div class="xs muted">Normally ${esc(answersFor(r))}'s to answer</div>
        ${UI.rejecting === r.id ? rejectBox(r) : `<div class="row"><button class="btn sm ok grow" data-act="approve" data-id="${r.id}">Approve</button><button class="btn sm danger" data-act="reject" data-id="${r.id}">Reject</button></div>`}
      </div>`).join('') || '<div class="empty">Nobody is waiting. 🎉</div>'}</div>
      <div class="flag"><b>Open question.</b> “Approve all” with nothing ticked approves every request on screen, across every branch. Should the big button ask first when it reaches branches that aren't normally yours to answer?</div>`;
  } else if (UI.tab === 'approved') {
    body = `<h3 class="title" style="margin-bottom:12px">Everyone who is in</h3><div class="C-people">${rows.map((p, i) => {
      if (p.status === 'invited') return `<div class="pcard" style="border-style:dashed;border-color:var(--amber)"><div class="top"><span class="av ghost">${initials(p.name)}</span><div><b>${esc(p.name)}</b><span>Invited by ${esc(p.invitedBy)} · ${esc(p.since)}</span></div></div>${statusChip(p)}${switchBoard(p, 'list')}</div>`;
      const cact = can('active', p), cb = can('branch', p), cs = can('seats', p), ca = can('sa', p), cd = can('delete', p);
      const lk = x => x.ok ? '' : ` <span class="lock">${esc(x.why)}</span>`;
      return `<div class="pcard"><div class="top"><span class="av ${i % 2 ? 'p' : ''}">${initials(p.name)}</span><div class="grow"><b>${esc(p.name)}</b><span>${esc(p.email)} · seen ${esc(p.seen)}</span></div>${p.status === 'deactivated' ? '<span class="chip grey">Deactivated</span>' : ''}</div>
        ${p.invitedBy ? `<span class="chip pink" style="justify-self:start">Invited by ${esc(p.invitedBy)}</span>` : ''}
        <div class="face">
          <div class="line"><span class="k">Active</span><span>${toggle('active', p.id, p.status === 'active', cact, '')}${lk(cact)}</span></div>
          <div class="line"><span class="k">Branch</span><span><select data-sw="branch" data-id="${p.id}" ${cb.ok ? '' : 'disabled'}><option value="">No branch</option>${BRANCHES.map(b => `<option ${b === p.branch ? 'selected' : ''}>${b}</option>`).join('')}</select></span></div>
          <div class="line" style="align-items:flex-start"><span class="k">Seats</span><span style="text-align:right">${seatChips(p)}${cs.ok ? ` <button class="btn sm quiet" data-act="editSeats" data-id="${p.id}">Change</button>` : `<div>${lk(cs)}</div>`}</span></div>
          ${UI.seating === p.id ? seatEditor(p) : ''}
          <div class="line"><span class="k">Super Admin</span><span>${toggle('sa', p.id, superAdmin(p), ca, '')}${lk(ca)}</span></div>
          <div class="line"><span class="k">Delete</span><span>${UI.confirming === p.id ? '' : `<button class="btn sm danger" data-act="askDel" data-id="${p.id}" ${cd.ok ? '' : 'disabled'}>Delete…</button>`}${lk(cd)}</span></div>
          ${UI.confirming === p.id ? `<div class="confirm"><b>Delete ${esc(p.name)} for good?</b> Cannot be restored; a record stays in Deleted.<div class="row" style="margin-top:8px"><button class="btn sm danger solid" data-act="del" data-id="${p.id}">Delete for good</button><button class="btn sm quiet" data-act="cancelDel">Keep</button></div></div>` : ''}
        </div></div>`;
    }).join('') || '<div class="empty">No one matches.</div>'}</div>`;
  } else {
    const del = UI.tab === 'deleted';
    body = `<h3 class="title" style="margin-bottom:14px">${del ? 'Accounts that are gone' : 'Requests that were turned down'}</h3><div class="ledger">${rows.map(r => `<div class="lent ${del ? 'del' : ''}"><span class="when">${esc(r.on.replace(/ 20\d\d$/, ''))}</span><div class="box">
      ${del ? `<b class="strong">${esc(r.by)}</b> deleted <b class="strong">${esc(r.name)}</b> <span class="muted">(${esc(r.email)}, ${esc(branchOf(r.branch))})</span>`
            : `<b class="strong">${esc(r.by)}</b> rejected <b class="strong">${esc(r.name)}</b> <span class="muted">(${esc(branchOf(r.branch))})</span><div style="margin-top:4px">${r.reason ? '“' + esc(r.reason) + '”' : '<span class="note">No reason given.</span>'}</div>${r.again ? '<span class="chip pink" style="margin-top:6px">Asked again — now Pending</span>' : ''}`}
    </div></div>`).join('') || '<div class="empty">Nothing here.</div>'}</div>${del ? '<p class="note">A record only — nothing to restore, and not a ban.</p>' : ''}`;
  }
  return `<div class="C-top"><div>
      <p class="eyebrow">Users</p><h1 class="title" style="font-size:30px">User approval<span class="dot">.</span></h1>
      <div class="search" style="margin-top:14px"><input type="text" id="q" placeholder="Search everyone, in all four" value="${esc(q)}"></div>
      ${stats}${body}</div>
    <aside class="C-invite"><div class="circles" aria-hidden="true"></div>${inviteComposer(true)}</aside></div>`;
}

// =====================================================================
// Shell + switcher
// =====================================================================
const NAV = [
  ['Dashboard', 'dash'], ['OKRs Hub'], ['Finance Hub'], ['Operations Hub'],
  ['National Centre', 'group'], ['Projects Hub', 'sub'], ['Departments Hub', 'sub'], ['Media', 'sub2'], ['Tech', 'sub2'], ['Research', 'sub2'], ['Education', 'sub2'], ['Events Hub', 'sub'],
  ['Branch Centre', 'group'], ['Branch Managers hub', 'sub'], ['Branch Operations Managers hub', 'sub'], ['Branch Finance Managers hub', 'sub'],
  ['Users', 'active'],
];
function renderShell() {
  document.getElementById('nav').innerHTML = NAV.map(([n, k]) => k === 'group' ? `<li class="group">${n}</li>` : `<li class="${k === 'sub' || k === 'sub2' ? k : ''}"><a href="#" class="${k === 'active' ? 'active' : k === 'dash' ? 'dash' : ''}" data-act="nav">${n}</a></li>`).join('');
}
function render() {
  const a = actor();
  const head = `<div class="topbar"><div class="crumb">Save7 OS / <b>Users</b></div><div class="me"><div class="who"><b>${esc(a.name)}</b>${esc(a.role)}</div><span class="av ${UI.seat === 'gl' ? 'p' : ''}">${initials(a.name)}</span></div></div>`;
  const focused = document.activeElement && document.activeElement.id;
  const caret = focused === 'q' ? document.activeElement.selectionStart : null;
  const invVal = document.getElementById('invAddr') ? document.getElementById('invAddr').value : null;
  if (invVal !== null) UI.invAddr = invVal;
  document.getElementById('main').innerHTML = head + (UI.variant === 'A' ? renderA() : UI.variant === 'B' ? renderB() : renderC());
  if (focused === 'q') { const q = document.getElementById('q'); q.focus(); q.setSelectionRange(caret, caret); }
  if (focused === 'invAddr' && document.getElementById('invAddr')) document.getElementById('invAddr').focus();
  // A's invite lives in a dialog
  document.getElementById('modal').innerHTML = UI.variant === 'A' && UI.inviting ? `<div class="scrim" data-act="closeInvite"><div class="dialog" role="dialog" aria-modal="true" aria-label="Invite someone" data-stop>${inviteComposer(false)}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn quiet" data-act="closeInvite">Close</button></div></div></div>` : '';
  renderSwitch();
}
function renderSwitch() {
  const ks = Object.keys(VARIANTS);
  document.getElementById('pswitch').innerHTML = `<button data-act="vprev" aria-label="Previous take">←</button><span class="lbl">${UI.variant} · ${VARIANTS[UI.variant]}</span><button data-act="vnext" aria-label="Next take">→</button>
    <span class="sep"></span><span class="k">Seat</span>${Object.entries(SEATS_AS).map(([k, s]) => `<button class="${UI.seat === k ? 'on' : ''}" data-act="seat" data-seat="${k}">${s.short}</button>`).join('')}
    <span class="sep"></span><button data-act="reset">Reset</button>`;
}
function setURL() { const u = new URL(location); u.searchParams.set('variant', UI.variant); u.searchParams.set('seat', UI.seat); history.replaceState(null, '', u); }
function cycle(d) { const ks = Object.keys(VARIANTS); UI.variant = ks[(ks.indexOf(UI.variant) + d + ks.length) % ks.length]; UI.inviting = false; setURL(); render(); }

// =====================================================================
// events
// =====================================================================
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A' && act === 'nav') e.preventDefault();
  if (act === 'sel' || act === 'selAll') return; // handled on change
  // clicks on controls inside an expandable row shouldn't toggle the row
  if (act === 'openRow' && e.target.closest('input,select,button,label,textarea')) return;
  switch (act) {
    case 'nav': toast('Only the Users hub is drawn in this prototype.'); return;
    case 'vprev': return cycle(-1);
    case 'vnext': return cycle(1);
    case 'seat': UI.seat = el.dataset.seat; UI.seating = null; UI.confirming = null; setURL(); render(); toast(UI.seat === 'gl' ? 'Now as the General Liaison: same page, but seats, Super Admin and delete are locked, and active only on branchless people.' : 'Now as National Exco: every switch is live.'); return;
    case 'reset': DB = seed(); Object.assign(UI, { tab: 'pending', q: '', open: null, rejecting: null, seating: null, confirming: null, invite: null, invAddr: '', inviting: false, cur: null }); UI.sel.clear(); render(); toast('Back to the starting data.'); return;
    case 'tab': UI.tab = el.dataset.tab; if (UI.variant === 'B') UI.q = ''; UI.open = null; UI.rejecting = null; break;
    case 'approve': approve([id]); if (UI.cur === 'pending:' + id) UI.cur = null; break;
    case 'approveSel': approve([...UI.sel]); break;
    case 'approveAll': approve(results('pending').map(r => r.id)); break;
    case 'clearSel': UI.sel.clear(); break;
    case 'reject': UI.rejecting = id; break;
    case 'cancelReject': UI.rejecting = null; break;
    case 'doReject': reject(id, document.getElementById('reason-' + id).value); if (UI.cur === 'pending:' + id) UI.cur = null; break;
    case 'openRow': UI.open = UI.open === id ? null : id; UI.seating = null; UI.confirming = null; break;
    case 'editSeats': UI.seating = id; break;
    case 'cancelSeats': UI.seating = null; break;
    case 'saveSeats': {
      const box = document.querySelector(`[data-seated="${id}"]`);
      const ex = box.querySelector('select[name=exco]').value;
      const s = [...box.querySelectorAll('input[name=seat]:checked')].map(i => i.value);
      setSeats(id, [...(ex ? [ex] : []), ...s]); break;
    }
    case 'askDel': UI.confirming = id; break;
    case 'cancelDel': UI.confirming = null; break;
    case 'del': del(id); if (UI.cur === 'approved:' + id) UI.cur = null; break;
    case 'withdrawInvite': withdrawInvite(id); if (UI.cur === 'approved:' + id) UI.cur = null; break;
    case 'pick': UI.cur = el.dataset.key; UI.rejecting = null; UI.seating = null; UI.confirming = null; if (UI.cur === 'invite' && UI.invite && UI.invite.kind !== 'refuse') {} break;
    case 'openInvite': UI.inviting = true; break;
    case 'closeInvite': if (e.target.closest('[data-stop]') && el.classList.contains('scrim')) return; UI.inviting = false; UI.invite = null; UI.invAddr = ''; break;
    case 'genLink': { const v = document.getElementById('invAddr').value; UI.invAddr = v; UI.invite = tryInvite(v); if (UI.invite.kind !== 'refuse') UI.invite.addr = UI.invite.addr || v.trim().toLowerCase(); break; }
    case 'invAnother': UI.invite = null; UI.invAddr = ''; break;
    case 'copyLink': try { navigator.clipboard.writeText(SIGNIN); } catch (_) {} toast('Copied ' + SIGNIN + ' — paste it wherever you like. It only points at the Sign-in page.'); return;
    default: return;
  }
  render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'sel') { t.checked ? UI.sel.add(t.dataset.id) : UI.sel.delete(t.dataset.id); return render(); }
  if (t.dataset.act === 'selAll') { const ids = results('pending').map(r => r.id); t.checked ? ids.forEach(i => UI.sel.add(i)) : UI.sel.clear(); return render(); }
  if (t.dataset.sw === 'active') { setActive(t.dataset.id, t.checked); return render(); }
  if (t.dataset.sw === 'sa') { setSA(t.dataset.id, t.checked); return render(); }
  if (t.dataset.sw === 'branch') { setBranch(t.dataset.id, t.value); return render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { UI.q = e.target.value; render(); } });
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) { if (e.key === 'Enter' && e.target.id === 'invAddr') document.querySelector('[data-act=genLink]')?.click(); return; }
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
  if (e.key === 'Escape' && UI.inviting) { UI.inviting = false; render(); }
});
// B and C: don't let a pending checkbox click also open the row
document.addEventListener('click', e => { if (e.target.matches('.B-item input[type=checkbox]')) e.stopPropagation(); }, true);

renderShell(); setURL(); render();
</script>
</body>
</html>

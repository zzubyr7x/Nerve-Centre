<title>PROTOTYPE — the Departments group and a Department's hub</title>
<!--
  PROTOTYPE, throwaway. Ticket: "Prototype: the Departments nav group and a Department's hub"
  (zzubyr7x/Nerve-Centre#60). Question: what do the Departments Hub and a Department's hub
  look like on screen, and how does someone go from the front page to the work behind it?

  Three whole-page takes, switchable with ?variant=A|B|C (or the arrows / ← → keys), crossed
  with a seat switcher (?seat=vol|member|inactive|head|exco):
    A  Doorway     — the front page is a poster; members go through a door into the work, which has its own chrome
    B  Two sides   — front page and the work side by side; the work is a visibly locked panel to outsiders
    C  In the nav  — the Department's pages live in the Shell's nav; entering unfolds them
  ?page=dir|dash|media|tech|research|education jumps straight to a page.
  Everything lives in memory, shared across seats, so an act in one seat shows in another.
  Reload resets it. Open questions are amber.
-->
<style>
/* ==========================================================================
   SAVE7 LOOK — the visual vocabulary every prototype on the Nerve Centre map
   shares. Taken from the KEPSA presentation ("KEPSA Slides - SANS"), which the
   user gave on 2026-10-07 as the design direction for the OS and all prototypes.

   Colours were sampled from the rendered PDF, not guessed. Typeface is
   Montserrat (embedded in the deck: Regular, Medium, SemiBold, Bold, italics).

   Use it: paste this file into a prototype's <style> block and put
   class="save7-look" on <body>. A prototype is inlined rather than linked so it
   opens by double-click and survives being emailed; this file is the one source
   the copies are taken from.

   TWO EXTENSIONS beyond what the deck shows, both for small text:
   --teal-ink and --pink-ink are darker twins of the brand teal and pink. The
   brand values are fine for titles, fills and shapes (as the deck uses them) but
   fall below readable contrast as small body text on white.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap');

:root {
  /* brand */
  --navy: #0C173B;
  --teal: #00B7B5;
  --pink: #ED186B;
  --amber: #FFC550;          /* connectors, pins, third-in-sequence — never a main colour */
  --ink: #585858;            /* body text */

  /* tints (card borders, fills, blobs) */
  --teal-border: #E6F7F7;
  --teal-fill: #F4FBFB;
  --mint: #F3FBFB;
  --pink-border: #FCE8F0;
  --pink-fill: #FFF5F7;
  --pink-head: #FCDCE8;
  --amber-fill: #FFF6DD;     /* derived from the amber, for flag callouts */

  /* small-text twins (extension — see header) */
  --teal-ink: #007F7D;
  --pink-ink: #C70F58;
  --amber-ink: #8A5B00;

  --radius: 20px;
  --radius-sm: 12px;
  --font: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }

.save7-look {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink);
  background: #fff;
}

/* ---- the two backdrop blobs: pale mint top-right, pale pink bottom-left ---- */
.save7-look::before,
.save7-look::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  z-index: -1;
  pointer-events: none;
}
.save7-look::before { top: -22vw; right: -16vw; width: 52vw; height: 52vw; background: var(--mint); }
.save7-look::after  { bottom: -20vw; left: -12vw; width: 38vw; height: 38vw; background: var(--pink-fill); }

/* ---- the two-circle motif: big teal, smaller pink, overlapping ---- */
.circles { position: relative; width: 104px; height: 96px; flex: none; }
.circles::before,
.circles::after { content: ''; position: absolute; border-radius: 50%; }
.circles::before { top: 0; right: 0; width: 72px; height: 72px; background: var(--teal); }
.circles::after  { bottom: 0; left: 6px; width: 44px; height: 44px; background: var(--pink); }

/* ---- type ---- */
.eyebrow { margin: 0 0 4px; font-weight: 600; font-size: 13px; color: var(--pink-ink); }
.eyebrow.teal { color: var(--teal-ink); }
.title { margin: 0; font-weight: 700; color: var(--navy); line-height: 1.15; letter-spacing: -0.01em; }
.title .dot { color: var(--pink); }
.title .accent { color: var(--teal); }
h1.title { font-size: 40px; }
h2.title { font-size: 26px; }
h3.title { font-size: 18px; }
.lede { color: var(--ink); font-size: 15px; max-width: 70ch; }
.strong { font-weight: 700; color: var(--navy); }
.muted { color: #8a8a8a; }
.mono { font-variant-numeric: tabular-nums; }

/* ---- cards: white, large radius, hairline tinted border; alternate teal/pink ---- */
.card {
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius);
  padding: 20px 22px;
}
.card.pink { border-color: var(--pink-border); }
.card.tint-teal { background: var(--teal-fill); }
.card.tint-pink { background: var(--pink-fill); }
.card-label { margin: 0 0 10px; font-weight: 700; font-size: 15px; color: var(--navy); }

/* ---- number pills ("01", "BARRIER 01") ---- */
.num {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--teal);
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.num.pink { background: var(--pink); }
.num.amber { background: var(--amber); color: var(--navy); }

/* ---- buttons: outlined teal pill; pink for the primary ---- */
.btn {
  font: 600 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal);
  border-radius: 999px;
  padding: 8px 16px;
  cursor: pointer;
  transition: background 0.12s;
}
.btn:hover { background: var(--teal-fill); }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 700; }
.btn.primary:hover { background: #d4125d; }
.btn.quiet { border-color: transparent; color: var(--ink); }
.btn.quiet:hover { background: var(--teal-fill); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* ---- status chips: small, pale ---- */
.chip {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--teal-border);
  color: var(--teal-ink);
  white-space: nowrap;
}
.chip.pink { background: var(--pink-border); color: var(--pink-ink); }
.chip.amber { background: #FFEFC2; color: var(--amber-ink); }
.chip.grey { background: #F1F1F3; color: #666; }

/* ---- tabs: pill row, active in pink ---- */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  font: 600 13px var(--font);
  color: var(--ink);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
}
.tab:hover { background: var(--teal-fill); }
.tab[aria-selected="true"] { background: var(--pink-fill); border-color: var(--pink); color: var(--pink-ink); }

/* ---- form controls ---- */
input[type="text"], select {
  font: 500 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
}
input[type="text"]::placeholder { color: #a5a5a5; }

/* ---- labelled field rows ---- */
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
.fields dt { font-weight: 600; font-size: 12px; color: #8a8a8a; align-self: center; }
.fields dd { margin: 0; color: var(--navy); font-weight: 600; }

/* ---- timeline bar: alternating teal and pink segments, amber pin on the current one ---- */
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
.bar > i { flex: 1; background: var(--teal); }
.bar > i:nth-child(even) { background: var(--pink); }
.bar > i.todo { opacity: 0.22; }

/* ---- callout: amber, for open questions the user should react to ---- */
.flag {
  background: var(--amber-fill);
  border: 1.5px solid #FFE7A8;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12.5px;
  color: #5a4300;
}
.flag b { color: var(--amber-ink); }

/* ---- logo ---- */
.logo { display: block; height: 22px; width: auto; }


/* ===================== prototype-only layout ===================== */
html, body { height: 100%; }
body.save7-look { background: #fff; }
.proto-banner { position: sticky; top: 0; z-index: 30; background: var(--amber-fill); border-bottom: 1.5px solid #FFE7A8; color: #5a4300; font-size: 12px; padding: 6px 16px; text-align: center; }
.proto-banner b { color: var(--amber-ink); }

/* ---- the Shell: KEPSA-portal white sidebar, pink-tinted active item ---- */
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 31px); }
.side { background: #fff; border-right: 1.5px solid var(--teal-border); padding: 18px 12px 120px; position: sticky; top: 31px; height: calc(100vh - 31px); overflow-y: auto; }
.side .logo { height: 24px; margin: 4px 10px 18px; }
.nav { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.nav li a { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 500; }
.nav li a:hover { background: var(--teal-fill); }
.nav li a.active { background: var(--pink-fill); color: var(--pink-ink); font-weight: 700; }
.nav li a.dash { font-weight: 700; color: var(--navy); }
.nav .grp > a { font-weight: 700; color: var(--navy); }
.nav .chev { margin-left: auto; width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 6px; color: #9a9a9a; font-size: 11px; transition: transform .18s; }
.nav .chev:hover { background: var(--teal-border); color: var(--navy); }
.nav .closed > a .chev { transform: rotate(-90deg); }
.nav ul { list-style: none; margin: 0; padding: 0 0 0 12px; }
.nav .closed > ul { display: none; }
.nav .roomlab { margin: 6px 10px 2px 22px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #a5a5a5; }
.nav .rooms a { font-size: 12.5px; padding: 5px 10px 5px 22px; }
.nav .unfold > li { animation: drop .28s both; animation-delay: calc(var(--i) * 45ms); }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.mk { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex: none; }
.mk.in { background: #c9c9c9; }
.mk.ask { background: var(--amber); }
.mk-head { font-size: 9.5px; font-weight: 700; color: var(--pink-ink); background: var(--pink-border); padding: 1px 6px; border-radius: 999px; }
.uc-dot { font-size: 9.5px; color: #9a9a9a; font-weight: 600; }

.main { padding: 22px 28px 140px; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.crumb { font-size: 12px; color: #8a8a8a; }
.crumb b { color: var(--navy); }
.crumb a { color: #8a8a8a; text-decoration: none; }
.crumb a:hover { color: var(--navy); text-decoration: underline; }
.me { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.me .who { text-align: right; line-height: 1.25; }
.me .who b { color: var(--navy); display: block; }

/* ---- shared bits ---- */
.av { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; font-size: 11px; color: #fff; background: var(--teal); flex: none; }
.av.p { background: var(--pink); }
.av.sm { width: 22px; height: 22px; font-size: 9px; }
.av.gone { background: #d0d0d0; }
.avs { display: inline-flex; }
.avs .av { border: 2px solid #fff; margin-left: -6px; }
.avs .av:first-child { margin-left: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.sm { font-size: 12px; }
.xs { font-size: 11px; }
.note { font-size: 12px; color: #8a8a8a; }
.btn.sm { padding: 5px 12px; font-size: 12px; }
.btn.ok { border-color: var(--teal); background: var(--teal); color: #fff; }
.btn.ok:hover { background: #00a3a1; }
.btn.red { border-color: #F3C3BE; color: #B42318; }
.chip.red { background: #FEE4E2; color: #B42318; }
.chip.navy { background: var(--navy); color: #fff; }
.stack { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.hr { height: 1.5px; background: var(--teal-border); margin: 14px 0; border: 0; }
textarea, input[type="date"], input[type="number"] { font: 500 13px var(--font); color: var(--navy); background: #fff; border: 1.5px solid var(--teal-border); border-radius: var(--radius-sm); padding: 8px 12px; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
input[type="number"] { width: 80px; }
label.f { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: #8a8a8a; }
label.f input[type=text], label.f select, label.f input[type=date] { width: 100%; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--navy); }
.checks label { display: inline-flex; gap: 5px; align-items: center; }
.empty { border: 1.5px dashed var(--teal-border); border-radius: var(--radius-sm); padding: 18px; text-align: center; color: #8a8a8a; font-size: 12.5px; }
.flag { margin: 10px 0; }
.list { display: grid; gap: 8px; }
.li { border: 1.5px solid var(--teal-border); border-radius: var(--radius-sm); padding: 10px 14px; background: #fff; }
.li.pink { border-color: var(--pink-border); }
.li.red { border-color: #F3C3BE; background: #FFFBFA; }
.kv { font-size: 12px; color: #8a8a8a; }
.kv b { color: var(--navy); font-weight: 600; }
.objs { display: flex; flex-wrap: wrap; gap: 6px; }
.obj { font-size: 12px; font-weight: 600; color: var(--navy); background: var(--teal-fill); border: 1.5px solid var(--teal-border); border-radius: 999px; padding: 3px 11px; }
.link { color: var(--teal-ink); font-weight: 600; text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; font: 600 12px var(--font); }
.link:hover { text-decoration: underline; }
.standing { display: inline-flex; align-items: center; gap: 6px; }
.join { display: grid; gap: 8px; }
.join .why { font-size: 12px; color: #8a8a8a; }
.lock { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; }

/* ---- offerings ---- */
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 54px; text-align: center; font-size: 10px; color: #8a8a8a; }
.sw i { display: block; height: 38px; border-radius: 10px; margin-bottom: 3px; }
.lib { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.lib div { aspect-ratio: 1; border-radius: 12px; position: relative; overflow: hidden; }
.lib div span { position: absolute; left: 6px; bottom: 5px; font-size: 9.5px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.cov { display: grid; grid-template-columns: 64px 1fr auto; gap: 4px 12px; font-size: 12.5px; align-items: baseline; }
.cov .d { color: #8a8a8a; font-size: 11.5px; }
.cov .w { color: var(--navy); font-weight: 600; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11.5px; }
.steps span { background: var(--teal-fill); border-radius: 999px; padding: 3px 10px; color: var(--teal-ink); font-weight: 600; }
.steps span:nth-child(even) { background: var(--pink-fill); color: var(--pink-ink); }

/* ---- the Board ---- */
.board { display: grid; grid-template-columns: repeat(4, minmax(190px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--teal-fill); border-radius: 16px; padding: 10px; min-height: 160px; }
.col:nth-child(even) { background: var(--pink-fill); }
.col h4 { margin: 2px 4px 10px; font-size: 12px; color: var(--navy); display: flex; justify-content: space-between; }
.col h4 span { color: #8a8a8a; font-weight: 600; }
.kcard { background: #fff; border: 1.5px solid var(--teal-border); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; display: grid; gap: 6px; transition: box-shadow .12s, transform .12s; }
.kcard:hover { box-shadow: 0 4px 14px rgba(12,23,59,.08); transform: translateY(-1px); }
.kcard.over { border-color: #F3C3BE; box-shadow: inset 3px 0 0 #D92D20; }
.kcard .t { font-weight: 700; color: var(--navy); font-size: 13px; line-height: 1.3; }
.dates { font-size: 11px; color: #8a8a8a; }
.dates b { color: var(--navy); }
.dates .slip { color: var(--pink-ink); font-weight: 700; }
.dates s { color: #b0b0b0; }
.blocked { font-size: 11px; background: #F1F1F3; color: #555; border-radius: 8px; padding: 3px 8px; }
.red { color: #D92D20; }

/* ---- calendar ---- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .h { font-size: 10.5px; font-weight: 700; color: #9a9a9a; text-align: center; padding: 4px 0; }
.cal .d { min-height: 82px; border: 1.5px solid var(--teal-border); border-radius: 10px; padding: 4px 5px; font-size: 11px; background: #fff; display: grid; align-content: start; gap: 3px; }
.cal .d.out { background: #fafafa; border-color: #f2f2f2; color: #c2c2c2; }
.cal .d.today { border-color: var(--pink); }
.cal .n { font-weight: 700; color: #9a9a9a; font-size: 10.5px; }
.cal .today .n { color: var(--pink-ink); }
.ev { border-radius: 7px; padding: 2px 5px; background: var(--teal-border); color: var(--teal-ink); font-weight: 600; font-size: 10.5px; line-height: 1.25; cursor: pointer; }
.ev.pub { background: #F1F1F3; color: #777; text-decoration: line-through; }
.ev.over { background: #FEE4E2; color: #B42318; }
.ev.ghost { background: transparent; border: 1.5px dashed var(--amber); color: var(--amber-ink); cursor: default; }
.ev small { display: block; font-weight: 500; opacity: .8; }

/* ---- tracker ---- */
.kpi { display: grid; grid-template-columns: 1fr 200px 110px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1.5px solid var(--teal-border); font-size: 13px; }
.kpi:last-child { border-bottom: 0; }
.meter { height: 8px; background: var(--teal-border); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--teal); }
.kpi:nth-child(even) .meter i { background: var(--pink); }

/* ---- drawer & modal ---- */
.scrim { position: fixed; inset: 0; background: rgba(12,23,59,.28); z-index: 60; display: flex; justify-content: flex-end; }
.drawer { width: min(520px, 100%); height: 100%; background: #fff; overflow-y: auto; padding: 22px 24px 120px; box-shadow: -12px 0 40px rgba(12,23,59,.15); }
.drawer.anim { animation: slidein .22s ease-out; }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.task { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f2f2f2; }

.imp { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--pink-ink); }
.imp.lo { color: #bbb; }

/* ---- toast ---- */
.toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%) translateY(10px); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 12.5px; max-width: 560px; opacity: 0; pointer-events: none; transition: .2s; z-index: 80; }
.toast.on { opacity: 1; transform: translateX(-50%); }

/* ===================== take A: Doorway ===================== */
.A-hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: stretch; margin-bottom: 18px; }
.A-front { position: relative; padding: 26px 28px; border-radius: 28px; background: linear-gradient(135deg, var(--mint), #fff 65%); border: 1.5px solid var(--teal-border); overflow: hidden; }

.A-door::after { content: ''; position: absolute; right: -40px; bottom: -40px; width: 160px; height: 160px; border-radius: 50%; background: var(--pink); opacity: .25; }
.A-door h3 { color: #fff; margin: 0; font-size: 20px; }
.A-door .rooms { display: flex; flex-wrap: wrap; gap: 6px; }
.A-door .rooms span { font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.08); color: #fff; }
.A-door .rooms span.x { opacity: .4; }
.A-door.shut { background: #fff; color: var(--ink); border: 1.5px dashed var(--pink-border); }
.A-door.shut h3 { color: var(--navy); }
.A-door.shut::after { display: none; }
.A-enter { font: 700 15px var(--font); background: var(--pink); color: #fff; border: 0; border-radius: 999px; padding: 13px 22px; cursor: pointer; display: inline-flex; gap: 10px; align-items: center; justify-self: start; position: relative; z-index: 1; }
.A-enter:hover { background: #d4125d; }
.A-enter .arr { transition: transform .15s; }
.A-enter:hover .arr { transform: translateX(4px); }
.A-offers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.A-offers .card:nth-child(4n+2), .A-offers .card:nth-child(4n+3) { border-color: var(--pink-border); }
.A-offers .wide { grid-column: 1 / -1; }
.A-inside { margin: -22px -28px 0; }
.A-ihead { background: var(--navy); color: #cfd3e3; padding: 18px 28px 0; position: relative; overflow: hidden; }
.A-ihead::before { content: ''; position: absolute; right: 60px; top: -50px; width: 140px; height: 140px; border-radius: 50%; background: var(--teal); opacity: .25; }
.A-ihead::after { content: ''; position: absolute; right: 20px; top: 30px; width: 70px; height: 70px; border-radius: 50%; background: var(--pink); opacity: .35; }
.A-ihead h2 { color: #fff; margin: 4px 0 2px; font-size: 26px; }
.A-ihead .back { color: #cfd3e3; font: 600 12px var(--font); background: none; border: 0; cursor: pointer; padding: 0; }
.A-ihead .back:hover { color: #fff; }
.A-rooms { display: flex; gap: 2px; margin-top: 16px; flex-wrap: wrap; position: relative; z-index: 1; }
.A-rooms button { font: 600 13px var(--font); color: #cfd3e3; background: transparent; border: 0; border-radius: 12px 12px 0 0; padding: 10px 16px; cursor: pointer; }
.A-rooms button:hover { color: #fff; background: rgba(255,255,255,.06); }
.A-rooms button[aria-selected=true] { background: #fff; color: var(--navy); }
.A-ibody { padding: 22px 28px; }
.doors { position: fixed; inset: 0; z-index: 90; pointer-events: none; display: grid; grid-template-columns: 1fr 1fr; }
.doors i { display: block; background: var(--teal); animation: dl .62s cubic-bezier(.7,0,.3,1) .12s both; }
.doors i + i { background: var(--pink); animation-name: dr; }
.doors b { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 34px; font-weight: 700; animation: fade .5s .1s both; }
@keyframes dl { from { transform: none; } to { transform: translateX(-100%); } }
@keyframes dr { from { transform: none; } to { transform: translateX(100%); } }
@keyframes fade { from { opacity: 1; } to { opacity: 0; } }
.A-dir { display: grid; gap: 12px; }
.A-drow { display: grid; grid-template-columns: 200px 1fr 210px; gap: 18px; align-items: center; padding: 18px 22px; border-radius: 22px; border: 1.5px solid var(--teal-border); background: #fff; cursor: pointer; transition: box-shadow .12s; }
.A-drow:nth-child(even) { border-color: var(--pink-border); }
.A-drow:hover { box-shadow: 0 6px 22px rgba(12,23,59,.07); }
.A-drow h2 { margin: 0; font-size: 28px; }

/* ===================== take B: Two sides ===================== */
.B { display: grid; grid-template-columns: minmax(300px, 0.9fr) 1.3fr; gap: 18px; align-items: start; }
.B-front { display: grid; gap: 12px; }
.B-front details { border: 1.5px solid var(--teal-border); border-radius: 16px; background: #fff; }
.B-front details:nth-of-type(even) { border-color: var(--pink-border); }
.B-front summary { cursor: pointer; padding: 12px 16px; font-weight: 700; color: var(--navy); font-size: 13.5px; list-style: none; display: flex; justify-content: space-between; }
.B-front summary::after { content: '+'; color: #aaa; }
.B-front details[open] summary::after { content: '–'; }
.B-front details > div { padding: 0 16px 14px; }
.B-panel { border-radius: 24px; border: 1.5px solid var(--teal-border); background: #fff; padding: 20px; position: sticky; top: 50px; }
.B-panel.locked { background: repeating-linear-gradient(135deg, #fff 0 14px, var(--teal-fill) 14px 28px); }
.B-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.B-tile { border-radius: 16px; border: 1.5px solid var(--teal-border); background: #fff; padding: 12px; display: grid; gap: 8px; min-height: 108px; text-align: left; font: inherit; cursor: pointer; }
.B-tile b { color: var(--navy); font-size: 13px; }
.B-tile:hover { border-color: var(--teal); }
.B-tile.locked { cursor: default; background: rgba(255,255,255,.7); }
.B-tile.locked:hover { border-color: var(--teal-border); }
.B-tile .ph { display: grid; gap: 5px; filter: blur(2.5px); }
.B-tile .ph i { height: 7px; border-radius: 4px; background: var(--teal-border); }
.B-tile .ph i:nth-child(2) { width: 70%; background: var(--pink-border); }
.B-tile .ph i:nth-child(3) { width: 45%; }
.B-in { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: start; }
.B-rail { position: sticky; top: 50px; border-radius: 20px; background: var(--teal-fill); border: 1.5px solid var(--teal-border); padding: 14px 0; display: grid; justify-items: center; gap: 12px; cursor: pointer; min-height: 360px; }
.anim .B-rail { animation: railin .45s ease-out both; }
.B-rail:hover { background: var(--teal-border); }
.B-rail .v { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 700; color: var(--navy); font-size: 15px; letter-spacing: .02em; }
.B-rail .v small { color: #8a8a8a; font-weight: 600; font-size: 11px; }
.B-work { display: grid; grid-template-columns: 180px 1fr; gap: 16px; align-items: start; }
.anim .B-work { animation: unlock .5s ease-out both; }
.B-rooms { display: grid; gap: 4px; position: sticky; top: 50px; }
.B-rooms button { text-align: left; font: 600 13px var(--font); color: var(--ink); background: #fff; border: 1.5px solid transparent; border-radius: 12px; padding: 9px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.B-rooms button:hover { background: var(--teal-fill); }
.B-rooms button[aria-selected=true] { background: var(--pink-fill); border-color: var(--pink); color: var(--pink-ink); }
.B-rooms button.locked { color: #b5b5b5; cursor: default; }
.B-rooms button.locked:hover { background: #fff; }
@keyframes unlock { from { clip-path: inset(0 0 0 55% round 24px); filter: blur(4px); opacity: .4; } to { clip-path: inset(0 0 0 0 round 0); filter: none; opacity: 1; } }
@keyframes railin { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.B-dir { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.B-dcard { border-radius: 24px; padding: 22px; border: 1.5px solid var(--teal-border); background: #fff; display: grid; gap: 10px; cursor: pointer; position: relative; overflow: hidden; }
.B-dcard:nth-child(4n+2), .B-dcard:nth-child(4n+3) { border-color: var(--pink-border); }
.B-dcard:hover { box-shadow: 0 6px 22px rgba(12,23,59,.07); }
.B-dcard .circles { position: absolute; right: -24px; top: -24px; transform: scale(.7); opacity: .18; }

/* ===================== take C: In the nav ===================== */
.C-head { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 20px; background: var(--teal-fill); border: 1.5px solid var(--teal-border); margin-bottom: 14px; flex-wrap: wrap; }
.C-head h1 { font-size: 30px; }
.C-enter { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.C-tabs { margin: 0 0 14px; }
.C-in-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 1.5px solid var(--teal-border); padding-bottom: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.C-in-head h2 { font-size: 22px; }
.C-in-head .badge { font-size: 11px; font-weight: 700; color: #fff; background: var(--navy); border-radius: 999px; padding: 2px 10px; }
.C-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.C-table th { text-align: left; font-size: 11px; color: #9a9a9a; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; padding: 8px 10px; border-bottom: 1.5px solid var(--teal-border); }
.C-table td { padding: 12px 10px; border-bottom: 1.5px solid var(--teal-border); vertical-align: top; }
.C-table tr.click { cursor: pointer; }
.C-table tr.click:hover td { background: var(--teal-fill); }

/* ===================== the prototype switcher ===================== */
.pswitch { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 5px; background: #111; color: #fff; border-radius: 999px; padding: 6px 8px; box-shadow: 0 10px 30px rgba(0,0,0,.35); font: 600 12px system-ui, -apple-system, sans-serif; max-width: calc(100vw - 16px); overflow-x: auto; white-space: nowrap; }
.pswitch button { font: inherit; color: #fff; background: #2a2a2a; border: 0; border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.pswitch button:hover { background: #3a3a3a; }
.pswitch button.on { background: #FFC550; color: #111; }
.pswitch .lbl { padding: 0 8px; min-width: 120px; text-align: center; }
.pswitch .sep { width: 1px; height: 20px; background: #444; margin: 0 3px; flex: none; }
.pswitch .k { color: #999; font-weight: 500; padding-left: 4px; }

@media (max-width: 1100px) {
  .A-hero, .B, .grid2 { grid-template-columns: 1fr; }
  .A-drow { grid-template-columns: 1fr; }
  .B-panel { position: static; }
  .B-work { grid-template-columns: 1fr; }
  .B-rooms { position: static; display: flex; flex-wrap: wrap; }
  .kpi { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; padding: 10px 16px; border-right: 0; border-bottom: 1.5px solid var(--teal-border); }
  .main { padding: 16px 16px 140px; }
  .A-inside { margin: -16px -16px 0; }
  .A-offers, .B-dir, .B-tiles { grid-template-columns: 1fr; }
  .B-in { grid-template-columns: 1fr; }
  .B-rail { min-height: 0; writing-mode: horizontal-tb; }
  .B-rail .v { writing-mode: horizontal-tb; transform: none; }
  .lib { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .doors { display: none; }
}
</style>
</head>

let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 5200); }

// ---- standing & permissions (the model, not the design) ----
function standing(d, pid = me()) {
  if (pid === 'sipho') return 'reads';
  const m = d.members[pid]; if (m) return m;                      // head | active | inactive | deactivated
  if (d.requests.some(r => r.who === pid)) return 'pending';
  if (d.invites.some(r => r.who === pid)) return 'invited';
  if (!d.head) return 'closed';
  if (d.declined[pid]) return 'declined';
  return 'none';
}
const canEnter = d => ['head', 'active', 'inactive', 'reads'].includes(standing(d));
const canWrite = d => ['head', 'active', 'reads'].includes(standing(d));
const canReadReports = d => ['head', 'reads'].includes(standing(d));          // + the General Liaison
const canWriteReports = d => standing(d) === 'head' || (isExco());             // Exco as backstop
const canRunTracker = d => standing(d) === 'head' || isExco();                 // Head, Exco backstop
const canAnswer = () => canWrite(dept('media'));
function canMove(c) { const s = standing(dept('media')); return s === 'head' || s === 'reads' || (s === 'active' && c.opted.includes(me())); }
const canOpt = () => ['head', 'active'].includes(standing(dept('media')));
const overdue = c => c.col !== 'Published' && c.sched < TODAY;
const redOn = c => overdue(c) ? (c.opted.length ? c.opted : [c.acceptedBy]) : [];

  head: ['You head it', 'pink'], active: ['Member', ''], inactive: ['Inactive', 'grey'], deactivated: ['Deactivated', 'grey'],
  pending: ['Request pending', 'amber'], invited: ['Invited', 'amber'], declined: ['Declined', 'grey'], closed: ['No Head yet — closed', 'grey'],
  none: ['Not a member', 'grey'], reads: ['Exco · reads all', 'navy'],
};
const standChip = d => { const [t, c] = STAND_TXT[standing(d)]; return `<span class="chip ${c}">${t}</span>`; };
function roomsFor(d) {
  const base = d.uc ? ['uc', 'tracker', 'reports'] : ['scheduler', 'board', 'calendar', 'tasks', 'tracker', 'reports'];
  return base.map(k => ({ k, ok: k === 'reports' ? canReadReports(d) : canEnter(d) }));

// =====================================================================
// acts
// =====================================================================
function askJoin(d) { d.requests.push({ who: me(), on: TODAY }); delete d.declined[me()]; toast(`Asked to join ${d.name}. It waits on ${nm(d.head)}'s Dashboard until they answer — it never lapses.`); }
function withdrawJoin(d) { d.requests = d.requests.filter(r => r.who !== me()); toast('Request withdrawn. You can ask again any time.'); }
function acceptInvite(d) { d.invites = d.invites.filter(r => r.who !== me()); d.members[me()] = 'active'; toast(`You're a member of ${d.name}.`); }
function declineInvite(d) { d.invites = d.invites.filter(r => r.who !== me()); toast('Invitation declined.'); }
function leave(d) { delete d.members[me()]; UI.inside = false; toast(`You left ${d.name}. You can ask to join again.`); }
function approveJoin(d, who) { d.requests = d.requests.filter(r => r.who !== who); d.members[who] = 'active'; toast(`${nm(who)} is now a member of ${d.name}.`); }
function declineJoin(d, who, reason) { d.requests = d.requests.filter(r => r.who !== who); d.declined[who] = { on: TODAY, reason: reason.trim() }; toast(`Declined ${nm(who)}${reason.trim() ? ', with a reason' : ''}. They may ask again.`); }
function invite(d, who) { d.invites.push({ who, on: TODAY }); toast(`Invited ${nm(who)}. It stands on their Dashboard until they accept or decline.`); }
function withdrawInvite(d, who) { d.invites = d.invites.filter(r => r.who !== who); toast('Invitation withdrawn.'); }
function setInactive(d, who, on) { d.members[who] = on ? 'inactive' : 'active'; toast(on ? `${nm(who)} is inactive in ${d.name}: they can still enter and read, not write.` : `${nm(who)} is active again.`); }
function removeMember(d, who) { delete d.members[who]; toast(`${nm(who)} removed from ${d.name}. They may ask again.`); }

function joinControl(d) {
  const s = standing(d);
  switch (s) {
    case 'none': return `<div class="join"><button class="btn primary" data-act="askJoin">Ask to join ${esc(d.name)}</button><span class="why">${esc(nm(d.head))} answers. Your branch has no say — they own you, the Head owns the work.</span></div>`;
    case 'pending': { const r = d.requests.find(x => x.who === me()); return `<div class="join"><div class="row"><span class="chip amber">Request pending</span><span class="note">since ${fmt(r.on)} · with ${esc(nm(d.head) || 'the next Head')}</span></div><div><button class="btn sm" data-act="withdrawJoin">Withdraw request</button></div></div>`; }
    case 'declined': { const x = d.declined[me()]; return `<div class="join"><div class="row"><span class="chip grey">Declined ${fmt(x.on)}</span></div>${x.reason ? `<div class="li sm">“${esc(x.reason)}” <span class="note">— ${esc(nm(d.head))}</span></div>` : '<span class="why">No reason given.</span>'}<div><button class="btn sm" data-act="askJoin">Ask again</button></div></div>`; }
    case 'closed': return `<div class="join"><button class="btn" disabled>Closed to requests</button><span class="why">${esc(d.name)} has no Head yet, so nobody could answer a request. It opens when Exco switch a Head on.</span></div>`;
    case 'invited': return `<div class="join"><div class="row"><span class="chip amber">${esc(nm(d.head))} invited you</span></div><div class="row"><button class="btn primary sm" data-act="acceptInvite">Accept</button><button class="btn sm" data-act="declineInvite">Decline</button></div></div>`;
    case 'active': return `<div class="join"><div class="row"><span class="chip">You're a member</span><button class="btn quiet sm" data-act="leave">Leave</button></div></div>`;
    case 'inactive': return `<div class="join"><div class="row"><span class="chip grey">Inactive</span><button class="btn quiet sm" data-act="leave">Leave</button></div><span class="why">${esc(nm(d.head))} marked you inactive. You can still go in and read; you can't write until they clear it.</span></div>`;
    case 'head': return `<div class="join"><div class="row"><span class="chip pink">You head ${esc(d.name)}</span><button class="link" data-act="go" data-page="dash">Run its membership from your Dashboard →</button></div></div>`;
    case 'reads': return `<div class="join"><div class="row"><span class="chip navy">National Exco</span></div><span class="why">You read everything behind this page and write there as backstop to the Head. You don't join.</span></div>`;
    default: return '';
  }
}

function roomUC(d) {

function dateLine(c) {

function roomBoard(d) {

function roomCalendar(d) {
  const m = UI.calMonth, y = 2026; const first = new Date(y, m, 1); const off = (first.getDay() + 6) % 7; const n = new Date(y, m + 1, 0).getDate();
  const iso = dd => `${y}-${String(m + 1).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
  const cells = [];
  for (let i = 0; i < off; i++) cells.push('<div class="d out"></div>');
  for (let dd = 1; dd <= n; dd++) {
    const k = iso(dd);
    const evs = DB.cards.filter(c => c.sched === k).map(c => `<div class="ev ${c.col === 'Published' ? 'pub' : overdue(c) ? 'over' : ''}" data-act="openCard" data-id="${c.id}">${esc(c.tag)}${c.wanted && c.wanted !== c.sched ? `<small>asked for ${fmt(c.wanted)}</small>` : ''}</div>`);
    const gh = UI.ghosts ? DB.cards.filter(c => c.wanted === k && c.wanted !== c.sched).map(c => `<div class="ev ghost">${esc(c.tag)}<small>wanted, not promised</small></div>`) : [];
    cells.push(`<div class="d ${k === TODAY ? 'today' : ''}"><span class="n">${dd}</span>${evs.join('')}${gh.join('')}</div>`);
  }
  while (cells.length % 7) cells.push('<div class="d out"></div>');
  return `<div class="row" style="margin-bottom:12px"><h3 class="title grow">${first.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}</h3>
    <button class="btn sm" data-act="calPrev" ${m <= 10 ? 'disabled' : ''}>←</button><button class="btn sm" data-act="calNext" ${m >= 11 ? 'disabled' : ''}>→</button>
    <label class="sm row" style="gap:5px"><input type="checkbox" data-act="ghosts" ${UI.ghosts ? 'checked' : ''}> What if it plotted dates wanted?</label></div>

  ${UI.ghosts ? `<div class="flag" style="margin-top:0"><b>Why it never does this.</b> Turned on, the dashed chips are dates <i>wanted</i>. On 15 Nov you'd see “Recruitment drive reel” — a date nobody in Media agreed to, now passed, with nothing to show it slipped. Two dates for one piece of work means a calendar nobody can plan from. The asked date lives on the card instead.</div>` : ''}
  <div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<div class="h">${x}</div>`).join('')}${cells.join('')}</div>`;
}
function taskRow(t, c) {

// ---- the Dashboard: only the Departments' share of it is drawn ----

  out.push(`<p class="eyebrow">Your Dashboard</p><h1 class="title" style="font-size:32px;margin-bottom:6px">Good morning, ${esc(nm(s).split(' ')[0])}<span class="dot">.</span></h1><p class="note" style="margin:0 0 18px">Only what the Departments put here is drawn. The rest of the Dashboard is #35's.</p>`);
  // who you are
  out.push(`<div class="card" style="margin-bottom:14px"><p class="card-label">Your Departments</p><div class="row">${DB.depts.map(d => `<button class="btn sm" data-act="go" data-page="${d.key}">${esc(d.name)} · ${STAND_TXT[standing(d)][0]}</button>`).join('')}</div></div>`);

  // Head: management
  const headed = DB.depts.filter(d => d.members[s] === 'head');
  if (headed.length) {
    out.push(`<h2 class="title" style="margin:22px 0 4px">Running your Departments</h2><p class="note" style="margin:0 0 12px">Membership lives here, not in the hubs. You head ${headed.length === 1 ? 'one' : headed.length} — each gets its own panel.</p><div class="grid2" style="margin-bottom:14px">${headed.map(manage).join('')}</div>`);
    out.push(`<div class="flag"><b>Open question.</b> The member list sits only here, for the Head. Fellow members see one another only on shared work (a card's opted-in faces). If a visible roster for members seems wanted, prototype it first — none is drawn.</div>`);
  }
  // Media duties
  const md = dept('media');
  if (['head', 'active'].includes(standing(md))) {
    const red = DB.cards.filter(c => redOn(c).includes(s));
    out.push(`<div class="card" style="margin-bottom:14px"><p class="card-label">Media</p><div class="list">
      ${DB.pending.length ? `<div class="li row pink"><span class="sm"><b class="strong">${DB.pending.length} Content Requests</b> waiting to be answered — on every member until one of you does</span><span class="grow"></span><button class="btn sm" data-act="goRoom" data-k="media" data-room="scheduler">Answer</button></div>` : ''}
      ${red.map(c => `<div class="li red row"><span class="sm"><span class="red"><b>Overdue</b></span> · ${esc(c.tag)} · scheduled ${fmt(c.sched)}</span><span class="grow"></span><button class="btn sm" data-act="openCard" data-id="${c.id}">Open</button></div>`).join('')}
      ${DB.cards.flatMap(c => c.tasks.filter(t => t.owner === s && t.due && !t.done).map(t => `<div class="li row"><span class="sm">${esc(t.t)} <span class="note">· under ${esc(c.tag)}</span></span><span class="grow"></span><span class="note ${t.due < TODAY ? 'red' : ''}">${fmt(t.due)}</span></div>`)).join('')}
    </div></div>`);

function cycle(n) { const ks = Object.keys(VARIANTS); UI.variant = ks[(ks.indexOf(UI.variant) + n + ks.length) % ks.length]; render(); }
function goPage(p) { UI.card = null; UI.answering = UI.declining = null; UI.writingReport = false; if (p === 'dir' || p === 'dash') UI.page = p; else { UI.page = 'dept'; if (UI.dept !== p) UI.offer = p === 'media' ? 'ask' : 'events'; UI.dept = p; UI.inside = false; } window.scrollTo(0, 0); }
function enter(room) { const d = D(); UI.inside = true; UI.room = room || (UI.room && roomsFor(d).some(r => r.k === UI.room && r.ok) ? UI.room : firstRoom(d)); UI.justEntered = true; UI.cOpen.add(d.key); window.scrollTo(0, 0); }

// =====================================================================
// events
// =====================================================================
const SEAT_TOAST = {
  vol: 'Naledi, a plain Volunteer: no Departments. Tech declined her, Education has her request, Research has no Head.',
  member: 'Thabo, a member of Media and Education: he goes in and writes.',
  inactive: 'Lindiwe, inactive in Media: she goes in and reads, and writes nothing.',
  head: 'Zinhle heads two Departments — Media and Education. Membership is run from her Dashboard.',
  exco: 'Sipho, the CEO: reads everything behind every front page and writes as backstop. Can add a Department.',
};
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, d = D();
  if (el.tagName === 'A' || el.tagName === 'SELECT' || el.type === 'checkbox') { if (el.tagName === 'A') e.preventDefault(); }
  if (['tick', 'ms', 'inactive', 'ghosts', 'branchFilter', 'kpi'].includes(act)) return; // handled on change
  const dk = el.dataset.k ? dept(el.dataset.k) : d;
  switch (act) {
    case 'nav': toast('Only the Departments are drawn in this prototype.'); return;
    case 'fold': e.preventDefault(); e.stopPropagation(); UI.navClosed.has(el.dataset.k) ? UI.navClosed.delete(el.dataset.k) : UI.navClosed.add(el.dataset.k); break;
    case 'go': goPage(el.dataset.page); break;
    case 'goRoom': goPage(el.dataset.k); enter(el.dataset.room); UI.justEntered = false; break;
    case 'vprev': return cycle(-1);
    case 'vnext': return cycle(1);
    case 'seat': UI.seat = el.dataset.seat; UI.card = null; UI.answering = UI.declining = null; toast(SEAT_TOAST[UI.seat]); break;
    case 'reset': DB = seed(); Object.assign(UI, { inside: false, card: null, cOpen: new Set(), answering: null, declining: null, declineJoin: null, adding: null, writingReport: false, branchFilter: '', addingDept: false, ghosts: false, calMonth: 10 }); toast('Back to the starting data.'); break;
    case 'enter': enter(); break;
    case 'enterRoom': enter(el.dataset.room); break;
    case 'out': UI.inside = false; window.scrollTo(0, 0); break;
    case 'room': UI.room = el.dataset.room; UI.writingReport = false; break;
    case 'offer': UI.offer = el.dataset.k; break;
    case 'askJoin': askJoin(d); break;
    case 'withdrawJoin': withdrawJoin(d); break;
    case 'withdrawJoinD': withdrawJoin(dk); break;
    case 'acceptInvite': acceptInvite(d); break;
    case 'declineInvite': declineInvite(d); break;
    case 'acceptInviteD': acceptInvite(dk); break;
    case 'declineInviteD': declineInvite(dk); break;
    case 'leave': if (standing(d) === 'head') return; leave(d); break;
    case 'approveJoin': approveJoin(dk, el.dataset.who); break;
    case 'declineJoin': UI.declineJoin = dk.key + ':' + el.dataset.who; break;
    case 'cancelDJ': UI.declineJoin = null; break;
    case 'doDeclineJoin': declineJoin(dk, el.dataset.who, document.getElementById(`dj-${dk.key}-${el.dataset.who}`).value); UI.declineJoin = null; break;
    case 'invite': { const v = document.getElementById('inv-' + dk.key).value; if (!v) return toast('Pick someone to invite.'); invite(dk, v); break; }
    case 'withdrawInv': withdrawInvite(dk, el.dataset.who); break;
    case 'remove': removeMember(dk, el.dataset.who); break;
    case 'signup': { const ev = DB.depts.flatMap(x => x.events).find(x => x.id === id); const i = ev.signed.indexOf(me()); if (i >= 0) { ev.signed.splice(i, 1); toast('Withdrawn.'); } else { if (ev.cap && ev.signed.length + ev.others >= ev.cap) return toast('Full.'); ev.signed.push(me()); toast('Signed up — it sits on your Dashboard until the day.'); } break; }
    case 'eventPage': toast("An Event's page sits outside every hub, so anyone who reaches it can read it. Not drawn here."); return;
    case 'okrs': toast('Opens the OKRs Hub, filtered to this Department. Not drawn here.'); return;
    case 'dl': toast(`Would open ${el.dataset.what}. Open to every member — no sign of membership needed.`); return;
    case 'submitReq': {
      const tag = document.getElementById('rq-tag').value.trim(); if (!tag) return toast('Give it a tagline.');
      const ch = [...document.querySelectorAll('input[name=rq-ch]:checked')].map(x => x.value);
      DB.pending.push({ id: 'r' + (++DB.seq), tag, desc: document.getElementById('rq-desc').value.trim() || '—', type: document.getElementById('rq-type').value, ch: ch.length ? ch : ['Instagram'], by: me(), wanted: document.getElementById('rq-date').value || '2026-12-12', on: TODAY, branch: null });
      toast("Sent. It waits on every Media member until one answers. Follow it from your Dashboard — you can't open Media's working pages."); break;
    }
    case 'accept': UI.answering = id; UI.declining = null; break;
    case 'decline': UI.declining = id; UI.answering = null; break;
    case 'cancelAns': UI.answering = UI.declining = null; break;
    case 'doAccept': { const r = DB.pending.find(x => x.id === id); const sch = document.getElementById('sch-' + id).value || r.wanted; DB.pending = DB.pending.filter(x => x.id !== id); DB.cards.push({ ...r, id: 'c' + (++DB.seq), sched: sch, col: 'Not started', opted: [], acceptedBy: me(), blocked: null, tasks: [] }); UI.answering = null; toast(`Accepted for ${fmt(sch)}${days(r.wanted, sch) > 0 ? ` — ${days(r.wanted, sch)} days after the ${fmt(r.wanted)} asked for; both stay on the card` : ''}. Cleared for every member.`); break; }
    case 'doDecline': { const why = document.getElementById('dec-' + id).value.trim(); if (!why) return toast('A decline needs a reason.'); const r = DB.pending.find(x => x.id === id); DB.pending = DB.pending.filter(x => x.id !== id); DB.declinedReq.unshift({ id: r.id, tag: r.tag, by: r.by, reason: why, on: TODAY }); UI.declining = null; toast('Declined with a reason. Cleared for every member.'); break; }
    case 'direct': { const tag = prompt('Tagline for the new content (it enters the tracker already accepted, with no requester):'); if (!tag) return; DB.cards.push({ id: 'c' + (++DB.seq), tag, desc: 'Made directly by Media.', type: 'post', ch: ['Instagram'], by: null, wanted: null, sched: '2026-12-15', col: 'Not started', opted: canOpt() ? [me()] : [], acceptedBy: me(), branch: null, blocked: null, tasks: [] }); if (UI.inside) UI.room = 'board'; toast('Created on the tracker, scheduled 15 Dec.'); break; }
    case 'openCard': UI.card = id; UI.adding = null; UI.cardAnim = true; break;
    case 'closeCard': if (e.target.closest('[data-stop]') && el.classList.contains('scrim')) return; UI.card = null; break;
    case 'move': { const c = DB.cards.find(x => x.id === id); c.col = el.dataset.col; toast(c.col === 'Published' ? 'Marked Published — by hand, after posting. It leaves the requester\'s Dashboard.' : `Moved to ${c.col}.`); break; }
    case 'block': { const c = DB.cards.find(x => x.id === id); const n = prompt('What is it waiting on? (free text — it never names a unit)'); if (n) c.blocked = n; break; }
    case 'unblock': DB.cards.find(x => x.id === id).blocked = null; break;
    case 'opt': { const c = DB.cards.find(x => x.id === id); const i = c.opted.indexOf(me()); if (i >= 0) { c.opted.splice(i, 1); toast('Opted out.'); } else { c.opted.push(me()); toast('Opted in — no approval needed. Add your own Tasks.'); } break; }
    case 'addTask': UI.adding = id; break;
    case 'cancelTask': UI.adding = null; break;
    case 'saveTask': { const t = document.getElementById('tk-t').value.trim(); if (!t) return toast('Name the Task.'); const due = document.getElementById('tk-due').value || null; DB.cards.find(x => x.id === id).tasks.push({ id: 't' + (++DB.seq), t, owner: me(), imp: +document.getElementById('tk-imp').value, due, done: false }); UI.adding = null; toast(due ? 'Added. Dated, so it reaches your Dashboard.' : 'Added. Undated — a note to self, not on your Dashboard.'); break; }
    case 'calPrev': UI.calMonth = 10; break;
    case 'calNext': UI.calMonth = 11; break;
    case 'writeReport': UI.writingReport = true; break;
    case 'cancelReport': UI.writingReport = false; break;
    case 'saveReport': { const t = document.getElementById('rep-text').value.trim(); if (!t) return; d.reports.unshift({ on: TODAY, text: t }); d.lastReport = TODAY; UI.writingReport = false; toast("Sent. It waits on the General Liaison's Dashboard until opened. The directory now says reported today."); break; }
    case 'liftUC': toast('Lifting the mark is National Exco\'s alone. Not wired here — the prototype keeps Tech, Research and Education under construction.'); return;
    case 'addDept': UI.addingDept = true; break;
    case 'cancelDept': UI.addingDept = false; break;
    case 'saveDept': { const n = document.getElementById('nd-name').value.trim(); if (!n) return; DB.depts.push({ key: n.toLowerCase().replace(/\W+/g, '-'), name: n, uc: true, head: null, forText: '', objectives: [], supportKRs: 0, lastReport: null, members: {}, requests: [], invites: [], declined: {}, events: [], reports: [], tracker: { kpis: [], ms: [], dl: [] } }); UI.addingDept = false; toast(`${n} added with No Head yet. It's in everyone's nav now.`); break; }
    default: return;
  }
  render();
});
document.addEventListener('change', e => {
  const t = e.target, act = t.dataset.act;
  if (act === 'tick') { const task = DB.cards.find(c => c.id === t.dataset.card).tasks.find(x => x.id === t.dataset.id); task.done = t.checked; }
  else if (act === 'ms') D().tracker.ms[+t.dataset.i].done = t.checked;
  else if (act === 'kpi') { D().tracker.kpis[+t.dataset.i].cur = +t.value; }
  else if (act === 'inactive') setInactive(dept(t.dataset.k), t.dataset.who, t.checked);
  else if (act === 'ghosts') UI.ghosts = t.checked;
  else if (act === 'branchFilter') UI.branchFilter = t.value;
  else return;
  render();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'Enter' && e.target.matches('[data-act=openCard],[data-act=out]')) { e.target.click(); return; }
  if (e.key === 'Escape' && UI.card) { UI.card = null; render(); return; }
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
// remove-member and leave are deliberate acts; nothing is undone silently
render();
</script>
</body>
</html>

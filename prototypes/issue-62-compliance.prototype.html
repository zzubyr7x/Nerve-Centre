/* ==========================================================================
   SAVE7 LOOK — the visual vocabulary every prototype on the Nerve Centre map
   shares. Taken from the KEPSA presentation ("KEPSA Slides - SANS"), which the
   user gave on 2026-10-07 as the design direction for the OS and all prototypes.

   Colours were sampled from the rendered PDF, not guessed. Typeface is
   Montserrat (embedded in the deck: Regular, Medium, SemiBold, Bold, italics).

   Use it: paste this file into a prototype's <style> block and put
   class="save7-look" on <body>. A prototype is inlined rather than linked so it
   opens by double-click and survives being emailed; this file is the one source
   the copies are taken from.

   TWO EXTENSIONS beyond what the deck shows, both for small text:
   --teal-ink and --pink-ink are darker twins of the brand teal and pink. The
   brand values are fine for titles, fills and shapes (as the deck uses them) but
   fall below readable contrast as small body text on white.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap');

:root {
  /* brand */
  --navy: #0C173B;
  --teal: #00B7B5;
  --pink: #ED186B;
  --amber: #FFC550;          /* connectors, pins, third-in-sequence — never a main colour */
  --ink: #585858;            /* body text */

  /* tints (card borders, fills, blobs) */
  --teal-border: #E6F7F7;
  --teal-fill: #F4FBFB;
  --mint: #F3FBFB;
  --pink-border: #FCE8F0;
  --pink-fill: #FFF5F7;
  --pink-head: #FCDCE8;
  --amber-fill: #FFF6DD;     /* derived from the amber, for flag callouts */

  /* small-text twins (extension — see header) */
  --teal-ink: #007F7D;
  --pink-ink: #C70F58;
  --amber-ink: #8A5B00;

  --radius: 20px;
  --radius-sm: 12px;
  --font: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }

.save7-look {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink);
  background: #fff;
}

/* ---- the two backdrop blobs: pale mint top-right, pale pink bottom-left ---- */
.save7-look::before,
.save7-look::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  z-index: -1;
  pointer-events: none;
}
.save7-look::before { top: -22vw; right: -16vw; width: 52vw; height: 52vw; background: var(--mint); }
.save7-look::after  { bottom: -20vw; left: -12vw; width: 38vw; height: 38vw; background: var(--pink-fill); }

/* ---- the two-circle motif: big teal, smaller pink, overlapping ---- */
.circles { position: relative; width: 104px; height: 96px; flex: none; }
.circles::before,
.circles::after { content: ''; position: absolute; border-radius: 50%; }
.circles::before { top: 0; right: 0; width: 72px; height: 72px; background: var(--teal); }
.circles::after  { bottom: 0; left: 6px; width: 44px; height: 44px; background: var(--pink); }

/* ---- type ---- */
.eyebrow { margin: 0 0 4px; font-weight: 600; font-size: 13px; color: var(--pink-ink); }
.eyebrow.teal { color: var(--teal-ink); }
.title { margin: 0; font-weight: 700; color: var(--navy); line-height: 1.15; letter-spacing: -0.01em; }
.title .dot { color: var(--pink); }
.title .accent { color: var(--teal); }
h1.title { font-size: 40px; }
h2.title { font-size: 26px; }
h3.title { font-size: 18px; }
.lede { color: var(--ink); font-size: 15px; max-width: 70ch; }
.strong { font-weight: 700; color: var(--navy); }
.muted { color: #8a8a8a; }
.mono { font-variant-numeric: tabular-nums; }

/* ---- cards: white, large radius, hairline tinted border; alternate teal/pink ---- */
.card {
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius);
  padding: 20px 22px;
}
.card.pink { border-color: var(--pink-border); }
.card.tint-teal { background: var(--teal-fill); }
.card.tint-pink { background: var(--pink-fill); }
.card-label { margin: 0 0 10px; font-weight: 700; font-size: 15px; color: var(--navy); }

/* ---- number pills ("01", "BARRIER 01") ---- */
.num {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--teal);
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.num.pink { background: var(--pink); }
.num.amber { background: var(--amber); color: var(--navy); }

/* ---- buttons: outlined teal pill; pink for the primary ---- */
.btn {
  font: 600 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal);
  border-radius: 999px;
  padding: 8px 16px;
  cursor: pointer;
  transition: background 0.12s;
}
.btn:hover { background: var(--teal-fill); }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 700; }
.btn.primary:hover { background: #d4125d; }
.btn.quiet { border-color: transparent; color: var(--ink); }
.btn.quiet:hover { background: var(--teal-fill); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* ---- status chips: small, pale ---- */
.chip {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--teal-border);
  color: var(--teal-ink);
  white-space: nowrap;
}
.chip.pink { background: var(--pink-border); color: var(--pink-ink); }
.chip.amber { background: #FFEFC2; color: var(--amber-ink); }
.chip.grey { background: #F1F1F3; color: #666; }

/* ---- tabs: pill row, active in pink ---- */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  font: 600 13px var(--font);
  color: var(--ink);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
}
.tab:hover { background: var(--teal-fill); }
.tab[aria-selected="true"] { background: var(--pink-fill); border-color: var(--pink); color: var(--pink-ink); }

/* ---- form controls ---- */
input[type="text"], select {
  font: 500 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
}
input[type="text"]::placeholder { color: #a5a5a5; }

/* ---- labelled field rows ---- */
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
.fields dt { font-weight: 600; font-size: 12px; color: #8a8a8a; align-self: center; }
.fields dd { margin: 0; color: var(--navy); font-weight: 600; }

/* ---- timeline bar: alternating teal and pink segments, amber pin on the current one ---- */
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
.bar > i { flex: 1; background: var(--teal); }
.bar > i:nth-child(even) { background: var(--pink); }
.bar > i.todo { opacity: 0.22; }

/* ---- callout: amber, for open questions the user should react to ---- */
.flag {
  background: var(--amber-fill);
  border: 1.5px solid #FFE7A8;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12.5px;
  color: #5a4300;
}
.flag b { color: var(--amber-ink); }

/* ---- logo ---- */
.logo { display: block; height: 22px; width: auto; }

</style>

const due = (d, done) => done ? `<span class="chip done">Done ${fmtS(done)}</span>` : days(d) > 0 ? `<span class="red">${fmtS(d)} · overdue</span>` : `<span class="mono">${fmtS(d)}</span>`;
const owners = o => o[0].includes('Branch Management') ? `<b>${esc(o[0])}</b><div class="tiny muted">${o.slice(1).join(', ')}</div>` : esc(o.join(', '));
const resChip = st => ({ Approved: 'chip', 'Awaiting approval': 'chip amber', Draft: 'chip grey', Rejected: 'chip red', Withdrawn: 'chip grey' })[st];
const versionOf = (m, v) => (HISTORY[m.id] && v) ? HISTORY[m.id].find(h => h.v === v).snap : m;
const lastEdit = m => { const h = HISTORY[m.id]; return h && h.length > 1 ? h[h.length - 1] : null; };
const at = t => new Date(t).toLocaleString('en-ZA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function refusedHTML(s) {
  return `<div class="card uc"><h3 class="title">No such page here</h3><p class="lede" style="margin:8px auto 0">A link to a page ${esc(s.name.split(' ')[0])} doesn't open lands here. The tab row above simply has no Meetings in it.</p></div>
  ${flag('A Super Admin sent a link to Meetings. Should the page say <i>this page isn\'t one you open</i> — admitting it exists — or behave as if there were no such page, as the tab row does?')}`;
}
function ucHTML() {

}

/* ---------- page tables (the Ledger's dense tables) ---------- */
function resTable(s, opt = {}) {
  const rows = RES.filter(r => seesRes(s, r));
  const hidden = RES.length - rows.length;
  return `<div class="spread" style="margin-bottom:12px"><div class="row"><select><option>Every kind</option><option>Appointing an Exco member</option><option>Exco member stepping down</option><option>Advisory board</option><option>CEO</option></select><input type="text" placeholder="Filter by person"></div>
    ${raises(s) ? btn('+ Raise a Resolution', 'primary') : `<span class="small muted">${s.adv ? 'The Advisory board raises none.' : 'To have one put to Exco, ask the General Liaison.'}</span>`}</div>
  ${card(`<table class="t"><thead><tr><th>Resolution</th><th>Kind</th><th>Status</th><th>Raised</th><th>Decided</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="click ${state.rec === r.id ? 'open' : ''}" data-rec="${r.id}"><td><b>${esc(r.moved)}</b>${r.person === s.name && r.state !== 'Approved' ? ' <span class="chip pink">concerns you</span>' : ''}</td><td class="small">${r.kind}</td><td><span class="${resChip(r.state)}">${r.state}</span></td>
      <td class="small">${fmtS(r.raised)} · ${esc(r.raisedBy)}</td><td class="small">${r.decided ? fmt(r.decided) : '—'}</td></tr>${opt.unfold && state.rec === r.id ? `<tr class="open"><td colspan="5"><div class="unfold">${resBody(s, r, true)}</div></td></tr>` : ''}`).join('')}
  </tbody></table>`)}
  ${hidden && !s.exco && !s.gl ? `<p class="tiny muted" style="margin-top:8px">Showing approved Resolutions${RES.some(r => r.person === s.name && r.state !== 'Approved') ? ' and the ones that concern you' : ''}. Drafts, rejections and withdrawals are read by Exco, the General Liaison and the person each concerns.</p>` : ''}`;
}
function resBody(s, r, compact) {
  const steps = ['Draft', 'Awaiting approval', r.state === 'Rejected' ? 'Rejected' : r.state === 'Withdrawn' ? 'Withdrawn' : 'Approved'];
  const idx = r.state === 'Draft' ? 0 : r.state === 'Awaiting approval' ? 1 : 2;
  const stepCls = (i) => i > idx ? '' : i === 2 && r.state === 'Rejected' ? 'end-bad' : i === 2 && r.state === 'Withdrawn' ? 'end-grey' : 'on';
  const reason = readsReason(s, r)
    ? `<div style="margin-top:14px"><p class="eyebrow teal">Reason</p><p style="margin:0;color:#444;line-height:1.65">${esc(r.reason)}</p>${r.rejection ? `<p class="eyebrow" style="margin-top:12px">Rejected because</p><p style="margin:0;color:#444">${esc(r.rejection)}</p>` : ''}</div>`
    : (compact ? '' : flag(`${esc(s.name.split(' ')[0])} reads the outcome but not the reason. Here the reason is simply <i>absent</i>. Should it say <i>a reason is recorded, read by Exco, the General Liaison, the Advisory board and the person concerned</i> instead?`));
  const cite = r.cites ? (() => { const m = meeting(r.cites.meeting); const p = m.points.find(p => p.res === r.id);
    return `<dt>Taken under</dt><dd>${readsMeetings(s) ? `<span class="link" data-goto="meet:${m.id}">${p ? esc(p.h) : 'Agenda Point'} · ${m.title}, ${fmt(m.date)}</span>` : `An Agenda Point of Exco's meeting, ${fmt(m.date)} <span class="tiny muted">— the record isn't yours to open</span>`}</dd>`; })() : '';
  const act = r.state === 'Awaiting approval'
    ? (s.ceo ? `<div class="row" style="margin-top:14px">${btn('Approve', 'primary')}${btn('Reject with a reason')}</div>${flag('The CEO approves from their Dashboard. Should the record itself carry <i>Approve</i> too, or only say it waits there?')}`
             : `<p class="small" style="margin-top:12px">Waits on the CEO's Dashboard. Never lapses.</p>${(r.raisedBy === s.name) ? btn('Withdraw') : ''}`)
    : r.state === 'Draft' ? `<div class="row" style="margin-top:12px">${(r.raisedBy === s.name || s.gl) ? btn('Edit draft') + btn('Put to the CEO', 'primary') + btn('Withdraw') : '<span class="small muted">Still a draft — its raiser puts it to the CEO.</span>'}</div>`
    : r.state === 'Approved' ? `<p class="tiny muted" style="margin-top:12px">Never edited. Only a later Resolution reverses it.</p>` : '';
  return `<p class="eyebrow">${r.kind}</p><div class="moved">${esc(r.person)} <span class="arrow">→</span> ${esc(r.moved.replace(r.person + ' ', ''))}</div>
  <div class="steps">${steps.map((x, i) => `<span class="${stepCls(i)}">${x}</span>`).join('')}</div>
  <dl class="fields" style="margin-top:14px"><dt>Concerns</dt><dd>${esc(r.person)} · ${esc(r.seat)}</dd>${r.successor ? `<dt>Successor named</dt><dd>${esc(r.successor)}</dd>` : ''}
    <dt>Raised</dt><dd>${fmt(r.raised)} by ${esc(r.raisedBy)}</dd><dt>${r.state === 'Rejected' ? 'Rejected' : r.state === 'Withdrawn' ? 'Withdrawn' : 'Approved'}</dt><dd>${r.decided ? fmt(r.decided) + (r.state !== 'Withdrawn' ? ' · ' + esc(r.approver) : '') : '—'}</dd>${cite}</dl>
  ${reason}${act}`;
}
function agrTable(s) {
  const st = a => a.state === 'Signed' ? '<span class="chip">Signed</span>' : a.state === 'Not yet signed' ? '<span class="chip amber">Not yet signed</span>' : `<span class="chip grey">${a.state}</span>`;
  const renew = a => a.renew ? (days(a.renew) > 0 ? `<span class="red">${fmtS(a.renew)} · passed</span>` : fmt(a.renew)) : '—';
  return `<div class="spread" style="margin-bottom:12px"><p class="lede" style="margin:0">Every Agreement, read in full by everyone who reads this hub. Grouped by partner.</p>${editsHub(s) ? btn('+ File a signed copy') : ''}</div>
  ${card(`<table class="t"><thead><tr><th>Agreement</th><th>Branch</th><th>Status</th><th>Signed</th><th>Renewal</th><th></th></tr></thead><tbody>
    ${AGR.map(g => `<tr class="grouphead"><td colspan="6">${esc(g.partner)}</td></tr>` + g.items.map(a => `<tr><td><b>${esc(a.n)}</b>${a.state === 'Not yet signed' ? `<div class="tiny muted">Approved ${fmtS(a.approved)} — waiting on the partner's signature</div>` : ''}</td><td>${esc(a.branch || 'National')}</td><td>${st(a)}</td>
      <td class="small">${a.signed ? fmt(a.signed) : '—'}${a.ended ? `<div class="tiny muted">${a.state.toLowerCase()} ${fmtS(a.ended)}</div>` : ''}</td><td class="small">${renew(a)}</td>
      <td><span class="sw">${a.signed ? '<button>Open signed copy</button>' : ''}${editsHub(s) && a.state === 'Signed' ? '<button>File renewed copy</button><button>Mark ended</button>' : ''}${editsHub(s) && a.state === 'Not yet signed' ? '<button>File signed copy</button><button>Mark abandoned</button>' : ''}</span></td></tr>`).join('')).join('')}

  </tbody></table>`)}`;
}
function meetTable(s, opt = {}) {

function apTable(s) {

      <td class="small">${a.mid ? `<span class="link" data-goto="meet:${a.mid}">${esc(a.src)}</span>` : esc(a.src)}</td><td class="small">${a.acc === null ? '<span class="muted">— (a Meeting\'s asks none)</span>' : a.acc ? 'Yes' : '<span class="chip amber">not yet</span>'}</td>

/* ---------- a Meeting's parts ---------- */
function attendance(m) {
  return m.attendance.map(a => `<span class="chip ${a[1].startsWith('guest') ? 'amber' : ''}" title="${esc(a[1])}">${esc(a[0])} · ${esc(a[1])}</span>`).join(' ');
}
function apRows(p, s) {
  if (!p.aps.length) return '<p class="tiny muted" style="margin:8px 0 0">No Action Points — settled in the room.</p>';
  return `<table class="t" style="margin-top:10px"><thead><tr><th>Action Point</th><th>Owners</th><th>Due</th><th>Agenda Point shown to owners</th><th></th></tr></thead><tbody>${p.aps.map(a => `<tr><td><b>${esc(a.t)}</b></td><td class="small">${owners(a.owners)}</td><td class="small">${due(a.due, a.done)}</td><td class="small">${a.ctx ? 'Shown' : '<span class="chip pink">Hidden</span>'}</td><td>${a.done || !readsAPs(s) ? '' : '<span class="sw"><button>Tick done</button></span>'}</td></tr>`).join('')}</tbody></table>`;
}
const resLink = (p, s) => p.res ? `<p class="small" style="margin:8px 0 0"><span class="num pink" style="margin-right:6px">Resolution</span><span class="link" data-goto="res:${p.res}">${esc(RES.find(r => r.id === p.res).moved)}</span> <span class="${resChip(RES.find(r => r.id === p.res).state)}">${RES.find(r => r.id === p.res).state}</span></p>` : '';
function meetActions(s, m) {
  if (!writesMeetings(s)) return '<span class="chip grey">You read this record</span>';
  const n = apCount(m);
  return `<span class="sw"><button data-toast="Edit — a new version is stamped">Edit</button><button ${n ? 'disabled title="Refused while Action Points hang off it"' : ''} data-toast="Delete Meeting (stub)">Delete</button></span>${n ? `<div class="tiny muted" style="margin-top:4px">Can't delete: ${n} Action Point${n > 1 ? 's' : ''} hang${n > 1 ? '' : 's'} off it.</div>` : ''}`;

}
function versionStrip(m) {
  const h = HISTORY[m.id]; if (!h) return '';
  const cur = state.ver || h[h.length - 1].v;
  return `<div class="vers">${h.map(x => `<button aria-pressed="${x.v === cur}" data-ver="${x.v === h.length ? 0 : x.v}">v${x.v} · ${fmtS(x.at)} · ${esc(x.by.split(' ')[0])}</button>`).join('')}</div>`;
}

/* ======================= VARIANT A — SUB-TABS, RECORDS AS DOCUMENTS ======================= */
function meetingDocA(s, m0) {
  const m = versionOf(m0, state.ver), le = lastEdit(m0);

function variantA(s) {

/* ======================= VARIANT B — INDEX, THEN IN; OUTLINE + RAIL ======================= */
function indexB(s) {
  const n = { res: `${RES.filter(r => seesRes(s, r)).length} you can read${RES.some(r => r.state === 'Awaiting approval' && seesRes(s, r)) ? ' · 1 awaiting the CEO' : ''}`, agr: `${AGR.length} partners · 1 renewal passed · 1 not yet signed`,
    mou: `${MOUS.length} records · ${MOUS.filter(m => !m.became).length} unused`, tpl: `${TEMPLATES.length} to download`, meet: `${MEETINGS.length} logged · last ${fmtS(MEETINGS[0].date)}`,

  const reading = pt === 0
    ? `<p class="eyebrow">Attendance</p><div class="row" style="gap:6px">${attendance(m)}</div><p class="small muted" style="margin-top:12px">A guest named here reads nothing of this record. An Action Point given to them reaches their Dashboard the ordinary way.</p>`
    : (p => `<p class="eyebrow">Agenda Point ${pt}</p><h2 class="title">${esc(p.h)}</h2><p style="color:#444;line-height:1.7;font-size:14px">${esc(p.note)}</p>${resLink(p, s)}${apRows(p, s)}`)(m.points[pt - 1]);
  const rail = `<div class="rail card" style="padding:14px 16px"><p class="card-label">History</p>${h ? h.slice().reverse().map(x => `<div class="ev ${(state.ver || h.length) === x.v ? 'cur' : ''}"><b class="strong">v${x.v}</b> · ${at(x.at)}<br>${esc(x.by)}<br><span class="muted">${esc(x.what)}</span><br><button data-ver="${x.v === h.length ? 0 : x.v}">read this version</button></div>`).join('') : '<p class="small muted">Never edited.</p>'}

  <div class="card">${reading}</div>${rail}</div>

}
function variantB(s) {
  const page = curPage(s);
  const hubTabs = `<div class="tabs" role="tablist" style="margin-bottom:18px">${HUBTABS(s).map(t => `<button class="tab" data-toast="${t} is drawn on the Operations Hub prototype">${t}</button>`).join('')}<button class="tab" aria-selected="true" data-page="">Compliance</button></div>`;
  const name = (PAGES.find(p => p.id === page) || {}).n;
  const crumb = page !== 'index' && !(page === 'meet' && state.rec) ? `<div class="crumb"><span class="link" data-page="">Compliance</span> › <b>${name || 'Not found'}</b></div>` : '';

  else if (page === 'refused') body = refusedHTML(s);
  else if (page === 'meet') body = state.rec && meeting(state.rec) ? meetingB(s, meeting(state.rec)) : meetTable(s);
  else if (page === 'res') { const r = RES.find(r => r.id === state.rec && seesRes(s, r)) || RES.find(r => seesRes(s, r));
    body = `<div class="regsplit"><div>${resTable(s)}</div><div class="card ${r.state === 'Approved' ? '' : 'pink'}" style="position:sticky;top:18px">${resBody(s, r)}</div></div>`; if (!state.rec) state.rec = r.id; }
  else body = ({ agr: agrTable, mou: mouTable, tpl: tplTable, ap: apTable, inc: ucHTML })[page](s);
  return hubHead(s) + hubTabs + crumb + body;
}

/* ======================= VARIANT C — ONE ROW, ROWS UNFOLD ======================= */
function meetingUnfold(s, m0) {
  const m = versionOf(m0, state.ver);
  return `<div class="unfold">${versionBanner(m0)}<div class="spread"><div class="row" style="gap:6px">${attendance(m)}</div><div>${meetActions(s, m0)}</div></div>
    ${HISTORY[m0.id] ? versionStrip(m0) : ''}
    ${m.points.map((p, i) => `<div class="apline"><span class="apn">${i + 1}</span><div><b class="strong">${esc(p.h)}</b><div class="small" style="color:#444;margin-top:2px">${esc(p.note)}</div>${resLink(p, s)}${p.aps.length ? apRows(p, s) : ''}</div></div>`).join('')}</div>`;
}
function variantC(s) {
  const page = curPage(s);
  const comp = pagesFor(s);
  const row = `<div class="tabs" role="tablist" style="margin-bottom:18px;align-items:center">${HUBTABS(s).map(t => `<button class="tab" data-toast="${t} is drawn on the Operations Hub prototype">${t}</button>`).join('')}
    <span class="grp"><span class="lab">Compliance</span>${comp.map(p => `<button class="tab" role="tab" aria-selected="${page === p.id}" data-page="${p.id}">${p.n}</button>`).join('')}</span></div>`;
  let body;
  if (page === 'refused') body = refusedHTML(s);
  else if (page === 'res') body = resTable(s, { unfold: true });
  else if (page === 'meet') body = meetTable(s, { unfold: true }) + flag('The Ledger unfolds a Profile under its row; here a whole Meeting unfolds the same way. Fine for a short sitting — but a record people argue about wants an address to send. Should a Meeting unfold, or open?');
  else body = ({ agr: agrTable, mou: mouTable, tpl: tplTable, ap: apTable, inc: ucHTML })[page](s);
  return hubHead(s) + row + body + (comp.length > 5 ? flag('Eleven tabs in one row for Exco. The dashed group says which are Compliance — enough, or does the section need its own row (take A)?') : '');
}

/* ======================= READOUT ======================= */
function readoutHTML(s) {
  const y = (ok, t) => `<div class="${ok ? 'y' : 'n'}">${ok ? '✓' : '✗'} ${t}</div>`;
  const r9 = RES[0];
  return `<summary>${esc(s.label)}</summary><div style="margin-top:8px">
    ${y(readsHub(s), 'Operations Hub, and so Compliance')}
    ${y(readsMeetings(s), 'Meetings page' + (readsMeetings(s) ? '' : ' — hidden, not locked'))}
    ${y(readsAPs(s), 'Action Points page')}
    ${y(writesMeetings(s), 'Logs and corrects Meetings')}
    ${y(editsHub(s), 'Edits Agreements and Templates')}
    ${y(raises(s), 'Raises Resolutions')}
    ${y(!!s.ceo, 'Approves Resolutions')}
    ${y(readsReason(s, RES[2]), 'Reads an approved Resolution\'s reason')}
    ${y(seesRes(s, r9), 'Sees the CGO Resolution awaiting approval')}
    ${y(opensMou(s, MOUS[1]), 'Opens Thandi\'s signed MOU')}
    <div style="margin-top:6px"><b>Pages:</b> ${readsHub(s) ? pagesFor(s).map(p => p.n).join(', ') : '—'}</div>
    ${state.toast ? `<div style="margin-top:6px;color:#ffd27a">Last action: ${esc(state.toast)} (stub — nothing changes)</div>` : ''}</div>`;
}
function deniedHTML(s) {
  return `<div class="card uc"><div class="circles" style="margin:0 auto 14px"></div><h3 class="title">Not in ${esc(s.name.split(' ')[0])}'s Shell</h3>
  <p class="lede" style="margin:8px auto 0">A plain Volunteer has no Operations Hub, so no Compliance section. A Resolution's outcome still shows wherever the seat it moved appears.</p></div>`;
}

/* ======================= RENDER + EVENTS ======================= */
function render() {
  const s = seat();
  document.getElementById('shell').innerHTML = shellHTML(s);
  document.getElementById('main').innerHTML = !readsHub(s) ? deniedHTML(s) : ({ A: variantA, B: variantB, C: variantC })[state.variant](s);
  document.getElementById('vlabel').textContent = state.variant + ' · ' + VARIANTS[state.variant].split(' — ')[0];
  document.getElementById('readout').innerHTML = readoutHTML(s);
  document.getElementById('seat').value = state.seat;
  sync();
}
document.getElementById('seat').innerHTML = Object.entries(SEATS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
document.getElementById('seat').onchange = e => { state.seat = e.target.value; state.toast = null; render(); };
const cycle = d => { const k = Object.keys(VARIANTS); state.variant = k[(k.indexOf(state.variant) + d + k.length) % k.length]; state.ver = null; render(); };
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1);
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-page],[data-rec],[data-toast],[data-ver],[data-hist],[data-pt],[data-apf],[data-goto],.sw button');
  if (!t || t.disabled) return;
  const d = t.dataset;
  if ('goto' in d) { const [p, r] = d.goto.split(':'); state.page = p; state.rec = r; state.ver = null; state.pt = 0; }
  else if ('page' in d) { state.page = d.page || null; state.rec = null; state.ver = null; state.pt = 0; }
  else if ('rec' in d) { state.rec = (state.variant === 'C' && state.rec === d.rec) ? null : (d.rec || null); state.ver = null; state.pt = 0; if (state.variant !== 'C') window.scrollTo(0, 0); }
  else if ('ver' in d) { state.ver = +d.ver || null; }
  else if ('hist' in d) { state.hist = !state.hist; }
  else if ('pt' in d) { state.pt = +d.pt; }
  else if ('apf' in d) { state.apf = d.apf; }
  else if ('toast' in d) { state.toast = d.toast; }
  else state.toast = t.textContent.trim();
  render();
});
render();
</script>
</body>
</html>

<html lang="en">

<title>Projects Hub — PROTOTYPE</title>
<style>
/* ==========================================================================
   SAVE7 LOOK — the visual vocabulary every prototype on the Nerve Centre map
   shares. Taken from the KEPSA presentation ("KEPSA Slides - SANS"), which the
   user gave on 2026-10-07 as the design direction for the OS and all prototypes.

   Colours were sampled from the rendered PDF, not guessed. Typeface is
   Montserrat (embedded in the deck: Regular, Medium, SemiBold, Bold, italics).

   Use it: paste this file into a prototype's <style> block and put
   class="save7-look" on <body>. A prototype is inlined rather than linked so it
   opens by double-click and survives being emailed; this file is the one source
   the copies are taken from.

   TWO EXTENSIONS beyond what the deck shows, both for small text:
   --teal-ink and --pink-ink are darker twins of the brand teal and pink. The
   brand values are fine for titles, fills and shapes (as the deck uses them) but
   fall below readable contrast as small body text on white.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap');

:root {
  /* brand */
  --navy: #0C173B;
  --teal: #00B7B5;
  --pink: #ED186B;
  --amber: #FFC550;          /* connectors, pins, third-in-sequence — never a main colour */
  --ink: #585858;            /* body text */

  /* tints (card borders, fills, blobs) */
  --teal-border: #E6F7F7;
  --teal-fill: #F4FBFB;
  --mint: #F3FBFB;
  --pink-border: #FCE8F0;
  --pink-fill: #FFF5F7;
  --pink-head: #FCDCE8;
  --amber-fill: #FFF6DD;     /* derived from the amber, for flag callouts */

  /* small-text twins (extension — see header) */
  --teal-ink: #007F7D;
  --pink-ink: #C70F58;
  --amber-ink: #8A5B00;

  --radius: 20px;
  --radius-sm: 12px;
  --font: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }

.save7-look {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink);
  background: #fff;
}

/* ---- the two backdrop blobs: pale mint top-right, pale pink bottom-left ---- */
.save7-look::before,
.save7-look::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  z-index: -1;
  pointer-events: none;
}
.save7-look::before { top: -22vw; right: -16vw; width: 52vw; height: 52vw; background: var(--mint); }
.save7-look::after  { bottom: -20vw; left: -12vw; width: 38vw; height: 38vw; background: var(--pink-fill); }

/* ---- the two-circle motif: big teal, smaller pink, overlapping ---- */
.circles { position: relative; width: 104px; height: 96px; flex: none; }
.circles::before,
.circles::after { content: ''; position: absolute; border-radius: 50%; }
.circles::before { top: 0; right: 0; width: 72px; height: 72px; background: var(--teal); }
.circles::after  { bottom: 0; left: 6px; width: 44px; height: 44px; background: var(--pink); }

/* ---- type ---- */
.eyebrow { margin: 0 0 4px; font-weight: 600; font-size: 13px; color: var(--pink-ink); }
.eyebrow.teal { color: var(--teal-ink); }
.title { margin: 0; font-weight: 700; color: var(--navy); line-height: 1.15; letter-spacing: -0.01em; }
.title .dot { color: var(--pink); }
.title .accent { color: var(--teal); }
h1.title { font-size: 40px; }
h2.title { font-size: 26px; }
h3.title { font-size: 18px; }
.lede { color: var(--ink); font-size: 15px; max-width: 70ch; }
.strong { font-weight: 700; color: var(--navy); }
.muted { color: #8a8a8a; }
.mono { font-variant-numeric: tabular-nums; }

/* ---- cards: white, large radius, hairline tinted border; alternate teal/pink ---- */
.card {
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius);
  padding: 20px 22px;
}
.card.pink { border-color: var(--pink-border); }
.card.tint-teal { background: var(--teal-fill); }
.card.tint-pink { background: var(--pink-fill); }
.card-label { margin: 0 0 10px; font-weight: 700; font-size: 15px; color: var(--navy); }

/* ---- number pills ("01", "BARRIER 01") ---- */
.num {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--teal);
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.num.pink { background: var(--pink); }
.num.amber { background: var(--amber); color: var(--navy); }

/* ---- buttons: outlined teal pill; pink for the primary ---- */
.btn {
  font: 600 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal);
  border-radius: 999px;
  padding: 8px 16px;
  cursor: pointer;
  transition: background 0.12s;
}
.btn:hover { background: var(--teal-fill); }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 700; }
.btn.primary:hover { background: #d4125d; }
.btn.quiet { border-color: transparent; color: var(--ink); }
.btn.quiet:hover { background: var(--teal-fill); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* ---- status chips: small, pale ---- */
.chip {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--teal-border);
  color: var(--teal-ink);
  white-space: nowrap;
}
.chip.pink { background: var(--pink-border); color: var(--pink-ink); }
.chip.amber { background: #FFEFC2; color: var(--amber-ink); }
.chip.grey { background: #F1F1F3; color: #666; }

/* ---- tabs: pill row, active in pink ---- */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  font: 600 13px var(--font);
  color: var(--ink);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
}
.tab:hover { background: var(--teal-fill); }
.tab[aria-selected="true"] { background: var(--pink-fill); border-color: var(--pink); color: var(--pink-ink); }

/* ---- form controls ---- */
input[type="text"], select {
  font: 500 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
}
input[type="text"]::placeholder { color: #a5a5a5; }

/* ---- labelled field rows ---- */
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
.fields dt { font-weight: 600; font-size: 12px; color: #8a8a8a; align-self: center; }
.fields dd { margin: 0; color: var(--navy); font-weight: 600; }

/* ---- timeline bar: alternating teal and pink segments, amber pin on the current one ---- */
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
.bar > i { flex: 1; background: var(--teal); }
.bar > i:nth-child(even) { background: var(--pink); }
.bar > i.todo { opacity: 0.22; }

/* ---- callout: amber, for open questions the user should react to ---- */
.flag {
  background: var(--amber-fill);
  border: 1.5px solid #FFE7A8;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12.5px;
  color: #5a4300;
}
.flag b { color: var(--amber-ink); }

/* ---- logo ---- */
.logo { display: block; height: 22px; width: auto; }

/* ==========================================================================
   PROTOTYPE LAYOUT — everything below is this prototype's own, not the look.
   ========================================================================== */
.chrome { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 20px; background: var(--navy); color: #fff; font-size: 12.5px; }
.chrome b { color: #fff; }
.chrome .proto { font-weight: 700; letter-spacing: .08em; font-size: 11px; color: var(--navy); background: var(--amber); border-radius: 999px; padding: 2px 10px; }
.chrome select { background: #fff; padding: 5px 10px; }
.chrome .btn { padding: 5px 12px; font-size: 12px; border-color: #fff3; color: #fff; background: transparent; }
.chrome .btn:hover { background: #ffffff14; }
.chrome .reads { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chrome .reads span { border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 600; background: #ffffff1a; color: #fff; }
.chrome .reads span.no { color: #ffffff70; text-decoration: line-through; }

.wrap { max-width: 1440px; margin: 0 auto; padding: 18px 16px 110px; }
.screen { border: 1.5px solid var(--teal-border); border-radius: var(--radius); background: #fff; overflow: hidden; display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: 720px; }
@media (max-width: 760px) { .screen { grid-template-columns: 1fr; } .shell { border-right: 0 !important; border-bottom: 1.5px solid var(--teal-border); } }
.shell { border-right: 1.5px solid var(--teal-border); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
.shell .logo { height: 22px; margin: 2px 10px 16px; }
.shell .who { margin: 0 4px 12px; padding: 9px 12px; border: 1.5px dashed #e3e3e8; border-radius: var(--radius-sm); font-size: 11.5px; color: #8a8a8a; }
.shell .who b { display: block; color: var(--navy); font-size: 13px; }
.nav-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; font: 600 13px var(--font); color: var(--navy); background: none; border: 0; border-radius: 10px; padding: 7px 10px; cursor: pointer; }
.nav-item:hover { background: var(--teal-fill); }
.nav-item.active { background: var(--pink-fill); color: var(--pink-ink); }
.nav-item.l2 { padding-left: 24px; font-weight: 500; }
.nav-item.inert { color: #9a9aa5; cursor: default; }
.nav-item.inert:hover { background: none; }
.nav-item .count { background: var(--pink); color: #fff; border-radius: 999px; font-size: 10.5px; padding: 0 7px; font-weight: 700; }
.main { padding: 24px 28px 40px; min-width: 0; }
@media (max-width: 760px) { .main { padding: 18px 16px; } }

.crumbs { font-size: 12px; color: #8a8a8a; margin-bottom: 8px; }
.crumbs a { color: var(--teal-ink); cursor: pointer; text-decoration: none; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.stack { display: grid; gap: 14px; }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.link { color: var(--teal-ink); font-weight: 600; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; font-weight: 600; text-decoration: underline; text-decoration-color: var(--teal-border); text-underline-offset: 3px; }
.mou { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; font-weight: 700; color: var(--navy); }
button.mou { background: var(--teal-fill); border: 1.5px solid var(--teal-border); border-radius: 8px; padding: 2px 8px; cursor: pointer; }
button.mou:hover { border-color: var(--teal); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--teal); flex: none; }
.avatar.p { background: var(--pink); }
.avatar.sm { width: 24px; height: 24px; font-size: 10px; }
.elig { border-radius: var(--radius-sm); padding: 9px 13px; font-size: 13px; font-weight: 600; }
.elig.open { background: var(--teal-fill); color: var(--teal-ink); border: 1.5px solid var(--teal-border); }
.elig.you { background: var(--pink-fill); color: var(--pink-ink); border: 1.5px solid var(--pink-border); }
.elig.no { background: #F6F6F8; color: #666; border: 1.5px solid #ececf0; }
.elig.closed { background: #F6F6F8; color: #666; border: 1.5px dashed #d9d9e0; }
.notice { border-radius: var(--radius-sm); padding: 10px 14px; background: var(--pink-fill); border: 1.5px solid var(--pink-border); font-size: 13px; }
.readonly { border-radius: var(--radius-sm); padding: 10px 14px; background: #F6F6F8; border: 1.5px dashed #d9d9e0; font-size: 12.5px; color: #555; }
.flag { margin: 6px 0; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.list li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th { text-align: left; font-size: 11px; font-weight: 700; color: #8a8a8a; text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1.5px solid var(--teal-border); white-space: nowrap; }
table.t td { padding: 9px 10px; border-bottom: 1px solid #f1f1f4; vertical-align: top; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--teal-fill); }
table.t input[type="number"], table.t input[type="text"] { width: 100%; max-width: 120px; }
input[type="number"], input[type="date"], textarea { font: 500 13px var(--font); color: var(--navy); background: #fff; border: 1.5px solid var(--teal-border); border-radius: var(--radius-sm); padding: 7px 10px; }
textarea { width: 100%; min-height: 70px; }
label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--navy); cursor: pointer; }
.toggle { font: 600 12px var(--font); border-radius: 999px; padding: 5px 12px; border: 1.5px solid var(--teal-border); background: #fff; color: var(--ink); cursor: pointer; }
.toggle.on { background: var(--teal); color: #fff; border-color: var(--teal); }
.empty { padding: 26px; text-align: center; color: #8a8a8a; border: 1.5px dashed #e3e3e8; border-radius: var(--radius); }

/* board */
.board { display: grid; grid-template-columns: repeat(3, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; }
.col { background: var(--teal-fill); border-radius: var(--radius-sm); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col h4 { margin: 0 0 2px; font-size: 12px; color: var(--navy); text-transform: uppercase; letter-spacing: .06em; }
.task { background: #fff; border: 1.5px solid var(--teal-border); border-radius: 12px; padding: 9px 11px; font-size: 12.5px; display: grid; gap: 5px; }
.task.mine { border-color: var(--pink); }
.task.done .tt { text-decoration: line-through; color: #8a8a8a; }
.task.undone { border-style: dashed; }
.task .tt { font-weight: 600; color: var(--navy); }
.task .acts { display: flex; gap: 4px; flex-wrap: wrap; }
.task .acts button { font: 600 11px var(--font); padding: 2px 8px; border-radius: 999px; border: 1.5px solid var(--teal-border); background: #fff; cursor: pointer; color: var(--navy); }
.task .acts button:hover { border-color: var(--teal); }
.imp { color: var(--amber-ink); letter-spacing: 1px; }
.addform { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px; border: 1.5px dashed var(--teal-border); border-radius: var(--radius-sm); }
.addform input[type="text"] { flex: 1 1 180px; }

/* dashboard cards */
.duty { display: flex; gap: 14px; align-items: flex-start; }
.duty .kind { flex: none; }

/* --- Variant A: Register --- */
.va-doc { max-width: 860px; }
.va-sec { padding: 18px 0; border-top: 1.5px solid var(--teal-border); display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 4px 14px; }
.va-sec > .num { align-self: start; justify-self: start; margin-top: 3px; }
.va-sec h3 { margin: 0 0 8px; }
@media (max-width: 640px) { .va-sec { grid-template-columns: 1fr; } }
.va-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; background: var(--teal-fill); border-radius: var(--radius-sm); margin: 14px 0; }
.tablewrap { overflow-x: auto; }

/* --- Variant B: Split --- */
.vb { display: grid; grid-template-columns: 330px minmax(0,1fr); gap: 0; margin: -24px -28px -40px; min-height: 720px; }
@media (max-width: 1000px) { .vb { grid-template-columns: 1fr; margin: 0; } }
.vb-list { border-right: 1.5px solid var(--teal-border); display: flex; flex-direction: column; min-height: 0; }
.vb-filters { padding: 14px; display: grid; gap: 8px; border-bottom: 1.5px solid var(--teal-border); }
.vb-filters input[type="text"] { width: 100%; }
.vb-rows { overflow-y: auto; max-height: 900px; }
.vb-row { display: grid; grid-template-columns: 8px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #f1f1f4; cursor: pointer; }
.vb-row:hover { background: var(--teal-fill); }
.vb-row.sel { background: var(--pink-fill); }
.vb-row .dot { width: 8px; height: 8px; border-radius: 50%; background: #d6d6dd; }
.vb-row .dot.open { background: var(--teal); }
.vb-row .dot.you { background: var(--pink); }
.vb-row .nm { font-weight: 600; color: var(--navy); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vb-pane { padding: 22px 26px; min-width: 0; }
.vb-head { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: flex-start; padding-bottom: 14px; }
.vb-tabs { border-bottom: 1.5px solid var(--teal-border); padding-bottom: 12px; margin-bottom: 16px; }
.vb-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.vb-grid .wide { grid-column: 1 / -1; }
@media (max-width: 760px) { .vb-grid { grid-template-columns: 1fr; } }

/* --- Variant C: Rail --- */
.vc-dir { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 24px; }
@media (max-width: 900px) { .vc-dir { grid-template-columns: 1fr; } }
.vc-facets { display: grid; gap: 16px; align-content: start; }
.vc-facets h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a8a8a; }
.vc-facets input[type="text"] { width: 100%; }
.vc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.vc-card { cursor: pointer; display: grid; gap: 8px; align-content: start; transition: border-color .12s; }
.vc-card:hover { border-color: var(--teal); }
.vc-card:nth-child(even) { border-color: var(--pink-border); }
.vc-card:nth-child(even):hover { border-color: var(--pink); }
.vc-hero { position: relative; overflow: hidden; background: var(--teal-fill); border-radius: var(--radius); padding: 26px 28px; display: flex; gap: 20px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.vc-body { display: grid; grid-template-columns: 290px minmax(0,1fr); gap: 22px; align-items: start; }
@media (max-width: 1000px) { .vc-body { grid-template-columns: 1fr; } }
.vc-rail { display: grid; gap: 12px; }
.vc-rooms { display: grid; gap: 4px; }
.vc-rooms button { text-align: left; }
.timeline { position: relative; display: grid; gap: 14px; padding-left: 22px; }
.timeline::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--teal-border); }
.timeline .tl { position: relative; }
.timeline .tl::before { content: ''; position: absolute; left: -21px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--teal); border: 2px solid #fff; }
.timeline .tl:nth-child(even)::before { background: var(--pink); }
.wall { display: flex; flex-wrap: wrap; gap: 10px; }
.wall .person { display: flex; gap: 8px; align-items: center; padding: 6px 12px 6px 6px; border: 1.5px solid var(--teal-border); border-radius: 999px; font-size: 12.5px; }

/* --- the variant switcher: deliberately not part of the design --- */
.switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px; padding: 6px; box-shadow: 0 8px 28px #0005; font: 600 13px system-ui, sans-serif; }
.switcher button { background: #fff1; color: #fff; border: 0; border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; }
.switcher button:hover { background: #fff3; }
.switcher .lbl { padding: 0 14px; white-space: nowrap; }

dialog { border: 0; border-radius: var(--radius); padding: 24px; max-width: 520px; box-shadow: 0 20px 60px #0c173b40; font-family: var(--font); color: var(--ink); }
dialog::backdrop { background: #0c173b55; }

</style>
</head>
<body class="save7-look">
<!--
  PROTOTYPE — throwaway. Answers "what does the Projects Hub look like on screen?" (issue #65).
  Three structurally different takes on the same route, switchable by ?variant=A|B|C and the
  floating bar at the bottom (← → keys too), crossed with a seat switcher (?seat=…) at the top.
  Everything lives in memory: reload or "Reset" to start again. Open questions are amber.
  Model: CONTEXT.md (Project, Projects Hub, Project tracker, Project Team, Board, Task, Update)
  and the resolution of #56. Look: prototypes/save7-look.css, pasted in above.
-->
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
/* ============================== the model, in memory ============================== */
const TODAY = '2026-11-23';
const BRANCHES = ['UCT', 'Stellenbosch', 'Wits', 'UP', 'UJ'];
const STATUSES = ['Active', 'Inactive', 'On ice', 'Completed', 'Cancelled'];
const FINAL = s => s === 'Completed' || s === 'Cancelled';

const SEATS = {
  eligible:   { id: 'amara',  label: 'Plain Volunteer, eligible (UCT)' },
  ineligible: { id: 'thabo',  label: 'Plain Volunteer, not eligible (Wits)' },
  member:     { id: 'lebo',   label: 'Team member of Orgamites' },
  lead:       { id: 'naledi', label: 'Project Lead of Orgamites' },
  bm:         { id: 'sipho',  label: 'Branch Manager, UCT (home branch)' },
  gl:         { id: 'ayesha', label: 'General Liaison' },
  exco:       { id: 'kagiso', label: 'Exco member (CEO)' },

function addDays(iso, d) { const x = new Date(iso + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + d); return x.toISOString().slice(0, 10); }
function daysSince(iso) { return Math.round((new Date(TODAY) - new Date(iso)) / 864e5); }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return (+d) + ' ' + MONTHS[+m - 1] + ' ' + y; }
function ago(iso) { const d = daysSince(iso); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 30 ? d + ' days ago' : d < 365 ? Math.round(d / 30) + ' months ago' : 'over a year ago'; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function eligDesc(p) {

  const br = all ? 'every branch' : p.elig.length === 1 ? p.elig[0] + ' only' : p.elig.slice(0, -1).join(', ') + ' and ' + p.elig.at(-1);
  return p.branchless ? (all ? 'every branch and branchless volunteers' : br.replace(' only', '') + ' and branchless volunteers') : br;
}
function eligFor(p, v) {
  if (FINAL(p.status)) return { k: 'closed', short: p.status, t: p.status + ' on ' + fmt(p.ended) + '. Closed to requests and invitations.' };
  if (isLead(p, v)) return { k: 'you', short: 'You lead it', t: 'You lead this Project. Open to ' + eligDesc(p) + '.' };

  if (eligible(p, v)) return { k: 'open', short: 'Open to you', t: 'You can ask to join. Open to ' + eligDesc(p) + '.' };

    ${withBody ? `<p></p><textarea id="dlg-body" placeholder="What happened"></textarea>` : ''}
    <p id="dlg-err" class="small" style="color:#D92D20"></p>
    <div class="row"><button class="btn primary" id="dlg-ok">Confirm</button><button class="btn quiet" onclick="document.getElementById('dlg').close()">Cancel</button></div>`);
  document.getElementById('dlg-ok').onclick = () => {
    const val = placeholder !== null ? document.getElementById('dlg-in').value.trim() : '';
    const body = withBody ? document.getElementById('dlg-body').value.trim() : '';
    if (placeholder !== null && !optional && !val) { document.getElementById('dlg-err').textContent = 'This cannot be empty.'; return; }
    if (withBody && !body) { document.getElementById('dlg-err').textContent = 'An Update needs a body as well as a title.'; return; }
    document.getElementById('dlg').close(); then(val, body);
  };
  setTimeout(() => document.getElementById('dlg-in')?.focus(), 0);
}

/* ============================== UI state ============================== */
const VARIANTS = { A: 'Register', B: 'Split view', C: 'Profile with rail' };
const params = new URLSearchParams(location.search);
const UI = {
  variant: VARIANTS[params.get('variant')] ? params.get('variant') : 'A',
  seat: SEATS[params.get('seat')] ? params.get('seat') : 'eligible',
  page: 'dir', pid: null, sub: 'page',
  q: '', home: '', statuses: new Set(['Active', 'Inactive']), openToMe: false,
};
function syncUrl() { const u = new URL(location); u.searchParams.set('variant', UI.variant); u.searchParams.set('seat', UI.seat); history.replaceState(null, '', u); }
function go(page, pid = null, sub = 'page') { UI.page = page; UI.pid = pid; UI.sub = sub; render(); if (UI.variant !== 'B') window.scrollTo(0, 0); }
function setF(k, v) { UI[k] = v; render(); }
function toggleStatus(s) { UI.statuses.has(s) ? UI.statuses.delete(s) : UI.statuses.add(s); render(); }

function filtered() {
  const v = viewer(), q = UI.q.trim().toLowerCase();
  return M.projects
    .filter(p => !q || p.name.toLowerCase().includes(q))
    .filter(p => !UI.home || (UI.home === '—' ? homeOf(p) === null : homeOf(p) === UI.home))
    .filter(p => UI.statuses.has(p.status))
    .filter(p => !UI.openToMe || can.askable(p, v))
    .sort((a, b) => a.name.localeCompare(b.name));
}

function boardHTML(p) {
  const v = viewer(), w = can.writeBoard(p, v), lead = isLead(p, v);
  const cols = ['To do', 'Doing', 'Done'];
  const card = t => {
    const mine = t.owners.includes(v.id);
    const acts = [];
    if (w && (mine || lead) && !t.undone) { if (t.col > 0) acts.push(`<button onclick="act('move','${p.id}','${t.id}',-1)">←</button>`); if (t.col < 2) acts.push(`<button onclick="act('move','${p.id}','${t.id}',1)">→</button>`); acts.push(`<button onclick="act('tick','${p.id}','${t.id}')">${t.done ? 'Undo' : 'Done ✓'}</button>`); }
    else if (w && !t.undone && !t.done) { if (t.col > 0) acts.push(`<button onclick="act('move','${p.id}','${t.id}',-1)">←</button>`); if (t.col < 2) acts.push(`<button onclick="act('move','${p.id}','${t.id}',1)">→</button>`); }
    if (w && !mine && onTeam(p, v) && !t.done && !t.undone) acts.push(`<button onclick="act('take','${p.id}','${t.id}')">Take it</button>`);
    if (w && lead) acts.push(`<button onclick="act('delTask','${p.id}','${t.id}')">Delete</button>`);
    return `<div class="task ${mine ? 'mine' : ''} ${t.done ? 'done' : ''} ${t.undone ? 'undone' : ''}">

      <div class="small">${t.owners.length ? t.owners.map(nameOf).map(esc).join(', ') : '<span class="chip amber">Unowned</span>'}${t.due ? ` · <span class="muted">due ${fmt(t.due)}</span>` : ''}</div>

      ${acts.length ? `<div class="acts">${acts.join('')}</div>` : ''}

  return `<div class="stack">${forms}<div class="board">${cols.map((c, i) => `<div class="col"><h4>${c}</h4>${p.board.filter(t => t.col === i).map(card).join('') || '<span class="tiny muted">Empty</span>'}</div>`).join('')}</div></div>`;

/* ============================== the Dashboard: only what this hub puts there ============================== */
function dashboardHTML() {
  const v = viewer(), cards = [];
  const led = M.projects.filter(p => p.lead === v.id && !FINAL(p.status));
  const waiting = led.reduce((n, p) => n + p.requests.filter(r => r.state === 'pending').length, 0);
  if (waiting) cards.push({ kind: 'Standing duty', title: waiting + (waiting === 1 ? ' volunteer is' : ' volunteers are') + ' waiting to join', body: led.filter(p => p.requests.some(r => r.state === 'pending')).map(p => p.name).join(', '), go: led.find(p => p.requests.some(r => r.state === 'pending')).id });
  const codes = person(v.id).unusedMou || [];
  if (codes.length) cards.push({ kind: 'Standing duty', title: codes.length === 1 ? 'An MOU is waiting for its Project' : codes.length + ' MOUs are waiting for their Projects', body: codes.join(', ') + ' is signed off. Create the Project it makes.', create: true });
  for (const p of M.projects) for (const i of p.invites.filter(i => i.who === v.id && i.state === 'pending')) cards.push({ kind: 'Standing duty', title: 'Invitation to ' + p.name, body: nameOf(p.lead) + ' invited you. Accept or decline.', go: p.id });
  for (const p of M.projects) if (!FINAL(p.status)) for (const t of p.board.filter(t => t.owners.includes(v.id) && t.due && !t.done)) cards.push({ kind: 'Raised duty', title: t.title, body: p.name + ' · due ' + fmt(t.due), go: p.id, sub: 'board' });
  for (const p of M.projects) { const r = p.requests.find(r => r.who === v.id); if (r && r.state === 'pending') cards.push({ kind: 'Reminder', title: 'You asked to join ' + p.name, body: 'Waiting for ' + nameOf(p.lead) + ' since ' + fmt(r.on) + '. Nothing for you to do.', go: p.id }); if (r && r.state === 'declined') cards.push({ kind: 'Reminder', title: p.name + ' declined your request', body: r.reason ? '“' + r.reason + '”' : 'No reason given.', go: p.id }); }
  for (const n of M.notices.filter(n => n.who === v.id)) cards.push({ kind: 'Reminder', title: 'Project ended', body: n.text });
  const kindChip = k => `<span class="chip ${k === 'Standing duty' ? 'pink' : k === 'Raised duty' ? '' : 'grey'}">${k}</span>`;
  return `<div class="stack" style="max-width:760px">
    <div><p class="eyebrow">Dashboard</p><h2 class="title">${esc(v.name.split(' ')[0])}'s Dashboard<span class="dot">.</span></h2><p class="small muted">Only the cards the Projects Hub puts here. The rest of the Dashboard is #35's.</p></div>
    ${cards.length ? cards.map((c, i) => `<div class="card ${i % 2 ? 'pink' : ''} duty"><span class="kind">${kindChip(c.kind)}</span><div style="flex:1"><div class="strong">${esc(c.title)}</div><div class="small">${esc(c.body)}</div></div>${c.go ? `<button class="btn" onclick="go('project','${c.go}','${c.sub || 'page'}')">Open</button>` : c.create ? `<button class="btn primary" onclick="go('create')">Create</button>` : ''}</div>`).join('')
      : `<div class="empty">Nothing from the Projects Hub.${holdsSeat(v) ? ' It queues nothing for Branch Management, the General Liaison or Exco.' : ''}</div>`}
  </div>`;
}

  const yes = (ok, l) => `<span class="${ok ? '' : 'no'}">${l}</span>`;
  return `<div class="chrome"><span class="proto">PROTOTYPE</span><b>Projects Hub · #65</b>
    <label>Seeing as <select onchange="UI.seat=this.value; syncUrl(); render()" aria-label="Seat">${SEAT_KEYS.map(k => `<option value="${k}" ${k === UI.seat ? 'selected' : ''}>${SEATS[k].label}</option>`).join('')}</select></label>
    <button class="btn" onclick="M=initialModel(); UI.page='dir'; UI.pid=null; render()">Reset everything</button>
    <button class="btn" onclick="go('project','orgamites')">Orgamites</button>
    <button class="btn" onclick="go('project','garden')">No Lead</button>
    <button class="btn" onclick="go('project','firstaid')">Completed</button>
    <button class="btn" onclick="go('project','podcast')">On ice</button>
    ${p ? `<span class="reads">On ${esc(p.name)}, you read: ${yes(true, 'page')}${yes(can.board(p, v), 'Board')}${yes(can.writeBoard(p, v), 'write Board')}${yes(can.tracker(p, v), 'tracker')}${yes(can.money(p, v), 'budget & spend')}${yes(can.mou(p, v), 'signed MOU')}${yes(can.edit(p, v), 'edit page')}</span>` : ''}
  </div>`;
}

function mainHTML() {
  if (UI.page === 'dash') return dashboardHTML();
  if (UI.variant === 'B') return B_all();
  if (UI.page === 'create') return `<div class="crumbs"><a onclick="go('dir')">Projects</a> / New</div>` + createHTML();
  if (UI.page === 'project') { const p = P(UI.pid); return UI.variant === 'A' ? A_project(p) : C_project(p); }
  const mouNote = flag('The ticket\'s brief asked for the <b>MOU records page</b> here. <code>CONTEXT.md</code> has since put it on the Operations Hub\'s <b>MOUs page</b> (moved by the Operations Hub ticket), so it belongs to the Operations Hub prototype, not this one.');
  return (UI.variant === 'A' ? A_dir() : C_dir()) + (holdsSeat(viewer()) && ['gl', 'exco'].includes(UI.seat) ? mouNote : '');
}

function render() {
  const a = document.activeElement, keep = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  document.getElementById('app').innerHTML = chromeHTML() + `<div class="wrap"><div class="screen">${shellHTML()}<main class="main">${mainHTML()}</main></div></div>
    <div class="switcher" role="group" aria-label="Prototype variant"><button onclick="cycle(-1)" aria-label="Previous variant">‹</button><span class="lbl">${UI.variant} · ${VARIANTS[UI.variant]}</span><button onclick="cycle(1)" aria-label="Next variant">›</button></div>`;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (_) {} } }
}
function cycle(d) { const k = Object.keys(VARIANTS); UI.variant = k[(k.indexOf(UI.variant) + d + k.length) % k.length]; syncUrl(); render(); }
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]') || document.getElementById('dlg').open) return;
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1);
});
syncUrl(); render();
</script>
</body>
</html>

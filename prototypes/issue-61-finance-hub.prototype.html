:root{
  /* ---- Save7 brand ---- */
  --pink:#ED0E69; --pink-dark:#C40C58; --pink-tint:#FDE7EF;
  --teal:#16B9B4; --teal-dark:#0F8E8A; --teal-tint:#E3F6F5;
  --cream:#F7F3EE; --ink:#111111; --border:#E4E2DD;
  /* ---- viz roles (validated: see palette note in footer) ---- */
  --surface-1:#FFFFFF;
  --series-1:#ED0E69;      /* pink  */
  --series-2:#00918C;      /* teal, stepped for 3:1 on white */
  --good:#00918C; --warn:#B87A00; --crit:#A31912;
  --good-tint:#E3F2F1; --warn-tint:#FBF2DF; --crit-tint:#FBE9E7;
  --grid:#EAE7E1;
  --text-primary:#111111; --text-secondary:#52514E; --text-muted:#8A8783;
  /* ---- geometry ---- */
  --r-lg:20px; --r-md:12px; --r-sm:8px;
  --shadow:0 12px 40px rgba(17,17,17,.08);
  --shadow-sm:0 4px 16px rgba(17,17,17,.06);
  --shadow-pop:0 24px 60px rgba(17,17,17,.18);
  --display:'BebasS7','Bebas Neue','Oswald',Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;
  /* Bebas Neue is condensed: with no tracking, uppercase words read as one blob at small
     sizes, and figures need less than words because tabular numerals already carry their
     own side bearings. But that is a statement about *small* type. It stops being true as
     the face grows — at 40px the same .03em pushes the letters apart and the headline
     loses its shape — so tracking is size-specific here, tightening as the type gets
     larger. Applied by size below, not by component. Tune here, never per component. */
  --track-display-lg:.012em;   /* 34px and up: page titles, the auth headline */
  --track-display:.026em;      /* 22-33px: section headings, modal titles */
  --track-display-sm:.038em;   /* under 22px: small caps labels, the rail */
  --track-figures:.012em;
  --track-figures-lg:.004em;   /* big money: tabular figures already carry side bearings */
  --sans:'InterS7','Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --side:250px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); background:var(--cream); color:var(--text-primary);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--pink);text-decoration:none}
a:hover{color:var(--pink-dark)}
::selection{background:var(--pink);color:#fff}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:4px}

/* ---- pressed states ----
   Everything interactive here had a :hover and nothing else. A touch device has no
   hover, so on a phone the first acknowledgement of a tap was the result appearing —
   and if the write took a moment, nothing had happened as far as the user could tell.
   Feedback belongs on the press, not on the release.

   Scale rather than colour, because it reads the same on every surface: the dark
   sidebar, the white cards and the pink primary button would each need their own
   colour treatment, and one of them would end up illegible.

   `transition` is on the base rule of each element, not here — a transition declared
   inside :active only animates the way in, and the release snaps back. */
.btn:active,.gbtn:active,.qa:active,.acct:active,.rcard:active,.rthumb:active,
.seg button:active,.m-h .x:active,.burger:active{transform:scale(.97)}
/* Icon buttons are small, so the same ratio is invisible on them. */
.ibtn:active{transform:scale(.92)}
/* A nav row is wide and short: scaling it looks like a wobble, so it takes the
   hover background instead, which on the drawer is the clearest signal available. */
.nav a:active,.signout:active{background:rgba(255,255,255,.14)}
.nav a.on:active{filter:brightness(1.08)}
/* A drop zone is a big target and a scale on it reads as the panel jumping. */
.drop:active{border-color:var(--pink);background:var(--pink-tint)}

/* The transition that animates the press lives further down, after the base rules —
   several of these declare their own `transition` shorthand later in the file, which
   would drop the transform half of this one. See "press transitions" below. */

/* ============ TYPE ============ */
.display{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:.005em}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-dark)}
.num{font-family:var(--display);font-weight:400;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
/* A pasted agenda, shown as it was pasted. `pre-wrap` keeps the line breaks somebody typed
   while still wrapping a long line rather than forcing the modal to scroll sideways, and the
   body face is deliberate — this is prose, not code, so the mono face would misrepresent it. */
/* A meeting, read back: topics, what was said, and what each one produced. */
.mv-pt{padding:12px 0;border-bottom:1px solid var(--border)}
.mv-pt:last-child{border-bottom:0}
.mv-pt-h{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13.5px}
.mv-done{text-decoration:line-through;color:var(--text-muted)}
.mv-pt-n{font-size:12.5px;color:var(--text-secondary);margin-top:4px;white-space:pre-wrap}
.mv-acts{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.6}
.mv-acts li{margin-bottom:3px}
/* A value to be read off the screen and copied, once. Selectable, wrapping, and
   big enough to transcribe by hand if the clipboard is unavailable. */
.cred{
  background:var(--cream);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 12px;font-size:14px;word-break:break-all;user-select:all;
}

.auth-brand .abtop{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
.auth-brand .abtop img{width:44px;height:44px}
.auth-brand .abtop .t1{font-family:var(--display);font-size:26px;text-transform:uppercase;line-height:1}
.auth-brand .abtop .t2{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
.auth-brand .mid{margin:auto 0;position:relative;z-index:2}
.auth-brand h1{font-family:var(--display);font-size:clamp(44px,5.2vw,82px);text-transform:uppercase;line-height:.92}
.auth-brand .feet{position:relative;z-index:2;font-size:12px;color:#6f6f6f;display:flex;gap:16px;flex-wrap:wrap}
.auth-brand .feet b{color:#9a9a9a;font-weight:600}
.auth-pane{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 40px;min-width:0}
.auth-card{width:100%;max-width:428px}
.auth-card .eyebrow{margin-bottom:10px}
.auth-card h2{font-family:var(--display);font-size:38px;text-transform:uppercase;line-height:1}
.auth-card .p{font-size:14px;color:var(--text-secondary);margin-top:14px;line-height:1.6}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 18px;margin-top:26px;
  background:#fff;border:1px solid #D5D2CB;border-radius:10px;font-size:15px;font-weight:600;color:#3c4043;
  box-shadow:0 2px 6px rgba(17,17,17,.06);transition:.16s}
.gbtn:hover{background:#F8F7F5;box-shadow:0 4px 14px rgba(17,17,17,.1)}
.gbtn svg{width:19px;height:19px;flex:0 0 19px}
.gbtn.busy{opacity:.7;pointer-events:none}
.auth-note{margin-top:18px;font-size:12.5px;color:var(--text-muted);line-height:1.6}
.acct{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:12px;text-align:left;transition:.14s;border:1px solid transparent}
.acct:hover{background:#fff;border-color:var(--border);box-shadow:var(--shadow-sm)}
.acct .av{width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;
  font-size:13px;font-weight:800;flex:0 0 36px}
.acct.ext .av{background:#9AA0A6}
.acct .n{font-size:14px;font-weight:600}
.acct .e{font-size:12.5px;color:var(--text-secondary)}
.acct .rr{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.acct-list{margin-top:18px;border-top:1px solid var(--border);padding-top:8px}
.acct-list .hd{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);padding:12px 14px 6px}
.deny{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;box-shadow:var(--shadow)}
.deny .ic{width:46px;height:46px;border-radius:14px;background:var(--crit-tint);display:grid;place-items:center}
.deny .ic svg{width:23px;height:23px;stroke:var(--crit);stroke-width:2.2;fill:none}
.deny h3{font-size:19px;font-weight:800;margin-top:18px}
.deny p{font-size:13.5px;color:var(--text-secondary);margin-top:10px;line-height:1.6}
.deny .code{margin-top:16px;background:var(--ink);border-radius:var(--r-sm);padding:12px 14px;font-family:var(--mono);font-size:11.5px;color:#FFA6C6}
.signout{margin-top:12px;width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
  font-size:12px;font-weight:600;color:#8f8f8f;transition:.15s}
.signout:hover{background:rgba(255,255,255,.07);color:#fff}
.signout svg{width:15px;height:15px;stroke-width:2;fill:none}
@media (max-width:900px){
  #auth{flex-direction:column}
  .auth-brand{flex:0 0 auto;padding:32px 28px}
  .auth-brand h1{font-size:42px} .auth-brand .mid{margin:26px 0}
  .auth-brand .feet{margin-top:22px}
  .auth-pane{padding:32px 24px}
}

/* ============ APP FRAME ============ */
/* 100dvh, not 100vh: on iOS Safari 100vh is the viewport as it would be with the
   browser chrome collapsed, which is taller than what you can actually see. The
   plain 100vh stays first as the fallback for anything without dvh support; where
   dvh is supported it wins, and on a desktop browser the two are identical. */
.app{min-height:100vh;min-height:100dvh}   /* display is controlled by the auth gate above */

  width:var(--side);flex:0 0 var(--side);background:var(--ink);color:#fff;

}

.side-head{padding:26px 22px 22px;display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.side-head img{width:38px;height:38px;object-fit:contain}
.side-head .t1{font-family:var(--display);font-size:23px;text-transform:uppercase;line-height:1}
.side-head .t2{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
/* The nav is the part that scrolls, not the sidebar. Sizing the whole sidebar to scroll put
   the sign-out below the fold as soon as the nav outgrew a phone's height — the footer was
   reachable, but only by scrolling for it. min-height:0 is what lets a flex item shrink
   below its content and actually scroll. Desktop is unchanged: the nav is shorter than the
   space, so it grows into it and the footer stays where margin-top:auto already put it. */
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px;position:relative;z-index:2;
  flex:1 1 auto;min-height:0;overflow-y:auto}
.nav-lbl{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#6b6b6b;padding:16px 10px 7px}
.nav a{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  color:#C9C7C2;font-size:13.5px;font-weight:500;transition:background .15s,color .15s;
}
.nav a svg{width:17px;height:17px;flex:0 0 17px;stroke-width:1.9}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--pink);color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(237,14,105,.35)}
.nav a .pill{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:10.5px;font-weight:700;
  padding:2px 7px;border-radius:20px;min-width:20px;text-align:center}
.nav a.on .pill{background:rgba(0,0,0,.25)}
.nav a .pill.alert{background:var(--warn);color:#fff}
/* --- the collapse control ---
   The sidebar could already become a 70px rail, but only because the window was between 861
   and 1180: a decision made for the reader by their window width. This is the same rail, asked
   for. On a wide screen fourteen destinations are worth 250px to somebody navigating and
   nothing at all to somebody reading a ledger, and which of those they are doing is not
   something a media query can know. */
/* No box. A bordered, filled square beside the wordmark reads as a second piece of branding
   competing with the mark — the heaviest thing in the head, for the least important job in it.
   What it is instead is a mark in the margin: the same grey as the group headings below, a
   circle of light on hover, and 30px of target around a 16px glyph. */
.side-rail{
  margin-left:auto;flex:0 0 30px;width:30px;height:30px;padding:0;
  display:grid;place-items:center;border:0;background:none;border-radius:50%;
  color:#6f6f6f;transition:color .16s,background .16s;
}
/* Thin, because it sits beside 10px letter-spaced small caps and a 2px stroke at this size is
   the boldest line in the panel. */
.side-rail svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.7;fill:none;
  transition:transform .24s cubic-bezier(.2,.9,.3,1)}
.side-rail:hover{color:#fff;background:rgba(255,255,255,.08)}
.side-rail:active{background:rgba(255,255,255,.15)}
.side-rail:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
/* One icon, turned round rather than swapped, so the control says which way it will go and the
   turn itself is the feedback that it was pressed. */
.app.rail .side-rail svg{transform:rotate(180deg)}
.side-foot{margin-top:auto;flex:0 0 auto;padding:16px;position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.1)}
.who{display:flex;align-items:center;gap:11px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;
  font-size:12.5px;font-weight:800;flex:0 0 34px}
.who .n{font-size:13px;font-weight:600;color:#fff}
.who .r{font-size:11px;color:#8f8f8f}
.side-foot .env{margin-top:12px;font-size:10.5px;color:#6f6f6f;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block}

/* --- main --- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:40;background:rgba(247,243,238,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:20px 34px 18px;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;
}
.top h1{font-family:var(--display);font-size:40px;text-transform:uppercase;line-height:1;margin-top:5px}
.top .sub{font-size:13px;color:var(--text-secondary);margin-top:7px;max-width:min(520px,42vw)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;padding-bottom:3px}
.wrap{padding:26px 34px 60px;max-width:1560px;width:100%}

/* ============ CONTROLS ============ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);
  font-size:13px;font-weight:700;transition:background .16s,color .16s,border-color .16s,box-shadow .16s;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke-width:2.2}
.btn-p{background:var(--pink);color:#fff;box-shadow:0 6px 18px rgba(237,14,105,.22)}
.btn-p:hover{background:var(--pink-dark)}
.btn-t{background:var(--teal-dark);color:#fff}
.btn-t:hover{background:#0b7a76}
.btn-g{background:#fff;color:var(--text-primary);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.btn-g:hover{border-color:#C9C6C0;background:#fdfdfc}
.btn-d{background:var(--ink);color:#fff}
.btn-d:hover{background:#000}
.btn-s{padding:7px 12px;font-size:12px;border-radius:7px}
.btn-s svg{width:14px;height:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-secondary)}
.field .hint{font-size:11.5px;color:var(--text-muted)}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;
  font-size:13.5px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(237,14,105,.12)}
input[readonly]{background:#F6F5F2;color:var(--text-secondary)}
/* A checkbox and its label on one line. The label text is sentence case, not the
   uppercase treatment .field>label gets — these read as statements, not as names
   of fields. */
.chk{display:flex;align-items:center;gap:9px;margin-top:7px;font-size:13px;
  font-weight:500;letter-spacing:normal;text-transform:none;color:var(--text-primary);cursor:pointer}
.chk input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--pink);cursor:pointer}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238A8783' stroke-width='2.4' stroke-linecap='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:32px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;gap:2px;box-shadow:var(--shadow-sm)}
.seg button{padding:6px 13px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text-secondary)}
.seg button.on{background:var(--ink);color:#fff}
/* The sort control. Smaller than the period toggle on purpose: that one changes what the whole
   page is about, this one only changes the order of one table, and giving them equal weight
   would make every section header compete with the page. */
/* nowrap, or "A–Z" breaks at the en-dash and the button becomes two lines tall. */
.seg-sm button{padding:4px 9px;font-size:11.5px;white-space:nowrap}
/* Empty until paintSortSegs() fills it — without this an unfilled placeholder draws its own
   border and padding as a stray 6px box. */
.seg-sm:empty{display:none}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-muted);stroke-width:2.2;fill:none}
.search input{padding-left:33px;min-width:230px}

/* A label only a screen reader hears. The tracker's tables carry a header row per column, but a
   bare checkbox in a cell reads out as "checkbox" with nothing attached to it — so each one
   names itself. Clipped rather than display:none, which removes it from the accessibility tree
   along with everything else. */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- the project tracker's section rail (0068) ----
   Thirteen sections will not fit in a .seg, and wrapping them into three rows of chips puts a
   navigation block taller than the content above every section. So it scrolls sideways, with
   the sticky position keeping it in reach while a long section is being read — the rail is how
   you get out of section 05, and a rail you have to scroll back up to find is a dead end. */
.trk-rail{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px 14px;
  border-bottom:1px solid var(--border);position:sticky;top:-1px;z-index:2;
  background:linear-gradient(#fff 70%,rgba(255,255,255,.85));
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trk-rail::-webkit-scrollbar{display:none}
.trk-chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;
  color:var(--text-secondary);white-space:nowrap}
.trk-chip .n{font-family:var(--font-num,inherit);font-size:11px;color:var(--text-muted)}
.trk-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.trk-chip.on .n{color:rgba(255,255,255,.7)}
/* A dot rather than a tick or a count: it says "there is something in this section", which is
   all the rail can honestly know. Filled means written in, hollow means blank. Colour is never
   the only signal — the chip's title attribute says the same thing in words. */
.trk-chip .dot{width:6px;height:6px;border-radius:50%;flex:none;
  border:1.5px solid var(--text-muted);background:transparent}
.trk-chip .dot.filled{background:var(--good);border-color:var(--good)}
.trk-chip.on .dot{border-color:rgba(255,255,255,.6)}
.trk-chip.on .dot.filled{background:#fff;border-color:#fff}
/* A section of the document. The number is set in the heading rather than as a list marker so
   it can be selected and quoted — people refer to "5.2" out loud in these meetings. */
.trk-sec{margin:0 0 22px}
.trk-sec>h4{font-size:14.5px;font-weight:800;letter-spacing:-.01em;margin:0 0 3px}
.trk-sec>.sub{font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin:0 0 12px}
/* Dense tables of inputs. The default cell padding is set for reading, and a row of eight
   inputs with it is twice as tall as it needs to be. */
.trk-tbl input,.trk-tbl select,.trk-tbl textarea{min-width:0;width:100%}
.trk-tbl td{padding:6px 8px;vertical-align:top}
.trk-tbl th{white-space:nowrap}
/* The first column is what the row is *about* — a task title, a risk, a KPI — and at an equal
   share of the width it truncates to three words while a Yes/No column beside it has room to
   spare. A select needs enough for its longest option plus the chevron, or "In progress" reads
   as "In p". The table scrolls inside .tbl-wrap when the sum exceeds the sheet. */
.trk-tbl td:first-child,.trk-tbl th:first-child{min-width:190px}
.trk-tbl select{min-width:118px}
.trk-tbl input[type=date]{min-width:132px}
/* Without this the browser squeezes whichever text column has no floor down to two characters —
   "Delivery" rendered as "De" once the selects and dates around it claimed their minimums. */
.trk-tbl input[type=text]{min-width:112px}
/* A row staged for deletion. Kept visible and struck through rather than removed, because the
   save is what commits it and a row that vanished on click cannot be reconsidered. */
.trk-tbl tr.dropped{opacity:.45}
.trk-tbl tr.dropped input,.trk-tbl tr.dropped select,.trk-tbl tr.dropped textarea{
  text-decoration:line-through;pointer-events:none}

/* ============ CARDS ============ */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.card-h{padding:20px 24px 0;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.card-h .ttl{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.card-h .cap{font-size:12.5px;color:var(--text-secondary);margin-top:3px}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-b{padding:20px 24px 24px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-21{grid-template-columns:1.65fr 1fr}
.g-12{grid-template-columns:1fr 1.65fr}
.sec-h{display:flex;align-items:baseline;gap:16px;margin:34px 0 16px}
.sec-h .no{font-family:var(--display);font-size:26px;color:var(--pink)}
.sec-h h2{font-family:var(--display);font-size:27px;text-transform:uppercase;line-height:1}
.sec-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
/* A condensed display face's natural line height exceeds its font size, so at
   line-height:1 the glyphs spill above and below their box and a fixed gap gets
   swallowed by that spill, making the eyebrow read as touching the heading.
   Proportional, so a 40px h1 gets more air than a 27px h2, and generous enough
   for the jump from small tracked-out caps to a heavy display face. */
/* tracking for the display face — see --track-display */
.display,
.auth-brand .abtop .t1, .auth-brand h1, .auth-card h2,
/* Grouped by size, which is what tracking actually depends on — not by what the element
   happens to be. .top h1 is 40px and .side-head .t1 is 23px; they had the same value. */
.sec-h h2, .m-h h3{letter-spacing:var(--track-display)}                    /* 27-28px */
.top h1, .auth-brand h1, .auth-card h2, .hero h2{letter-spacing:var(--track-display-lg)}
.side-head .t1, .rgrp .l, .auth-brand .abtop .t1{letter-spacing:var(--track-display-sm)}
.num, .sec-h .no, .calc .v{letter-spacing:var(--track-figures)}
/* The tile numeral is the largest figure on any page and the one most hurt by air. */
.tile .val{letter-spacing:var(--track-figures-lg)}
.eyebrow{line-height:1.35}
.eyebrow + h1, .eyebrow + h2, .eyebrow + h3, .eyebrow + .display, .eyebrow + .num{margin-top:.34em}
/* A wrapped display heading stacks its own lines tightly by design; this stops
   the tightness turning into an overlap on a narrow window. */
h1.display, h2, .top h1, .sec-h h2{padding-top:.04em}

/* --- stat tiles --- */
.tile{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
/* The tile a Dashboard chip jumped to: a ring that fades, so the eye finds it after the scroll. */
.mw-flash{animation:mwflash 1.6s ease-out}
@keyframes mwflash{0%{box-shadow:0 0 0 3px var(--pink)}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){
  .mw-flash{animation:none;outline:3px solid var(--pink);outline-offset:2px}
}
.tile .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.tile .val{font-family:var(--display);font-size:40px;line-height:1;margin-top:12px;font-variant-numeric:tabular-nums}
.tile .val .cur{font-size:22px;color:var(--text-muted);margin-right:3px}
.tile .foot{font-size:12px;color:var(--text-secondary);margin-top:9px;display:flex;align-items:center;gap:7px}
.tile.dark{background:var(--ink);border-color:var(--ink)}
.tile.dark .lbl{color:var(--teal)}
.tile.dark .val{color:#fff}
.tile.dark .foot{color:#9a9a9a}
.tile.pink{background:var(--pink);border-color:var(--pink)}
.tile.pink .lbl{color:rgba(255,255,255,.8)}
.tile.pink .val{color:#fff}
.tile.pink .foot{color:rgba(255,255,255,.85)}
.tile .spark{position:absolute;right:0;bottom:0;opacity:.9}
.tile:has(.spark) .foot{max-width:calc(100% - 126px)}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px}
.delta svg{width:13px;height:13px;stroke-width:2.6}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)}
.tile.dark .delta.up,.tile.pink .delta.up{color:#7EE0DB}
.tile.dark .delta.down,.tile.pink .delta.down{color:#FFB3AC}

/* --- badges --- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge svg{width:12px;height:12px;stroke-width:2.6;fill:none}
.b-good{background:var(--good-tint);color:#0A6B67}
.b-warn{background:var(--warn-tint);color:#7A5100}
.b-crit{background:var(--crit-tint);color:var(--crit)}
.b-neutral{background:#F1EFEB;color:var(--text-secondary)}
.b-pink{background:var(--pink-tint);color:var(--pink-dark)}
.b-ink{background:var(--ink);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:#F4F2EE;
  border:1px solid var(--border);font-size:11.5px;font-weight:600;color:var(--text-secondary)}
.chip .sw{width:8px;height:8px;border-radius:2px}

/* ============ TABLES ============ */
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--border)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.tbl th{
  text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text-muted);
  padding:11px 13px;background:#FBFAF8;border-bottom:1px solid var(--border);position:sticky;top:0;white-space:nowrap}
table.tbl td{padding:11px 13px;border-bottom:1px solid #F1EFEB;vertical-align:middle}
table.tbl tbody tr:hover td{background:#FDFCFA}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl td.r,table.tbl th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl td{white-space:normal}
table.tbl .nw{white-space:nowrap}
table.tbl tfoot td{padding:12px 16px;background:#FBFAF8;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-muted)}
table.tbl .strong{font-weight:700}
table.tbl .dim{color:var(--text-secondary)}
table.tbl .who2{display:flex;align-items:center;gap:9px}
table.tbl .who2 .strong{white-space:nowrap}
table.tbl .who2 .av{width:27px;height:27px;border-radius:50%;background:var(--pink-tint);color:var(--pink-dark);
  display:grid;place-items:center;font-size:10.5px;font-weight:800;flex:0 0 27px}
.row-act{display:flex;gap:6px;justify-content:flex-end}
.ibtn{width:29px;height:29px;border-radius:7px;border:1px solid var(--border);display:grid;place-items:center;background:#fff;transition:.15s}
.ibtn svg{width:14px;height:14px;stroke-width:2.1;fill:none;stroke:var(--text-secondary)}
.ibtn:hover{border-color:var(--pink);background:var(--pink-tint)}
.ibtn:hover svg{stroke:var(--pink-dark)}
.empty{padding:52px 24px;text-align:center;color:var(--text-muted)}
.empty svg{width:34px;height:34px;stroke:var(--border);stroke-width:1.6;fill:none;margin-bottom:12px}

/* ============ CHARTS ============ */
.viz{position:relative}
.viz svg{display:block;width:100%;overflow:visible}
.viz .gridline{stroke:var(--grid);stroke-width:1}
.viz .axis-t{font-size:11px;fill:var(--text-muted);font-family:var(--sans)}
.viz .val-t{font-size:11.5px;font-weight:700;fill:var(--text-primary);font-family:var(--sans);font-variant-numeric:tabular-nums}
.viz .hit{fill:transparent}
.viz .hit:hover{fill:rgba(17,17,17,.035)}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
/* flex:none, or a narrow card shrinks each item below its own text and the next
   swatch rides over the tail of the previous label ("Surpl" then a red block).
   The legend wraps to a second line instead. */
.legend .it{display:flex;align-items:center;gap:7px;flex:none;white-space:nowrap;
  font-size:12px;font-weight:600;color:var(--text-secondary)}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend .sw.line{height:3px;width:16px;border-radius:2px}
.tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-100%);transition:opacity .12s;
  background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:var(--shadow-pop);z-index:20;min-width:130px}
.tip .th{font-weight:800;margin-bottom:6px;font-size:12.5px}
.tip .tr{display:flex;align-items:center;gap:8px;margin-top:3px}
.tip .tr .sw{width:9px;height:9px;border-radius:2px;flex:0 0 9px}
.tip .tr .k{color:#B9B9B9}
.tip .tr .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
details.tv{margin-top:14px;border-top:1px dashed var(--border);padding-top:10px}
details.tv summary{font-size:11.5px;font-weight:700;color:var(--text-secondary);cursor:pointer;letter-spacing:.04em}
details.tv summary:hover{color:var(--pink)}
details.tv table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
details.tv th,details.tv td{padding:6px 8px;border-bottom:1px solid #F1EFEB;text-align:left}
details.tv td.r,details.tv th.r{text-align:right;font-variant-numeric:tabular-nums}

/* progress / budget bars */
.pbar{height:9px;border-radius:99px;background:#EFEDE8;overflow:hidden;position:relative}
.pbar span{display:block;height:100%;border-radius:99px;background:var(--series-2);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pbar span.warn{background:var(--warn)} .pbar span.crit{background:var(--crit)}
.pbar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
.bmeta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}
.bmeta .l{font-weight:700} .bmeta .r{color:var(--text-secondary);font-variant-numeric:tabular-nums}
/* The sentence under a budget bar. A class rather than four copies of the same inline
   style, because it says a different thing in each of the four places it appears and the
   only part that should differ is the words. */
.bfoot{font-size:11.5px;color:var(--text-muted);margin-top:6px;line-height:1.5}

/* ============================ MY WORK: SHARED ROWS ==========================
   The old My work's grid and tiles went with that page (November 2026). What is left here is the
   row and the tick the Dashboard still uses, in To be paid and on the board. */
/* One row of a shortlist or horizon list. Grid rather than flex: the leading column is a fixed
   affordance and the trailing one a fixed control, and only the middle should absorb slack —
   with flex the name column shrank to nothing behind a long project title. */
.mw-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;
  gap:11px;padding:9px 0;border-bottom:1px solid var(--border)}
.mw-row:last-child{border-bottom:0}
.mw-row-n{font-weight:600;color:var(--ink);font-size:13.5px;line-height:1.35}
.mw-row-s{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.mw-row-r{display:flex;align-items:center;gap:6px;justify-self:end}
/* A row with nothing to tick. The three-column grid above reserves its first column for the
   affordance, so a two-child row put its trailing badge in the middle column and left the
   right-hand one empty — the badge drifted into the text instead of sitting at the edge. */
.mw-row.mw-plain{grid-template-columns:minmax(0,1fr) auto}
/* Staging only (window.OS_STAGING): the password sign-in, and a ribbon so nobody mistakes it for production. */
.stg-form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.stg-form input{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font:inherit}
#stgRibbon{position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#B87A00;color:#fff;
  font:700 11px/1.9 system-ui,sans-serif;text-align:center;letter-spacing:.08em;pointer-events:none}

/* The Meetings reader: the list on the left, the whole meeting on the right, agenda beside minutes. */
.mt-reader{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start;margin-bottom:8px}
.mt-list{position:sticky;top:96px;max-height:calc(100vh - 120px);display:flex;flex-direction:column}
.mt-list-h{display:flex;align-items:center;gap:8px;padding:14px 14px 4px}
.mt-list-h .ttl{font-weight:700;font-size:14px}
.mt-list-c{font-size:11.5px;padding:0 14px 8px}
#mtList{overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
.mt-item{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid transparent;
  background:none;cursor:pointer;font:inherit;color:inherit;transition:background .12s}
.mt-item:hover{background:#F4F3F0}
.mt-item:active{background:#ECEBE7}
.mt-item.on{background:var(--pink-tint);border-color:#F6C9DA}
.mt-item:focus-visible{outline:2px solid var(--pink);outline-offset:1px}
.mt-item-d{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.02em}
.mt-item.on .mt-item-d{color:var(--pink-dark)}
.mt-item-t{font-weight:600;font-size:13.5px;color:var(--ink)}
.mt-item-s{font-size:11.5px;color:var(--text-secondary)}
.mt-view{padding:22px 24px 24px;min-width:0}
.mt-view-h{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:16px}
.mt-view-t{font-size:24px;font-weight:800;line-height:1.15;margin-top:4px;color:var(--ink)}
.mt-view-s{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px}
.mt-view-a{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mt-view-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px}
.mt-col-h{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-dark);margin-bottom:10px}
.mt-who{font-weight:700;font-size:13px;color:var(--ink);margin:14px 0 4px}
.mt-who:first-of-type{margin-top:0}
.mt-pts{margin:0 0 4px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.mt-pt{font-size:13.5px;line-height:1.45}
.mt-pt-r{display:flex;align-items:center;gap:4px}
.mt-pt-r .mw-tick{width:30px;height:30px;margin-left:-6px}
.mt-pt-r .mw-tick::before{width:18px;height:18px}
.mt-pt-t{flex:1;min-width:0}
.mt-pt.done .mt-pt-t{color:var(--text-muted);text-decoration:line-through}
.mt-pt .row-act{opacity:0;transition:opacity .12s}
.mt-pt:hover .row-act,.mt-pt:focus-within .row-act{opacity:1}
.mt-subs{margin:2px 0 0 18px;padding:0;font-size:12.5px;color:var(--text-secondary)}
.mt-minutes{border-left:1px solid var(--border);padding-left:28px}
.md{font-size:13.5px;line-height:1.55;color:var(--text-primary)}
.md .md-h{font-weight:800;color:var(--ink);margin:16px 0 6px}
.md .md-h:first-child{margin-top:0}
.md .md-h1{font-size:17px}
.md .md-h2{font-size:15px}
.md .md-h3{font-size:13.5px}
.md p{margin:0 0 8px}
.md ul{margin:0 0 8px 18px;padding:0;display:flex;flex-direction:column;gap:3px}
@media (max-width:1400px){ .mt-view-b{grid-template-columns:1fr} .mt-minutes{border-left:0;padding-left:0;border-top:1px solid var(--border);padding-top:16px} }
@media (max-width:1100px){ .mt-reader{grid-template-columns:1fr} .mt-list{position:static;max-height:none} #mtList{max-height:320px} }
@media (max-width:860px){ .mt-view{padding:16px} .mt-view-a{margin-left:0} .mt-pt .row-act{opacity:1} }

/* To be paid (0140): a record of what has gone out, folded away under the list of what has not. */
.topay-done{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.topay-done summary{font-size:12px;font-weight:600;color:var(--text-secondary);cursor:pointer;padding:4px 0}
.topay-done .mw-row-n{font-weight:500}
/* A day heading inside a card. Small caps like the group headings, not a card title: it is a
   divider in a list, not a section of the page. */
.mw-day{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-muted);padding:12px 0 2px}
.mw-day:first-child{padding-top:0}
.mw-row-n a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--border)}
.mw-row-n a:hover{color:var(--pink);border-bottom-color:var(--pink)}

/* The tick. The circle is 26px because that is the size it should look, and the *button* is
   40px because that is the size it has to be to aim at with a thumb — the two are different
   numbers and conflating them is what the suite's tap-target guard caught here. The hit area is
   the padding around a drawn circle, not a bigger circle.

   Press state on :active, so a touch device gets an answer on the way down rather than on
   release. Never shrunk by the compact density: density is spacing, and a target is not
   spacing. */
.mw-tick{width:40px;height:40px;flex:none;border:0;background:none;padding:0;cursor:pointer;
  display:grid;place-items:center;position:relative}
.mw-tick::before{content:"";width:26px;height:26px;border-radius:50%;border:1.6px solid #B9B5AF;
  background:#fff;transition:border-color .12s ease,background .12s ease,transform .1s ease}
.mw-tick::after{content:"";position:absolute;width:9px;height:5px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg) translate(1px,-1px);opacity:0;transition:opacity .1s ease}
.mw-tick:hover::before{border-color:var(--teal)}
.mw-tick:active::before{transform:scale(.9);background:var(--teal);border-color:var(--teal)}
.mw-tick:active::after{opacity:1}
/* Already ticked. The shortlist card never needed this — a milestone ticked there disappears —
   but an agenda topic stays on its meeting after being dealt with, so the control has to show
   a settled checked state and not only the press. */
.mw-tick.on::before{background:var(--teal);border-color:var(--teal)}
.mw-tick.on::after{opacity:1}
.mw-tick:focus-visible{outline:2px solid var(--teal);outline-offset:-4px;border-radius:50%}

@media (prefers-reduced-motion:reduce){
  .mw-tick::before,.mw-tick::after{transition:none}
}

/* ------------------------------- the task board ---------------------------
   Columns scroll sideways rather than restacking, for the same reason the tables do: the
   columns are the point. A minimum width on each, or four of them squeeze into the viewport
   and every card wraps into a tower. */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:6px}
.board-col{flex:0 0 262px;min-width:262px;background:var(--surface-2,#F2EEE9);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:10px}
/* The drop target, lit while a card is over it. A dashed edge rather than a fill: the cards
   inside it stay readable, and it reads as "this space is open" instead of as a selection. */
.board-col.over{border-color:var(--teal);border-style:dashed;background:#EAF7F6}
.board-col-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.board-col-n{font-weight:700;font-size:12px;letter-spacing:.02em;text-transform:uppercase;
  color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-col-c{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.board-cards{min-height:42px;display:flex;flex-direction:column;gap:7px}

/* A card. Transition on transform only, and `.dragging` drops it so the held card tracks the
   pointer 1:1 — the rule the sidebar drawer and the preferences list already follow. */
.board-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);
  padding:9px 10px;cursor:grab;touch-action:none;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .15s ease}
.board-card:active{cursor:grabbing}
/* pointer-events:none is load-bearing, not polish. The held card travels under the cursor, so
   while it is hit-testable `elementFromPoint` returns the card — and therefore the column it
   came from — instead of the column it is over. The destination never lights up and the drop
   resolves to "same column", which is a no-op. The card has to be transparent to hit-testing
   for the board underneath it to be findable at all. */
.board-card.dragging{transition:none;box-shadow:var(--shadow-pop);position:relative;z-index:4;
  cursor:grabbing;pointer-events:none}
.board-card.placeholder{opacity:.3}
.board-card-t{font-weight:600;font-size:13px;color:var(--ink);line-height:1.35}
.board-card-s{font-size:11px;color:var(--text-muted);margin-top:4px;display:flex;gap:6px;
  align-items:center;flex-wrap:wrap}
.board-card-acts{display:flex;gap:2px;justify-content:flex-end;margin-top:6px}
.board-empty{font-size:11.5px;color:var(--text-muted);padding:8px 2px}

/* Which project a card belongs to, in the merged view. Above the title rather than below it:
   scanning a mixed column, the project is the first thing you need to know. */
.board-card-p{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* The toggle and the legend. Wraps, because the legend grows with the number of projects and a
   single line of it would push the select off a narrow card. */
.board-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.board-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text-secondary)}
.board-key{display:inline-flex;align-items:center;gap:5px}
.board-dot{width:8px;height:8px;border-radius:2px;flex:none}

/* The column list in the editor. Same 40px-target rule as the tick: the arrows are what
   somebody without a pointer uses to reorder, so they are real buttons at a real size. */
.bc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;
  padding:7px 0;border-bottom:1px solid var(--border)}
.bc-row:last-child{border-bottom:0}
.bc-row input{width:100%}
.bc-acts{display:flex;gap:2px;align-items:center}
/* The finished tick, inside the column editor's action row. A label rather than a bare
   checkbox: "done" beside it is the whole explanation, and the word is the target as well. */
.bc-done{display:flex;align-items:center;gap:5px;margin-right:6px;cursor:pointer;
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-muted);white-space:nowrap}
.bc-done input{width:15px;height:15px;margin:0;accent-color:var(--pink)}
.bc-done:hover{color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  .board-card{transition:transform .1s linear}
}


/* ============ CHART SWATCHES ============ */
/* .sw is a colour swatch: the small block that ties a legend entry, a chip or a
   tooltip row to a series colour. It used to be a toggle switch too — same class
   name, two meanings — and the switch rule set `flex:0 0 40px`, which the swatch
   rules never overrode. That forced every legend swatch to 40px of flex basis, so
   on a narrow card the label was squeezed and the next swatch overlapped the tail
   of the previous one. The switch went with the permissions drawer, so the rule
   is gone and only the swatch meaning is left. Sizes stay per context. */
.sw{display:inline-block;flex:none;border-radius:3px}
.locked{padding:44px 24px;text-align:center;color:var(--text-muted);background:#FBFAF8;border:1px dashed #DCD8D1;border-radius:var(--r-lg)}

.locked .t{font-size:14px;font-weight:700;color:var(--text-secondary)}

.hero h2{font-family:var(--display);font-size:38px;text-transform:uppercase;line-height:1;margin:10px 0 0}
.hero .p{font-size:13.5px;color:#a8a8a8;margin-top:12px;max-width:520px}
.hero .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;position:relative;z-index:2}
.qa{display:flex;gap:14px;align-items:center;padding:18px 20px;background:#fff;border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow);cursor:pointer;transition:.16s;text-align:left;width:100%}
.qa:hover{transform:translateY(-2px);border-color:#D6D2CA;box-shadow:var(--shadow-pop)}
.qa .ic{width:44px;height:44px;border-radius:12px;background:var(--pink-tint);display:grid;place-items:center;flex:0 0 44px}
.qa .ic svg{width:21px;height:21px;stroke:var(--pink-dark);stroke-width:2;fill:none}
.qa.teal .ic{background:var(--teal-tint)} .qa.teal .ic svg{stroke:var(--teal-dark)}
.qa .t{font-size:15px;font-weight:800} .qa .s{font-size:12.5px;color:var(--text-secondary);margin-top:2px}
.qa .go{margin-left:auto;color:var(--text-muted)}
.qa .go svg{width:18px;height:18px;stroke-width:2.2;fill:none}

/* ============ RECEIPTS ============ */
.drop{border:1.5px dashed #CFCBC3;border-radius:var(--r-md);padding:22px;text-align:center;background:#FBFAF8;transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--pink);background:var(--pink-tint)}
.drop svg{width:26px;height:26px;stroke:var(--text-muted);stroke-width:1.8;fill:none;margin-bottom:8px}
.drop .t{font-size:13px;font-weight:700}
.drop .s{font-size:11.5px;color:var(--text-muted);margin-top:4px}
.drop input{display:none}
.rprev{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-md);background:#fff;margin-top:10px}
.rprev img{width:44px;height:44px;object-fit:cover;border-radius:7px;border:1px solid var(--border);background:#F6F5F2}
.rprev .fi{width:44px;height:44px;border-radius:7px;background:var(--pink-tint);display:grid;place-items:center;flex:0 0 44px}
.rprev .fi svg{width:20px;height:20px;stroke:var(--pink-dark);stroke-width:2;fill:none}
.rprev .n{font-size:12.5px;font-weight:700;word-break:break-all}
.rprev .m{font-size:11px;color:var(--text-muted);margin-top:2px}
.rthumb{width:34px;height:34px;border-radius:7px;object-fit:contain;object-position:center;padding:1px;border:1px solid var(--border);background:#F6F5F2;cursor:pointer;transition:.15s}
.rthumb:hover{border-color:var(--pink);transform:scale(1.06)}
/* The odometer cell: photo(s), then the reading, on one line, readings aligned on the right. */
.odo{display:inline-flex;align-items:center;justify-content:flex-end;gap:8px;white-space:nowrap}
.odo .chip{padding:2px 8px;font-size:11.5px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}
.rcard{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:#fff;box-shadow:var(--shadow-sm);cursor:pointer;transition:.16s}
/* A group heading inside the card grid. grid-column:1/-1 makes it span the whole
   row rather than being laid out into a card slot. */
.rgrp{grid-column:1/-1;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;
  margin:14px 0 0;padding-bottom:9px;border-bottom:1px solid var(--border)}
.rgrp:first-child{margin-top:0}
.rgrp .l{font-family:var(--display);font-size:19px;text-transform:uppercase;line-height:1}
.rgrp .s{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.rgrp .n{margin-left:auto;font-size:12px;font-weight:700;color:var(--text-secondary);white-space:nowrap}
.rgrp-more{grid-column:1/-1;padding:0 2px 6px;font-size:12px;color:var(--text-muted)}
.rcard:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:#D6D2CA}
.rcard .im{height:132px;background:#F6F5F2;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--border)}
.rcard .im img{width:100%;height:100%;object-fit:cover}
.rcard .bd{padding:11px 13px}
.rcard .bd .a{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.rcard .bd .b{font-size:11.5px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .bd .c{margin-top:8px;display:flex;gap:6px;align-items:center;justify-content:space-between}

/* ============ MODAL / DRAWER ============ */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.5);backdrop-filter:blur(3px);z-index:100;display:none;
  align-items:flex-start;justify-content:center;padding:44px 20px;overflow-y:auto}
.scrim.on{display:flex}
/* Laid out but invisible, for one frame, so the modal's box can be measured before it is
   shown. A display:none element has no geometry, and the transform-origin has to be a
   percentage of the real box or the sheet grows from the wrong place. */
.scrim.measuring{display:flex;visibility:hidden}
.modal{background:var(--cream);border-radius:22px;box-shadow:var(--shadow-pop);width:100%;max-width:640px;overflow:hidden;
  animation:pop .22s cubic-bezier(.2,.9,.3,1)}
.modal.wide{max-width:940px}
/* Grows from wherever it was opened — openModal() sets transform-origin to the control
   that was pressed. It used to rise 14px and scale from .985 about its own centre, which
   is the one origin that is never true: the relationship between the button and the panel
   it produced had to be inferred rather than seen. The scale is deeper now (.94) because
   at .985 there is no perceptible growth to read a direction from. */
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.m-h{padding:22px 26px;background:var(--ink);color:#fff;display:flex;align-items:flex-start;gap:16px}
.m-h .eyebrow{color:var(--teal)}
.m-h h3{font-family:var(--display);font-size:28px;text-transform:uppercase;line-height:1;margin-top:6px}
.m-h .x{margin-left:auto;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:0 0 32px}
.m-h .x:hover{background:var(--pink)}
.m-h .x svg{width:16px;height:16px;stroke:#fff;stroke-width:2.4;fill:none}
.m-b{padding:24px 26px;max-height:min(66vh,720px);overflow-y:auto}
.m-f{padding:16px 26px;background:#fff;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.m-f .note{margin-right:auto;font-size:11.5px;color:var(--text-muted);max-width:340px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
.calc{background:var(--ink);color:#fff;border-radius:var(--r-md);padding:14px 16px;display:flex;align-items:center;gap:14px}
.calc .k{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.calc .v{font-family:var(--display);font-size:30px;line-height:1;margin-left:auto;font-variant-numeric:tabular-nums}
.calc .f{font-size:11.5px;color:#9a9a9a}

/* toast */
.toasts{position:fixed;left:calc(var(--side) + 22px);bottom:22px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.toast{background:var(--ink);color:#fff;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow-pop);
  display:flex;align-items:center;gap:11px;font-size:13px;font-weight:600;animation:tin .25s ease-out;max-width:380px}
.toast svg{width:17px;height:17px;stroke-width:2.4;fill:none;flex:0 0 17px}
.toast.ok svg{stroke:var(--teal)} .toast.warn svg{stroke:#F0C24B}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* db inspector */
.db{background:var(--ink);border-radius:var(--r-md);padding:16px;overflow-x:auto}
.db pre{font-family:var(--mono);font-size:11.5px;color:#D8D6D0;line-height:1.65;white-space:pre}
.db .k{color:#7EE0DB} .db .s{color:#FFA6C6} .db .n{color:#F0C24B} .db .c{color:#6f6f6f}
/* A data grid is read across, not down. Left to wrap, a date broke onto three lines and
   every row grew to the height of its longest cell — so rows stay on one line and the
   .tbl-wrap around them scrolls sideways instead. */
.dbgrid td,.dbgrid th{white-space:nowrap}
.schema{display:grid;grid-template-columns:auto 1fr;gap:0;font-family:var(--mono);font-size:11.5px;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.schema div{padding:7px 12px;border-bottom:1px solid #F1EFEB;background:#fff}
.schema div:nth-child(odd){color:var(--pink-dark);font-weight:700;background:#FBFAF8}
.schema div:nth-child(even){color:var(--text-secondary)}

.note{background:var(--teal-tint);border:1px solid #BFE7E5;border-radius:var(--r-md);padding:14px 16px;font-size:12.5px;color:#0A6B67;display:flex;gap:11px}
.note svg{width:17px;height:17px;stroke:var(--teal-dark);stroke-width:2.2;fill:none;flex:0 0 17px;margin-top:1px}
/* A list you tick, inside a form. Scrolls at eight-ish rows rather than growing the modal
   past the fold: the Add button underneath it has to stay reachable, and a list that pushes its
   own action off the screen is a list nobody finishes using. */
.picklist{margin-top:8px;max-height:188px;overflow-y:auto;border:1px solid var(--border);
  border-radius:var(--r-md);background:#fff}
.picklist label{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13px;
  cursor:pointer;border-bottom:1px solid #F4F2EE;margin:0;text-transform:none;letter-spacing:0}
.picklist label:last-child{border-bottom:0}
.picklist label:hover{background:var(--cream)}
.picklist input[type=checkbox]{width:16px;height:16px;flex:0 0 16px;margin:0;accent-color:var(--pink)}
.picklist .who{flex:1;min-width:0;font-weight:600;color:var(--ink)}
.picklist .where{flex:none;font-size:11.5px;color:var(--text-muted)}
.picklist .none{padding:12px;font-size:12.5px;color:var(--text-muted)}
.hr{height:1px;background:var(--border);margin:20px 0}
.flexrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.k-v{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #F1EFEB;font-size:13px}
.k-v:last-child{border-bottom:none}
.k-v .k{color:var(--text-secondary)} .k-v .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.stack{display:flex;flex-direction:column;gap:14px}
.attn{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid #F1EFEB;align-items:flex-start}
.attn:last-child{border-bottom:none}
.attn .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 32px}
.attn .ic svg{width:16px;height:16px;stroke-width:2.2;fill:none}
.attn .t{font-size:13px;font-weight:700}
.attn .s{font-size:12px;color:var(--text-secondary);margin-top:2px}
.attn .go{margin-left:auto;flex:0 0 auto}
.page{display:none}
.page.on{display:block}
/* ---- press transitions ----
   Declared here, after every base rule, because .btn and friends set their own
   `transition` shorthand and a shorthand replaces the whole property: declared earlier,
   the transform half of this would simply be dropped and the press would snap.
   .1s ease-out — a press has to feel instant. Anything slower reads as lag, which is
   the exact thing the pressed state exists to disprove. */
.btn,.gbtn,.qa,.acct,.rcard,.rthumb,.seg button,.m-h .x,.burger,.drop,.nav a,.signout{
  transition:transform .1s ease-out,background .16s,color .16s,border-color .16s,box-shadow .16s;
}
/* Kept off the transform-scaled elements' own will-change: these are momentary and
   promoting a dozen layers permanently costs more than the animation saves. */

@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g-21,.g-12,.g2{grid-template-columns:1fr}
}

/* ---- the icon rail, at the width it is actually for ----
   This is the collapsed sidebar that used to run from 860px down. On a 390px phone it
   was indefensible: 70px of a 390px screen, spent permanently, in exchange for fourteen
   destinations reduced to fourteen unlabelled glyphs with the counts hidden because
   they did not fit. It became a drawer for that reason.

   But the rail was never the wrong idea, only the wrong width. Between 861 and 1180 a
   250px sidebar is 28% of a 900px window — the widest thing on screen after the content
   itself, spent on navigation nobody is reading while they work. Here the rail gives
   180px back to the page and the destination is still one click away, which is the
   trade it was always meant to be.

   Below 861 the drawer rules take over: they come later in the file and win.

   ── TWO WAYS IN, AND WHY THE RULES ARE WRITTEN TWICE ──────────────────────
   The rail is now also a choice: `.app.rail` is somebody pressing the control in the
   sidebar head, at any width. The declarations below therefore exist in two blocks — once
   keyed on that class, once inside the width query — and they must stay identical.

   Not shared, because they cannot be: a media query is a context, not a selector, so no
   selector list can say "either the class is set or the window is this wide". The
   alternative was JavaScript adding the class from a resize listener, which makes the
   layout depend on script running and on it running before first paint. Duplicated CSS is
   the cheaper mistake.

   The width query fires unless `.app.wide` says otherwise, which is the other half of the
   control: somebody at 1000px who wants the labels back gets them. With no preference
   stored neither class is present and both behave exactly as they did before. */
/* Inside a min-width query, not bare, and that is load-bearing. Below 861 the sidebar is a
   drawer: it takes no width when shut, so there is nothing for a rail to reclaim. Left
   unscoped, every one of these rules would outrank the drawer's own by specificity — `.app.rail
   .nav a` beats `.nav a` whatever the order — and a phone belonging to somebody who once
   collapsed their sidebar on a laptop would open a drawer full of unlabelled glyphs with
   desktop padding. Scoping the block is one line; undoing it rule by rule was eight. */
@media (min-width:861px){
  .app.rail{--side:70px}
  .app.rail .side-head .txt,.app.rail .nav a span.lb,.app.rail .who .txt,
  .app.rail .side-foot .env,.app.rail .nav-lbl,.app.rail .signout span.lb{display:none}
  .app.rail .nav a{justify-content:center;position:relative}
  /* A sub-page's indent is what places it under its parent when labels show; with no labels it
     only pushes the icon off the column, so the rail centres it like every other. */
  .app.rail .nav a.sn-d1{padding-left:10px}
  .app.rail .signout{justify-content:center}
  .app.rail .nav a .pill{
    position:absolute;top:6px;right:12px;min-width:8px;width:8px;height:8px;padding:0;
    border-radius:50%;font-size:0;line-height:0;overflow:hidden;
  }
  .app.rail .nav a .pill:not(.alert){display:none}
  .app.rail .side{overflow-y:auto}
  /* 70px cannot hold the mark and the control side by side, so they stack and centre. */
  .app.rail .side-head{flex-direction:column;gap:10px;padding:18px 8px 14px}
  .app.rail .side-rail{margin-left:0}
  .app.rail .wrap{padding:24px 24px 60px}
  .app.rail .top{padding:18px 24px 16px}
}

@media (min-width:861px) and (max-width:1180px){
  .app:not(.wide){--side:70px}
  /* The sign-out and back-to-site links use the same .lb class as the nav, so without
     this their text wraps onto two lines and is clipped by the rail. */
  .app:not(.wide) .side-head .txt,.app:not(.wide) .nav a span.lb,.app:not(.wide) .who .txt,
  .app:not(.wide) .side-foot .env,.app:not(.wide) .nav-lbl,
  .app:not(.wide) .signout span.lb{display:none}
  .app:not(.wide) .nav a{justify-content:center;position:relative}
  .app:not(.wide) .nav a.sn-d1{padding-left:10px}
  .app:not(.wide) .signout{justify-content:center}
  /* The counts are the one thing worth keeping when the labels go — "four claims
     waiting" is the reason to look at the nav at all. A dot rather than a number:
     70px has no room for a pill, but it has room to say *something* is there. */
  .app:not(.wide) .nav a .pill{
    position:absolute;top:6px;right:12px;min-width:8px;width:8px;height:8px;padding:0;
    border-radius:50%;font-size:0;line-height:0;overflow:hidden;
  }
  /* A zero count is not news. */
  .app:not(.wide) .nav a .pill:not(.alert){display:none}
  /* The rail can never clip its own footer: if the icons plus the avatar exceed the
     height available it scrolls internally rather than hiding the sign-out. */
  .app:not(.wide) .side{overflow-y:auto}
  .app:not(.wide) .side-head{flex-direction:column;gap:10px;padding:18px 8px 14px}
  .app:not(.wide) .side-rail{margin-left:0}
  /* Reclaimed width is only useful if the content spreads into it. */
  .app:not(.wide) .wrap{padding:24px 24px 60px}
  .app:not(.wide) .top{padding:18px 24px 16px}
}
/* The burger. Hidden on desktop, where the sidebar is permanently visible and needs no
   opener — so this rule is the only thing that has to change to keep desktop identical. */
.burger{display:none}

@media (max-width:860px){
  /* ---- the sidebar becomes a drawer ----
     It used to collapse to a 70px icon rail. That cost 18% of a 390px screen permanently
     and gave back unlabelled icons: fourteen destinations reduced to fourteen glyphs, with
     the pill counts hidden because they did not fit. The drawer takes no width at all when
     shut, so the content column goes from 284px to 354px — a quarter more room on every
     page — and when open it is the full navigation with its labels and counts back.

     --side stays at its desktop value here on purpose: the drawer wants a real width when
     it is open, and nothing else may reserve space for it. .app is a flex row, so the
     sidebar is taken out of the flow instead. */
  .side{
    position:fixed;top:0;left:0;z-index:120;
    width:min(82vw,320px);flex-basis:auto;height:100vh;height:100dvh;
    transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.9,.3,1);
    box-shadow:none;overflow-y:auto;
  }
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}
  /* While a finger is on it the drawer is not animating — it is being positioned, frame
     by frame, by the gesture. A transition here would fight the drag and add lag to
     something that must track 1:1. The spring in 07-interactions.js takes over at
     release, starting from wherever the drag left it. */
  .side.dragging{transition:none;will-change:transform}
  /* Vertical panning stays the browser's — the drawer scrolls when the nav is taller
     than the screen. Horizontal is ours, so the browser must not claim it and cancel
     the drag halfway through. */
  .side{touch-action:pan-y}
  .nav-scrim{will-change:opacity}
  /* A tap outside is the gesture people try first, so the scrim is the primary close. */
  .nav-scrim{position:fixed;inset:0;z-index:110;background:rgba(17,17,17,.5);
    backdrop-filter:blur(2px);animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* No collapse control in the drawer. The sidebar takes no width when shut here, so there is
     nothing to reclaim — and a button that shrank a full-width drawer to a strip of unlabelled
     glyphs on a phone is the thing the drawer replaced. The rail rules themselves do not reach
     this width at all; see the min-width query they live in. */
  .side-rail{display:none}

  .burger{
    display:grid;place-items:center;flex:0 0 46px;width:46px;height:46px;
    border-radius:12px;border:1px solid var(--border);background:#fff;margin-right:12px;
  }
  .burger svg{width:22px;height:22px;stroke-width:2.1;stroke:var(--ink);fill:none}
  .burger:active{background:var(--pink-tint);border-color:var(--pink)}
  /* The header is a flex row of [burger][titles][actions]; the titles have to be able to
     shrink or the burger pushes them out of the viewport. */
  .top{flex-wrap:wrap;align-items:flex-start}
  .top>div:not(.top-actions){min-width:0;flex:1}

  /* Inside the drawer there is room for the real thing again — labels, group headings and
     the pill counts that the rail had to drop. */
  .nav a{justify-content:flex-start;min-height:48px}
  .nav a .pill{display:inline-flex}
  /* Bigger rows: this is a thumb target now, not a mouse target. */
  .nav a{padding-top:11px;padding-bottom:11px}
  .side-foot{padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px))}
  /* Safari's floating address bar sits over the bottom of the page, so 50px of
     tail was not enough to scroll the last row clear of it. env() resolves to 0
     without viewport-fit=cover, so the calc degrades to the flat 96px rather than
     breaking. */
  .top{padding:16px 18px}
  .wrap{padding:18px 18px 96px;padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px))}
  .top h1{font-size:29px}
  /* While the drawer is open the page behind it must not scroll: dragging in the drawer
     otherwise scrolls the page underneath and the menu appears to slide away. */
  body.nav-open{overflow:hidden}
  /* The action buttons wrapped one per line and ate the top of every screen.
     Letting them share the line puts two side by side and keeps the fold useful. */
  .top-actions{margin-left:0;width:100%;flex-wrap:wrap;gap:8px}
  .top-actions>.btn{flex:1 1 auto;justify-content:center}
  /* An inline text link is still a tap target. "set one in Settings" sits inside an 11.5px
     caption, which made it a 14px-tall thing to hit with a thumb — and it is on screen for
     every category with no budget, which is most of them until they are filled in. The
     negative margin cancels the padding's effect on the line so the sentence reads the same.
     It never rendered against the old fixtures, because both had budgets.

     Scoped to .wrap. Unscoped, `a[data-go]` also matched every link in the sidebar, and it
     has the same specificity as `.nav a{display:flex}` while coming later in the file — so
     it won, and the nav rows lost their flex layout on mobile. The icon rail hid that
     (centred glyphs, no labels, no pills); the drawer would not have. */
  .wrap a[data-go]{display:inline-block;padding:13px 4px;margin:-13px 0}
  /* Five periods do not fit a phone at the desktop padding. At 320px the rail leaves
     250px and the segment alone wanted 260, which pushed the whole page sideways.
     Give it its own full-width line and let the buttons share it. */
  .top-actions>.seg{flex:1 1 100%;justify-content:space-between}
  .seg button{padding:6px 8px}
  /* The sort control is compact on a desktop because it only orders one table. On a touch
     screen that compactness is a 27px target, which the suite's own guard refuses — so it
     grows to the 40px minimum here rather than being small everywhere. */
  .seg-sm button{min-height:40px;padding:6px 12px;font-size:12.5px}
  .toasts{left:14px;right:14px}
  .g4{grid-template-columns:1fr} .fgrid{grid-template-columns:1fr}

  /* ---- density: fit more than one fact per screen ----
     The page subtitle carried max-width:min(520px,42vw). 42vw is 164px on a 390px phone, so
     a two-line sentence became six lines of very narrow text and pushed everything below the
     fold. The cap exists to stop the line running the width of a desktop monitor, which is
     not a problem that exists here. */
  .top .sub{max-width:none;font-size:13.5px}
  /* And clamped, because the longest of these is four lines even at full width and the
     first screen is better spent on the numbers. */
  .top .sub{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  /* A tile was 20px of padding around a 40px numeral, so barely two fitted on a screen and
     scanning four meant scrolling. Tightened, and the numeral comes down with it — 33px of
     a condensed face is still the largest thing on the page. */
  .tile{padding:15px 16px 13px}
  .tile .val{font-size:33px;margin-top:9px}
  .tile .val .cur{font-size:19px}
  .tile .foot{margin-top:7px}
  .grid{gap:10px}

  /* ---- the page must not scroll sideways ----
     A section header is a flex row: numeral, heading, then a .right group holding
     the search box and the filters. It never wrapped, and .right could not shrink
     (min-width on a flex item defaults to auto, meaning "never smaller than my
     content"), so on a phone that group pushed straight through the viewport and
     took the whole page with it — the finance page reached 612px inside 390px.
     Letting the header wrap puts the controls on their own full-width line under
     the heading, which is where they belong on a narrow screen anyway. */
  .sec-h{flex-wrap:wrap}
  .sec-h .right,.card-h .right{margin-left:0;width:100%;min-width:0;flex-wrap:wrap}
  /* .search input carries min-width:230px for the desktop layout. At 390px the
     content column is only 284px, so that floor plus a button overflowed. On a
     phone the search box simply takes the line. */
  .search{flex:1 1 100%;min-width:0}
  .search input{min-width:0;width:100%}
  .filters{width:100%}
  .filters>*{min-width:0;max-width:100%}

  /* ---- touch targets ----
     44px is the accessibility guideline; the small button variants were 29-34px,
     which is a miss-prone tap next to a delete action. Grown on mobile only. */
  .btn{min-height:44px}
  .btn-s{min-height:40px}
  .ibtn{width:40px;height:40px}

  /* ---- legibility ----
     Table headers at 10.5px and status tags at 10px are a squint held at arm's
     length. Nudged up; still clearly secondary to the body copy. */
  table.tbl th{font-size:11.5px}
  .badge,.tag,.chip{font-size:11.5px}
  /* .av is left at 10.5px on purpose: two initials inside a 26px disc are a
     graphic, not reading text, and a larger face would overflow the circle. */

  /* ---- dense tables ----
     A dense financial table stays a horizontally scrolling table rather than being
     restacked — the columns are the point. Momentum scrolling makes that feel native
     rather than stuck, and the wrapper is already overflow-x:auto.

     What was missing is a floor. The table had no min-width, so instead of overflowing the
     wrapper and scrolling, it squeezed itself into 354px: every cell wrapped, a description
     became five lines, "Naazim Nagdee,Jonty Wright" became four, and a ledger row was 120px
     tall. Nine rows filled the screen. Given a floor it overflows and scrolls, which is what
     the wrapper was always for, and each row is one line per fact again. */
  table.tbl{min-width:680px}
  /* The register and the portfolio carry more columns than the ledger. The portfolio needs
     the most: its first cell holds a name, a description and up to four warning badges, and
     at 820px those badges wrapped one per line and made the row 170px tall. */
  #asTbl,#s18aTbl{min-width:820px}
  #prTbl{min-width:940px}
  /* Keep each badge whole. Wrapping "restricted overspent" mid-phrase costs a line and
     reads as two separate warnings. */
  #prTbl .badge{white-space:nowrap}
  /* A width floor on the table is not enough on its own: `table-layout:auto` shares the
     surplus out by content, and it gave this cell — a name, a description and up to four
     badges — 163px of a 951px table, so the description alone ran to five lines and the row
     stood 170px tall. The first column needs its own floor. */
  #prTbl td:first-child,#prTbl th:first-child{min-width:250px}
  .tbl-wrap{-webkit-overflow-scrolling:touch}
  /* A right-aligned column is a number, and a number that wraps is unreadable. */
  table.tbl td.r,table.tbl th.r{white-space:nowrap}

  /* Sideways scroll is invisible until you try it, so the wrapper gets a soft edge that
     says there is more. It sits inside the wrapper's own background, so it fades as you
     reach the end rather than hanging there permanently. */
  .tbl-wrap{
    background:
      linear-gradient(to right, transparent calc(100% - 26px), rgba(17,17,17,.06) 100%);
    background-attachment:local;
  }

  /* ---- modals become sheets ----
     A modal was a 640px card floating in a 44px/20px inset, which on a phone left it
     narrower than the screen with wasted margin either side and its footer note colliding
     with the buttons. Full width, anchored to the bottom of the viewport, and tall enough
     to be worth the trip. */
  .scrim{padding:0;align-items:flex-end}
  .modal,.modal.wide{max-width:none;border-radius:20px 20px 0 0;max-height:94dvh;
    display:flex;flex-direction:column}
  /* A sheet comes up from the bottom edge and goes back down to it, so it does not grow
     from the button that opened it — the edge is where it lives and that is the spatial
     relationship worth reinforcing. The origin openModal() computes is overridden rather
     than skipped, so one code path serves both and neither has to know about the other. */
  .modal,.modal.wide{transform-origin:50% 100% !important;animation:sheetUp .26s cubic-bezier(.2,.9,.3,1)}
  @keyframes sheetUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  .m-h{padding:18px 18px 16px}
  .m-h h3{font-size:24px}
  .m-b{padding:18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  /* The footer is the thing you came to press, so it stays put while the body scrolls and
     the buttons are full width rather than crowded into a corner. The "writes to
     transactions" note is developer context and is the first thing to go. */
  .m-f{padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    flex-wrap:wrap;gap:8px}
  .m-f>.btn{flex:1 1 44%;justify-content:center}
  .m-f>.dim,.m-f>.note{display:none}
}
/* ============ USER PREFERENCES ============
   Three independent signals, each answering a different need. They sit last so they
   win over everything above without needing !important on every rule. */

/* Reduced motion is not "no feedback" — it is feedback that does not move you. The
   vestibular problem is travel and scale, not change: an element appearing is fine,
   an element flying in from the edge is not. So transforms and slides go, opacity
   stays, and every duration comes down rather than to zero, because an instant cut
   loses the causal link between pressing a thing and the thing happening. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.12s !important;
    scroll-behavior:auto !important;
  }
  /* The press keeps its colour change and loses its scale. */
  .btn:active,.gbtn:active,.qa:active,.acct:active,.rcard:active,.rthumb:active,
  .seg button:active,.m-h .x:active,.burger:active,.ibtn:active{transform:none}
  /* Modals and toasts cross-fade in place instead of rising. */
  .modal{animation:fadeIn .18s ease}
  .toast{animation:fadeIn .18s ease}
  /* The drawer is the one thing that must still travel — it comes from off-screen and
     there is nowhere else for it to be — but it arrives without the spring and without
     the gesture's momentum. */
  .side{transition-duration:.14s !important;transition-timing-function:linear !important}
  /* The sparkline sweep and the progress bars are decorative motion on data that is
     already legible as a number. */
  .pbar span{transition:none}
}

/* Frosted glass over moving content is exactly what this asks to be spared. Raise the
   surfaces to near-solid and drop the blur; the layering still reads through the
   shadow and the border. */
@media (prefers-reduced-transparency: reduce){
  .top{background:var(--cream);backdrop-filter:none}
  .scrim{background:rgba(17,17,17,.72);backdrop-filter:none}
  .nav-scrim{background:rgba(17,17,17,.72);backdrop-filter:none}
}

/* More contrast means defined edges rather than tonal ones: a border that exists,
   secondary text that is no longer grey, and a focus ring that cannot be missed. */
@media (prefers-contrast: more){
  :root{--border:#8A8580;--text-secondary:#2E2A26;--text-muted:#4A4540}
  .card,.tile,.modal{border:1px solid var(--border)}
  :focus-visible{outline-width:3px}
  .badge,.chip,.tag{border:1px solid currentColor}
}

@media print{.side,.top-actions{display:none}}

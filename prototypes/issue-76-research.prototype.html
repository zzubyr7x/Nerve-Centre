<!--
  PROTOTYPE, throwaway. Ticket: "Prototype: the Research board and a Study"
  (zzubyr7x/Nerve-Centre#76). Question: what do the Research board and a Study look like, a
  Study's page (question, methodology, ethics, log, documents, team), and opening a Study?

  Host: Research's hub as #60 settled it (take A, the Doorway) — the front page, the door, and
  "Inside Research" with its own chrome. Only what is behind the door varies.

  Three takes, switchable with ?variant=A|B|C (or the arrows / ← → keys), crossed with a seat
  switcher (?seat=vol|lead|member|head|exco):
    A  Board & drawer     — the Board is the page; a Study opens in a drawer over it; opening one is a short modal
    B  Register & page    — Studies listed by stage; a Study is a full page of its own; opening one is a full form
    C  Pipeline & dossier — the stages are a strip of filters over a list; the Study sits beside it as a tabbed dossier
  ?inside=1 starts behind the door. Everything lives in memory, shared across seats, so an act in
  one seat shows in another. Reload resets it. Open questions are amber.
-->

/* ==========================================================================
   SAVE7 LOOK — the visual vocabulary every prototype on the Nerve Centre map
   shares. Taken from the KEPSA presentation ("KEPSA Slides - SANS"), which the
   user gave on 2026-10-07 as the design direction for the OS and all prototypes.

   Colours were sampled from the rendered PDF, not guessed. Typeface is
   Montserrat (embedded in the deck: Regular, Medium, SemiBold, Bold, italics).

   Use it: paste this file into a prototype's <style> block and put
   class="save7-look" on <body>. A prototype is inlined rather than linked so it
   opens by double-click and survives being emailed; this file is the one source
   the copies are taken from.

   TWO EXTENSIONS beyond what the deck shows, both for small text:
   --teal-ink and --pink-ink are darker twins of the brand teal and pink. The
   brand values are fine for titles, fills and shapes (as the deck uses them) but
   fall below readable contrast as small body text on white.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap');

:root {
  /* brand */
  --navy: #0C173B;
  --teal: #00B7B5;
  --pink: #ED186B;
  --amber: #FFC550;          /* connectors, pins, third-in-sequence — never a main colour */
  --ink: #585858;            /* body text */

  /* tints (card borders, fills, blobs) */
  --teal-border: #E6F7F7;
  --teal-fill: #F4FBFB;
  --mint: #F3FBFB;
  --pink-border: #FCE8F0;
  --pink-fill: #FFF5F7;
  --pink-head: #FCDCE8;
  --amber-fill: #FFF6DD;     /* derived from the amber, for flag callouts */

  /* small-text twins (extension — see header) */
  --teal-ink: #007F7D;
  --pink-ink: #C70F58;
  --amber-ink: #8A5B00;

  --radius: 20px;
  --radius-sm: 12px;
  --font: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }

.save7-look {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink);
  background: #fff;
}

/* ---- the two backdrop blobs: pale mint top-right, pale pink bottom-left ---- */
.save7-look::before,
.save7-look::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  z-index: -1;
  pointer-events: none;
}
.save7-look::before { top: -22vw; right: -16vw; width: 52vw; height: 52vw; background: var(--mint); }
.save7-look::after  { bottom: -20vw; left: -12vw; width: 38vw; height: 38vw; background: var(--pink-fill); }

/* ---- the two-circle motif: big teal, smaller pink, overlapping ---- */
.circles { position: relative; width: 104px; height: 96px; flex: none; }
.circles::before,
.circles::after { content: ''; position: absolute; border-radius: 50%; }
.circles::before { top: 0; right: 0; width: 72px; height: 72px; background: var(--teal); }
.circles::after  { bottom: 0; left: 6px; width: 44px; height: 44px; background: var(--pink); }

/* ---- type ---- */
.eyebrow { margin: 0 0 4px; font-weight: 600; font-size: 13px; color: var(--pink-ink); }
.eyebrow.teal { color: var(--teal-ink); }
.title { margin: 0; font-weight: 700; color: var(--navy); line-height: 1.15; letter-spacing: -0.01em; }
.title .dot { color: var(--pink); }
.title .accent { color: var(--teal); }
h1.title { font-size: 40px; }
h2.title { font-size: 26px; }
h3.title { font-size: 18px; }
.lede { color: var(--ink); font-size: 15px; max-width: 70ch; }
.strong { font-weight: 700; color: var(--navy); }
.muted { color: #8a8a8a; }
.mono { font-variant-numeric: tabular-nums; }

/* ---- cards: white, large radius, hairline tinted border; alternate teal/pink ---- */
.card {
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius);
  padding: 20px 22px;
}
.card.pink { border-color: var(--pink-border); }
.card.tint-teal { background: var(--teal-fill); }
.card.tint-pink { background: var(--pink-fill); }
.card-label { margin: 0 0 10px; font-weight: 700; font-size: 15px; color: var(--navy); }

/* ---- number pills ("01", "BARRIER 01") ---- */
.num {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--teal);
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.num.pink { background: var(--pink); }
.num.amber { background: var(--amber); color: var(--navy); }

/* ---- buttons: outlined teal pill; pink for the primary ---- */
.btn {
  font: 600 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal);
  border-radius: 999px;
  padding: 8px 16px;
  cursor: pointer;
  transition: background 0.12s;
}
.btn:hover { background: var(--teal-fill); }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 700; }
.btn.primary:hover { background: #d4125d; }
.btn.quiet { border-color: transparent; color: var(--ink); }
.btn.quiet:hover { background: var(--teal-fill); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* ---- status chips: small, pale ---- */
.chip {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--teal-border);
  color: var(--teal-ink);
  white-space: nowrap;
}
.chip.pink { background: var(--pink-border); color: var(--pink-ink); }
.chip.amber { background: #FFEFC2; color: var(--amber-ink); }
.chip.grey { background: #F1F1F3; color: #666; }

/* ---- tabs: pill row, active in pink ---- */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  font: 600 13px var(--font);
  color: var(--ink);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
}
.tab:hover { background: var(--teal-fill); }
.tab[aria-selected="true"] { background: var(--pink-fill); border-color: var(--pink); color: var(--pink-ink); }

/* ---- form controls ---- */
input[type="text"], select {
  font: 500 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
}
input[type="text"]::placeholder { color: #a5a5a5; }

/* ---- labelled field rows ---- */
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
.fields dt { font-weight: 600; font-size: 12px; color: #8a8a8a; align-self: center; }
.fields dd { margin: 0; color: var(--navy); font-weight: 600; }

/* ---- timeline bar: alternating teal and pink segments, amber pin on the current one ---- */
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
.bar > i { flex: 1; background: var(--teal); }
.bar > i:nth-child(even) { background: var(--pink); }
.bar > i.todo { opacity: 0.22; }

/* ---- callout: amber, for open questions the user should react to ---- */
.flag {
  background: var(--amber-fill);
  border: 1.5px solid #FFE7A8;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12.5px;
  color: #5a4300;
}
.flag b { color: var(--amber-ink); }

/* ---- logo ---- */
.logo { display: block; height: 22px; width: auto; }


/* ===================== prototype-only layout ===================== */
html, body { height: 100%; }
body.save7-look { background: #fff; }
.proto-banner { position: sticky; top: 0; z-index: 30; background: var(--amber-fill); border-bottom: 1.5px solid #FFE7A8; color: #5a4300; font-size: 12px; padding: 6px 16px; text-align: center; }
.proto-banner b { color: var(--amber-ink); }

/* ---- the Shell: KEPSA-portal white sidebar, pink-tinted active item ---- */
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 31px); }
.side { background: #fff; border-right: 1.5px solid var(--teal-border); padding: 18px 12px 120px; position: sticky; top: 31px; height: calc(100vh - 31px); overflow-y: auto; }
.side .logo { height: 24px; margin: 4px 10px 18px; }
.nav { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.nav li a { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-weight: 500; }
.nav li a:hover { background: var(--teal-fill); }
.nav li a.active { background: var(--pink-fill); color: var(--pink-ink); font-weight: 700; }
.nav li a.dash { font-weight: 700; color: var(--navy); }
.nav .grp > a { font-weight: 700; color: var(--navy); }
.nav .chev { margin-left: auto; width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 6px; color: #9a9a9a; font-size: 11px; transition: transform .18s; }
.nav .chev:hover { background: var(--teal-border); color: var(--navy); }
.nav .closed > a .chev { transform: rotate(-90deg); }
.nav ul { list-style: none; margin: 0; padding: 0 0 0 12px; }
.nav .closed > ul { display: none; }
.nav .roomlab { margin: 6px 10px 2px 22px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #a5a5a5; }
.nav .rooms a { font-size: 12.5px; padding: 5px 10px 5px 22px; }
.nav .unfold > li { animation: drop .28s both; animation-delay: calc(var(--i) * 45ms); }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.mk { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex: none; }
.mk.in { background: #c9c9c9; }
.mk.ask { background: var(--amber); }
.mk-head { font-size: 9.5px; font-weight: 700; color: var(--pink-ink); background: var(--pink-border); padding: 1px 6px; border-radius: 999px; }
.uc-dot { font-size: 9.5px; color: #9a9a9a; font-weight: 600; }

.main { padding: 22px 28px 140px; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.crumb { font-size: 12px; color: #8a8a8a; }
.crumb b { color: var(--navy); }
.crumb a { color: #8a8a8a; text-decoration: none; }
.crumb a:hover { color: var(--navy); text-decoration: underline; }
.me { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.me .who { text-align: right; line-height: 1.25; }
.me .who b { color: var(--navy); display: block; }

/* ---- shared bits ---- */
.av { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; font-size: 11px; color: #fff; background: var(--teal); flex: none; }

.av.sm { width: 22px; height: 22px; font-size: 9px; }
.av.gone { background: #d0d0d0; }
.avs { display: inline-flex; }
.avs .av { border: 2px solid #fff; margin-left: -6px; }
.avs .av:first-child { margin-left: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.sm { font-size: 12px; }
.xs { font-size: 11px; }
.note { font-size: 12px; color: #8a8a8a; }
.btn.sm { padding: 5px 12px; font-size: 12px; }
.btn.ok { border-color: var(--teal); background: var(--teal); color: #fff; }
.btn.ok:hover { background: #00a3a1; }
.btn.red { border-color: #F3C3BE; color: #B42318; }
.chip.red { background: #FEE4E2; color: #B42318; }
.chip.navy { background: var(--navy); color: #fff; }
.stack { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.hr { height: 1.5px; background: var(--teal-border); margin: 14px 0; border: 0; }
textarea, input[type="date"], input[type="number"] { font: 500 13px var(--font); color: var(--navy); background: #fff; border: 1.5px solid var(--teal-border); border-radius: var(--radius-sm); padding: 8px 12px; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
input[type="number"] { width: 80px; }
label.f { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: #8a8a8a; }
label.f input[type=text], label.f select, label.f input[type=date] { width: 100%; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--navy); }
.checks label { display: inline-flex; gap: 5px; align-items: center; }
.empty { border: 1.5px dashed var(--teal-border); border-radius: var(--radius-sm); padding: 18px; text-align: center; color: #8a8a8a; font-size: 12.5px; }
.flag { margin: 10px 0; }
.list { display: grid; gap: 8px; }
.li { border: 1.5px solid var(--teal-border); border-radius: var(--radius-sm); padding: 10px 14px; background: #fff; }
.li.pink { border-color: var(--pink-border); }
.li.red { border-color: #F3C3BE; background: #FFFBFA; }
.kv { font-size: 12px; color: #8a8a8a; }
.kv b { color: var(--navy); font-weight: 600; }
.objs { display: flex; flex-wrap: wrap; gap: 6px; }
.obj { font-size: 12px; font-weight: 600; color: var(--navy); background: var(--teal-fill); border: 1.5px solid var(--teal-border); border-radius: 999px; padding: 3px 11px; }
.link { color: var(--teal-ink); font-weight: 600; text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; font: 600 12px var(--font); }
.link:hover { text-decoration: underline; }
.standing { display: inline-flex; align-items: center; gap: 6px; }
.join { display: grid; gap: 8px; }
.join .why { font-size: 12px; color: #8a8a8a; }
.lock { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; }

/* ---- offerings ---- */
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 54px; text-align: center; font-size: 10px; color: #8a8a8a; }
.sw i { display: block; height: 38px; border-radius: 10px; margin-bottom: 3px; }
.lib { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

.lib div span { position: absolute; left: 6px; bottom: 5px; font-size: 9.5px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.cov { display: grid; grid-template-columns: 64px 1fr auto; gap: 4px 12px; font-size: 12.5px; align-items: baseline; }

.steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11.5px; }

.steps span:nth-child(even) { background: var(--pink-fill); color: var(--pink-ink); }

/* ---- the Board ---- */
.board { display: grid; grid-template-columns: repeat(4, minmax(190px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--teal-fill); border-radius: 16px; padding: 10px; min-height: 160px; }
.col:nth-child(even) { background: var(--pink-fill); }
.col h4 { margin: 2px 4px 10px; font-size: 12px; color: var(--navy); display: flex; justify-content: space-between; }
.col h4 span { color: #8a8a8a; font-weight: 600; }
.kcard { background: #fff; border: 1.5px solid var(--teal-border); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; display: grid; gap: 6px; transition: box-shadow .12s, transform .12s; }
.kcard:hover { box-shadow: 0 4px 14px rgba(12,23,59,.08); transform: translateY(-1px); }
.kcard.over { border-color: #F3C3BE; box-shadow: inset 3px 0 0 #D92D20; }

.dates { font-size: 11px; color: #8a8a8a; }
.dates b { color: var(--navy); }
.dates .slip { color: var(--pink-ink); font-weight: 700; }
.dates s { color: #b0b0b0; }
.blocked { font-size: 11px; background: #F1F1F3; color: #555; border-radius: 8px; padding: 3px 8px; }
.red { color: #D92D20; }

/* ---- calendar ---- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.cal .d { min-height: 82px; border: 1.5px solid var(--teal-border); border-radius: 10px; padding: 4px 5px; font-size: 11px; background: #fff; display: grid; align-content: start; gap: 3px; }

.ev.pub { background: #F1F1F3; color: #777; text-decoration: line-through; }
.ev.over { background: #FEE4E2; color: #B42318; }
.ev.ghost { background: transparent; border: 1.5px dashed var(--amber); color: var(--amber-ink); cursor: default; }

/* ---- tracker ---- */
.kpi { display: grid; grid-template-columns: 1fr 200px 110px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1.5px solid var(--teal-border); font-size: 13px; }

/* ---- drawer & modal ---- */
.scrim { position: fixed; inset: 0; background: rgba(12,23,59,.28); z-index: 60; display: flex; justify-content: flex-end; }
.drawer { width: min(520px, 100%); height: 100%; background: #fff; overflow-y: auto; padding: 22px 24px 120px; box-shadow: -12px 0 40px rgba(12,23,59,.15); }

/* ===================== take A: Doorway ===================== */
.A-hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: stretch; margin-bottom: 18px; }
.A-front { position: relative; padding: 26px 28px; border-radius: 28px; background: linear-gradient(135deg, var(--mint), #fff 65%); border: 1.5px solid var(--teal-border); overflow: hidden; }

.A-door.shut h3 { color: var(--navy); }

.A-enter { font: 700 15px var(--font); background: var(--pink); color: #fff; border: 0; border-radius: 999px; padding: 13px 22px; cursor: pointer; display: inline-flex; gap: 10px; align-items: center; justify-self: start; position: relative; z-index: 1; }
.A-enter:hover { background: #d4125d; }
.A-enter .arr { transition: transform .15s; }

// =====================================================================
// state, helpers
// =====================================================================
let DB = seed();
const params = new URLSearchParams(location.search);
let UI = {
  variant: VARIANTS[params.get('variant')] ? params.get('variant') : 'A',
  seat: SEATS[params.get('seat')] ? params.get('seat') : 'lead',
  inside: params.get('inside') === '1', room: 'studies', justEntered: false,
  study: null, edit: null, opening: false, cols: false, filter: 'all', ctab: 'overview', draft: false, anim: false,
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nm = id => PEOPLE[id] || id;
const initials = id => nm(id).split(' ').map(w => w[0]).slice(0, 2).join('');
const av = (id, cls = '') => `<span class="av sm ${cls} ${DB.members[id] || id === 'sipho' ? '' : 'gone'}" title="${esc(nm(id))}">${esc(initials(id))}</span>`;
const fmt = iso => iso ? new Date(iso + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '—';
const me = () => SEATS[UI.seat].id;
const S = id => DB.studies.find(s => s.id === id);
const col = id => DB.cols.find(c => c.id === id);
const val = id => (document.getElementById(id) || {}).value || '';
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 5200); }

// ---- the model's permissions (CONTEXT.md: Study), not the design ----
const isExco = () => UI.seat === 'exco';
const isHead = () => DB.members[me()] === 'head';
const isBack = () => isHead() || isExco();                                  // backstop over every Study
const isMember = (p = me()) => ['head', 'active'].includes(DB.members[p]);
const canEnter = () => isMember() || isExco();
const canOpen = () => isMember();                                           // any member of Research opens a Study
const onTeam = s => s.team.includes(me());
const canWrite = s => onTeam(s) || isBack();                               // the team writes; Head + Exco as backstop
const leadGone = s => !DB.members[s.lead];
const canGate = s => s.lead === me() && !leadGone(s);                       // the lead is the only gate onto the team
const canDelDoc = (s, d) => d.by === me() || isBack();
const isEnd = s => DB.cols.findIndex(c => c.id === s.col) >= DB.cols.length - 2;
function standing() {
  if (isExco()) return 'reads';
  const m = DB.members[me()]; if (m) return m;
  if (DB.requests.some(r => r.who === me())) return 'pending';
  return 'none';
}

// =====================================================================
// shared Study pieces — content only; each take lays them out its own way
// =====================================================================
const ethChip = s => `<span class="eth ${s.ethics.st}">${ETH[s.ethics.st]}</span>`;
const kindTxt = s => KINDS[s.kind] || s.kind;
const lastLog = s => s.log[0];
function leadLine(s) {
  return leadGone(s) ? `<span class="row" style="gap:6px">${av(s.lead)}<span class="sm"><s>${esc(nm(s.lead))}</s></span><span class="gone-tag">left Research</span></span>`
    : `<span class="row" style="gap:6px">${av(s.lead, 'p')}<span class="sm"><b class="strong">${esc(nm(s.lead))}</b> leads</span></span>`;
}
function whoNote(s) {
  if (onTeam(s)) return s.lead === me() ? 'You lead this Study.' : 'You\'re on this Study\'s team.';
  if (isHead()) return 'You head Research: backstop over this Study.';
  if (isExco()) return 'National Exco: you read it, and are backstop with the Head.';
  return 'You\'re in Research, not on this team: you read it.';
}

function secQuestion(s) {
  if (UI.edit === s.id) return `<div class="sec ed"><h4>Question</h4>
    <label class="f">Title<input type="text" id="e-title" value="${esc(s.title)}"></label>
    <label class="f">The question<textarea id="e-q">${esc(s.question)}</textarea></label>
    <div class="grid2" style="gap:8px">${['P', 'I', 'C', 'O'].map(k => `<label class="f">${{ P: 'Population', I: 'Intervention', C: 'Comparison', O: 'Outcome' }[k]}<input type="text" id="e-${k}" value="${esc(s.pico ? s.pico[k] : '')}" placeholder="PICO — leave blank if it doesn't fit"></label>`).join('')}</div>
    <label class="f">Kind<select id="e-kind">${Object.entries(KINDS).map(([k, v]) => `<option value="${k}" ${s.kind === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>`;
  return `<div class="sec"><h4>Question<span class="grow"></span>${canWrite(s) ? `<button class="link" data-act="edit" data-id="${s.id}">Edit</button>` : ''}</h4>
    <p class="q">${esc(s.question)}</p>
    ${s.pico ? `<div class="pico">${['P', 'I', 'C', 'O'].map(k => `<b>${{ P: 'Population', I: 'Intervention', C: 'Comparison', O: 'Outcome' }[k]}</b><span>${esc(s.pico[k])}</span>`).join('')}</div>` : ''}</div>`;
}
function secMethod(s) {
  if (UI.edit === s.id) return `<div class="sec ed"><h4>Methodology</h4><textarea id="e-method" style="min-height:90px">${esc(s.method)}</textarea>
    <div class="row"><button class="btn primary sm" data-act="save" data-id="${s.id}">Save</button><button class="btn sm" data-act="cancelEdit">Cancel</button></div></div>`;
  return `<div class="sec"><h4>Methodology</h4><p class="prose">${s.method ? esc(s.method) : '<span class="note">Not written yet.</span>'}</p></div>`;
}
function secEthics(s) {
  const letter = s.docs.find(d => d.id === s.ethics.letter);
  return `<div class="sec"><h4>Ethics</h4>
    <div class="row">${ethChip(s)}${s.ethics.ref ? `<span class="sm">${esc(s.ethics.ref)}</span>` : ''}</div>
    ${letter ? `<div class="sm" style="margin-top:6px">Letter: <a class="link" href="#" data-act="doc">${esc(letter.name)}</a></div>` : ''}
    ${canWrite(s) ? `<div class="row" style="margin-top:8px">${Object.keys(ETH).filter(k => k !== s.ethics.st).map(k => `<button class="btn sm" data-act="eth" data-id="${s.id}" data-v="${k}">${k === 'approved' ? 'Approved — attach the letter…' : k === 'pending' ? 'Mark pending' : 'Not needed'}</button>`).join('')}</div>` : ''}
    <p class="note" style="margin:8px 0 0">Recorded, never enforced: no column refuses a Study on its ethics.</p></div>`;
}
function secLog(s) {
  return `<div class="sec"><h4>Log · what was found</h4>
    ${canWrite(s) ? `<div class="stack" style="gap:6px;margin-bottom:12px"><textarea id="log-${s.id}" placeholder="What happened, what you found"></textarea><div><button class="btn primary sm" data-act="log" data-id="${s.id}">Add to the log</button></div></div>` : ''}
    ${s.log.length ? `<div class="log">${s.log.map(e => `<div class="e"><div class="m">${fmt(e.on)} · ${esc(nm(e.by))}</div>${esc(e.text)}</div>`).join('')}</div>` : '<div class="empty">Nothing logged yet.</div>'}</div>`;
}
function secDocs(s) {
  return `<div class="sec"><h4>Documents<span class="grow"></span>${canWrite(s) ? `<button class="link" data-act="addDoc" data-id="${s.id}">+ Add</button>` : ''}</h4>
    ${s.docs.length ? `<div class="docs">${s.docs.map(d => `<div class="doc ${d.pd ? 'pd' : ''}"><span class="ic">${esc(d.name.split('.').pop().toUpperCase())}</span><span><b>${esc(d.name)}</b><span class="xs note">${esc(nm(d.by))} · ${fmt(d.on)}${d.eth ? ' · ethics letter' : ''}${d.pd ? ' · may hold participants\' data' : ''}</span></span>${canDelDoc(s, d) ? `<button class="link" data-act="delDoc" data-id="${s.id}" data-doc="${d.id}">Remove</button>` : ''}</div>`).join('')}</div>` : '<div class="empty">No documents.</div>'}
    <p class="note" style="margin:6px 0 0">A new version is a new upload. Removed by whoever added it, or the Head.</p></div>`;
}
function secTeam(s) {
  const mine = s.jreq.find(r => r.who === me()), inv = s.jinv.find(r => r.who === me());
  const outsiders = Object.keys(DB.members).filter(p => !s.team.includes(p) && !s.jinv.some(r => r.who === p) && !s.jreq.some(r => r.who === p));
  let ctl = '';
  if (canGate(s)) {
    ctl = `${s.jreq.map(r => `<div class="li pink row"><span class="sm grow"><b class="strong">${esc(nm(r.who))}</b> asks to join · ${fmt(r.on)}</span><button class="btn ok sm" data-act="jyes" data-id="${s.id}" data-who="${r.who}">Approve</button><button class="btn sm" data-act="jno" data-id="${s.id}" data-who="${r.who}">Decline</button></div>`).join('')}
      ${s.jinv.map(r => `<div class="li row"><span class="sm grow">Invited <b class="strong">${esc(nm(r.who))}</b> · waits on them</span><button class="link" data-act="jwd" data-id="${s.id}" data-who="${r.who}">Withdraw</button></div>`).join('')}
      ${outsiders.length ? `<div class="row"><select id="inv-${s.id}"><option value="">Invite someone from Research…</option>${outsiders.map(p => `<option value="${p}">${esc(nm(p))}</option>`).join('')}</select><button class="btn sm" data-act="jinv" data-id="${s.id}">Invite</button></div>` : ''}`;
  } else if (inv) {
    ctl = `<div class="li pink row"><span class="sm grow">${esc(nm(s.lead))} invited you onto this Study.</span><button class="btn ok sm" data-act="jacc" data-id="${s.id}">Accept</button><button class="btn sm" data-act="jdec" data-id="${s.id}">Decline</button></div>`;
  } else if (onTeam(s) && s.lead !== me()) {
    ctl = `<button class="link" data-act="jleave" data-id="${s.id}">Leave this team</button>`;
  } else if (isMember() && !onTeam(s)) {
    ctl = mine ? `<div class="row"><span class="chip amber">Request pending</span><button class="link" data-act="jwdme" data-id="${s.id}">Withdraw</button></div>`
      : leadGone(s) ? '<span class="note">No lead to ask until the Head names one.</span>' : `<button class="btn sm" data-act="jask" data-id="${s.id}">Ask to join the team</button>`;
  }
  const newLead = isBack() && s.team.filter(p => DB.members[p] && p !== s.lead).length
    ? `<div class="row" style="margin-top:8px"><select id="nl-${s.id}"><option value="">${leadGone(s) ? 'Name a new lead…' : 'Change the lead…'}</option>${s.team.filter(p => DB.members[p] && p !== s.lead).map(p => `<option value="${p}">${esc(nm(p))}</option>`).join('')}</select><button class="btn sm" data-act="newLead" data-id="${s.id}">Name</button></div>`
    : isBack() && leadGone(s) ? '<p class="note">Nobody left on the team to lead it. Add someone first, or let it stand.</p>' : '';
  return `<div class="sec"><h4>Team</h4><div class="team">${s.team.map(p => `<div class="tm">${av(p, p === s.lead ? 'p' : '')}<b>${esc(nm(p))}</b>${p === s.lead ? '<span class="lead-tag">Lead</span>' : ''}${!DB.members[p] ? '<span class="gone-tag">left Research</span>' : ''}</div>`).join('')}</div>
    ${leadGone(s) ? `<p class="note" style="margin:8px 0 0">The lead left Research. The Study stands and the team still writes it; the Head names a new lead. Nothing goes red.</p>` : ''}
    <div class="stack" style="gap:6px;margin-top:10px">${ctl}</div>${newLead}</div>`;
}
function secDetails(s) {
  return `<div class="sec"><h4>Details</h4><dl class="fields">
    <dt>Kind</dt><dd>${esc(kindTxt(s))}</dd><dt>Stage</dt><dd>${esc(col(s.col).name)}</dd>

function blockedCtl(s) {
  if (s.blocked) return `<div class="row" style="margin-top:8px"><span class="blk">⏸ ${esc(s.blocked)}</span>${canWrite(s) ? `<button class="link" data-act="unblock" data-id="${s.id}">Clear</button>` : ''}</div>`;

function moveCtl(s) {
  if (!canWrite(s)) return '';

function adminCtl(s) {

}

// =====================================================================
// acts
// =====================================================================
function create(title, q, kind, extra = {}) {
  if (!title.trim()) { toast('Give it a title first.'); return null; }
  const s = Object.assign({ id: 's' + (++DB.seq), title: title.trim(), question: q.trim() || '', kind, col: DB.cols[0].id, lead: me(), team: [me()],
    pico: null, method: '', ethics: { st: 'none', ref: '', letter: null }, project: null, blocked: '', log: [], docs: [], jreq: [], jinv: [] }, extra);
  DB.studies.push(s); toast(`“${s.title}” is on the board in ${DB.cols[0].name}, with you as lead.`); return s;
}
function cycle(n) { const ks = Object.keys(VARIANTS); UI.variant = ks[(ks.indexOf(UI.variant) + n + ks.length) % ks.length]; UI.opening = UI.draft = false; UI.edit = null; render(); }

document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.closest('[data-stop]') && (el.dataset.act === 'closeStudy' || el.dataset.act === 'closeModal') && el.classList.contains('scrim')) return;
  if ((el.classList.contains('scrim') || el.classList.contains('modalc')) && e.target !== el) return;
  e.preventDefault();
  const a = el.dataset.act, s = el.dataset.id ? S(el.dataset.id) : null, who = el.dataset.who;
  switch (a) {
    case 'vprev': return cycle(-1);
    case 'vnext': return cycle(1);
    case 'seat': UI.seat = el.dataset.seat; UI.edit = null; UI.opening = UI.draft = UI.cols = false; toast(SEATS[UI.seat].note); break;
    case 'reset': DB = seed(); Object.assign(UI, { study: null, edit: null, opening: false, draft: false, cols: false, filter: 'all' }); toast('Reset.'); break;
    case 'noop': toast('Not part of this prototype.'); return;
    case 'enter': UI.inside = true; UI.justEntered = true; UI.room = 'studies'; window.scrollTo(0, 0); break;
    case 'out': UI.inside = false; UI.study = null; UI.edit = null; break;
    case 'room': UI.room = el.dataset.room; UI.study = UI.variant === 'C' ? UI.study : null; UI.opening = false; break;
    case 'askJoin': DB.requests.push({ who: me(), on: TODAY }); toast('Asked to join Research. It waits on Ruth\'s Dashboard.'); break;
    case 'withdrawJoin': DB.requests = DB.requests.filter(r => r.who !== me()); toast('Request withdrawn.'); break;
    case 'openStudy': UI.study = el.dataset.id; UI.edit = null; UI.anim = true; if (UI.variant === 'B') window.scrollTo(0, 0); break;
    case 'pick': UI.study = el.dataset.id; UI.edit = null; break;
    case 'closeStudy': UI.study = null; UI.edit = null; break;
    case 'closeModal': UI.opening = false; UI.cols = false; break;
    case 'filter': UI.filter = el.dataset.f; UI.study = null; break;
    case 'ctab': UI.ctab = el.dataset.t; UI.edit = null; break;
    case 'edit': UI.edit = s.id; if (UI.variant === 'C') UI.ctab = 'overview'; break;
    case 'cancelEdit': UI.edit = null; break;
    case 'save': { const p = { P: val('e-P'), I: val('e-I'), C: val('e-C'), O: val('e-O') };
      Object.assign(s, { title: val('e-title') || s.title, question: val('e-q'), kind: val('e-kind'), method: val('e-method'), pico: Object.values(p).some(v => v.trim()) ? p : null });
      UI.edit = null; toast('Saved.'); break; }
    case 'eth': {
      const v = el.dataset.v;
      if (v === 'approved') { const ref = prompt('Approval reference (e.g. UJ REC 2026-114):', s.ethics.ref) ; if (ref === null) return; const f = prompt('The letter (file name):', 'Ethics approval letter.pdf'); if (!f) { toast('An approval goes with its letter.'); return; }
        const d = { id: 'd' + (++DB.seq), name: f, by: me(), on: TODAY, eth: true }; s.docs.unshift(d); s.ethics = { st: 'approved', ref, letter: d.id }; }
      else s.ethics = { st: v, ref: v === 'none' ? '' : s.ethics.ref, letter: null };
      toast(ETH[v] + '. Nothing else changes — no column cares.'); break; }
    case 'log': { const t = val('log-' + s.id).trim(); if (!t) { toast('Write what happened first.'); return; } s.log.unshift({ on: TODAY, by: me(), text: t }); toast('Logged.'); break; }
    case 'addDoc': { const f = prompt('File name (pretend upload):', 'Notes.docx'); if (!f) return; s.docs.push({ id: 'd' + (++DB.seq), name: f, by: me(), on: TODAY }); toast('Added. Only Research reads it.'); break; }
    case 'delDoc': { const d = s.docs.find(x => x.id === el.dataset.doc); if (!confirm(`Remove ${d.name}?`)) return; s.docs = s.docs.filter(x => x !== d); if (s.ethics.letter === d.id) s.ethics = { st: 'pending', ref: s.ethics.ref, letter: null }; toast('Removed.'); break; }
    case 'block': { const n = prompt('What is it waiting on? (free text — it names no unit)'); if (!n) return; s.blocked = n; toast('Flagged. It stays in its column.'); break; }
    case 'unblock': s.blocked = ''; break;
    case 'moveTo': s.col = el.dataset.col; toast(`Moved to ${col(s.col).name}.${s.ethics.st === 'pending' && ['k3', 'k4'].includes(s.col) ? ' Ethics is still pending — recorded, not enforced.' : ''}`); break;
    case 'jask': s.jreq.push({ who: me(), on: TODAY }); toast(`Asked. It waits on ${nm(s.lead)}, here on the Study.`); break;
    case 'jwdme': s.jreq = s.jreq.filter(r => r.who !== me()); toast('Withdrawn.'); break;
    case 'jyes': s.jreq = s.jreq.filter(r => r.who !== who); s.team.push(who); toast(`${nm(who)} is on the team and writes the Study now.`); break;
    case 'jno': { const r = prompt('A reason? (optional — they\'ll see it)', ''); if (r === null) return; s.jreq = s.jreq.filter(x => x.who !== who); toast(`Declined ${nm(who)}.`); break; }
    case 'jinv': { const p = val('inv-' + s.id); if (!p) return; s.jinv.push({ who: p, on: TODAY }); toast(`Invited ${nm(p)}. They accept or decline on the Study.`); break; }
    case 'jwd': s.jinv = s.jinv.filter(r => r.who !== who); break;
    case 'jacc': s.jinv = s.jinv.filter(r => r.who !== me()); s.team.push(me()); toast('You\'re on the team.'); break;
    case 'jdec': s.jinv = s.jinv.filter(r => r.who !== me()); toast('Declined.'); break;
    case 'jleave': s.team = s.team.filter(p => p !== me()); toast('You left the team. You still read the Study.'); break;
    case 'newLead': { const p = val('nl-' + s.id); if (!p) return; s.lead = p; toast(`${nm(p)} leads it now.`); break; }
    case 'del': if (!confirm(`Delete “${s.title}”? Its log and documents go with it.`)) return; DB.studies = DB.studies.filter(x => x !== s); UI.study = null; toast('Deleted.'); break;
    case 'newA': UI.opening = true; setTimeout(() => document.getElementById('n-title')?.focus()); break;
    case 'createA': { const n = create(val('n-title'), val('n-q'), val('n-kind')); if (!n) return; UI.opening = false; UI.study = n.id; UI.anim = true; break; }
    case 'newB': UI.opening = true; UI.study = null; window.scrollTo(0, 0); break;
    case 'createB': { const p = { P: val('n-P'), I: val('n-I'), C: val('n-C'), O: val('n-O') };
      if (!val('n-q').trim()) { toast('The question is the one thing a Study needs from the start.'); return; }
      const n = create(val('n-title'), val('n-q'), val('n-kind'), { method: val('n-method'), pico: document.getElementById('n-pico').checked && Object.values(p).some(v => v.trim()) ? p : null,
        ethics: { st: document.querySelector('input[name=n-eth]:checked').value, ref: '', letter: null } }); if (!n) return; UI.opening = false; UI.study = n.id; break; }
    case 'cancelNew': UI.opening = false; UI.draft = false; break;
    case 'newC': UI.draft = true; UI.filter = 'all'; setTimeout(() => document.getElementById('n-title')?.focus()); break;
    case 'createC': { const n = create(val('n-title'), '', val('n-kind')); if (!n) return; UI.draft = false; UI.study = n.id; UI.edit = n.id; UI.ctab = 'overview'; break; }
    case 'cols': UI.cols = true; break;
    case 'colUp': case 'colDn': { readCols(); const i = +el.dataset.i, j = a === 'colUp' ? i - 1 : i + 1; [DB.cols[i], DB.cols[j]] = [DB.cols[j], DB.cols[i]]; break; }
    case 'colDel': readCols(); DB.cols.splice(+el.dataset.i, 1); break;
    case 'colAdd': readCols(); DB.cols.splice(DB.cols.length - 2, 0, { id: 'k' + (++DB.seq), name: 'New column' }); break;
    case 'colSave': readCols(); UI.cols = false; toast('Columns saved. No Study moved.'); break;
  }
  render();
});
function readCols() { document.querySelectorAll('[data-col-name]').forEach(i => { const c = col(i.dataset.colName); if (c && i.value.trim()) c.name = i.value.trim(); }); }
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act-change]'); if (!el) return;
  if (el.dataset.actChange === 'pico') { document.getElementById('pico-f').style.display = el.checked ? 'grid' : 'none'; return; }
  if (el.dataset.actChange === 'move') { const s = S(el.dataset.id); s.col = el.value; toast(`Moved to ${col(s.col).name}.${s.ethics.st === 'pending' ? ' Ethics is still pending — recorded, not enforced.' : ''}`); render(); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); else if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 'Escape') { UI.study = UI.variant === 'C' ? UI.study : null; UI.opening = UI.cols = false; UI.edit = null; render(); }
  else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.act === 'openStudy') e.target.click();
});
render();
</script>
</body>
</html>

/* ==========================================================================
   SAVE7 LOOK — the visual vocabulary every prototype on the Nerve Centre map
   shares. Taken from the KEPSA presentation ("KEPSA Slides - SANS"), which the
   user gave on 2026-10-07 as the design direction for the OS and all prototypes.

   Colours were sampled from the rendered PDF, not guessed. Typeface is
   Montserrat (embedded in the deck: Regular, Medium, SemiBold, Bold, italics).

   Use it: paste this file into a prototype's <style> block and put
   class="save7-look" on <body>. A prototype is inlined rather than linked so it
   opens by double-click and survives being emailed; this file is the one source
   the copies are taken from.

   TWO EXTENSIONS beyond what the deck shows, both for small text:
   --teal-ink and --pink-ink are darker twins of the brand teal and pink. The
   brand values are fine for titles, fills and shapes (as the deck uses them) but
   fall below readable contrast as small body text on white.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap');

:root {
  /* brand */
  --navy: #0C173B;
  --teal: #00B7B5;
  --pink: #ED186B;
  --amber: #FFC550;          /* connectors, pins, third-in-sequence — never a main colour */
  --ink: #585858;            /* body text */

  /* tints (card borders, fills, blobs) */
  --teal-border: #E6F7F7;
  --teal-fill: #F4FBFB;
  --mint: #F3FBFB;
  --pink-border: #FCE8F0;
  --pink-fill: #FFF5F7;
  --pink-head: #FCDCE8;
  --amber-fill: #FFF6DD;     /* derived from the amber, for flag callouts */

  /* small-text twins (extension — see header) */
  --teal-ink: #007F7D;
  --pink-ink: #C70F58;
  --amber-ink: #8A5B00;

  --radius: 20px;
  --radius-sm: 12px;
  --font: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }

.save7-look {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink);
  background: #fff;
}

/* ---- the two backdrop blobs: pale mint top-right, pale pink bottom-left ---- */
.save7-look::before,
.save7-look::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  z-index: -1;
  pointer-events: none;
}
.save7-look::before { top: -22vw; right: -16vw; width: 52vw; height: 52vw; background: var(--mint); }
.save7-look::after  { bottom: -20vw; left: -12vw; width: 38vw; height: 38vw; background: var(--pink-fill); }

/* ---- the two-circle motif: big teal, smaller pink, overlapping ---- */
.circles { position: relative; width: 104px; height: 96px; flex: none; }
.circles::before,
.circles::after { content: ''; position: absolute; border-radius: 50%; }
.circles::before { top: 0; right: 0; width: 72px; height: 72px; background: var(--teal); }
.circles::after  { bottom: 0; left: 6px; width: 44px; height: 44px; background: var(--pink); }

/* ---- type ---- */
.eyebrow { margin: 0 0 4px; font-weight: 600; font-size: 13px; color: var(--pink-ink); }
.eyebrow.teal { color: var(--teal-ink); }
.title { margin: 0; font-weight: 700; color: var(--navy); line-height: 1.15; letter-spacing: -0.01em; }
.title .dot { color: var(--pink); }
.title .accent { color: var(--teal); }
h1.title { font-size: 40px; }
h2.title { font-size: 26px; }
h3.title { font-size: 18px; }
.lede { color: var(--ink); font-size: 15px; max-width: 70ch; }
.strong { font-weight: 700; color: var(--navy); }
.muted { color: #8a8a8a; }
.mono { font-variant-numeric: tabular-nums; }

/* ---- cards: white, large radius, hairline tinted border; alternate teal/pink ---- */
.card {
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius);
  padding: 20px 22px;
}
.card.pink { border-color: var(--pink-border); }
.card.tint-teal { background: var(--teal-fill); }
.card.tint-pink { background: var(--pink-fill); }
.card-label { margin: 0 0 10px; font-weight: 700; font-size: 15px; color: var(--navy); }

/* ---- number pills ("01", "BARRIER 01") ---- */
.num {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--teal);
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.num.pink { background: var(--pink); }
.num.amber { background: var(--amber); color: var(--navy); }

/* ---- buttons: outlined teal pill; pink for the primary ---- */
.btn {
  font: 600 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal);
  border-radius: 999px;
  padding: 8px 16px;
  cursor: pointer;
  transition: background 0.12s;
}
.btn:hover { background: var(--teal-fill); }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 700; }
.btn.primary:hover { background: #d4125d; }
.btn.quiet { border-color: transparent; color: var(--ink); }
.btn.quiet:hover { background: var(--teal-fill); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* ---- status chips: small, pale ---- */
.chip {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: var(--teal-border);
  color: var(--teal-ink);
  white-space: nowrap;
}
.chip.pink { background: var(--pink-border); color: var(--pink-ink); }
.chip.amber { background: #FFEFC2; color: var(--amber-ink); }
.chip.grey { background: #F1F1F3; color: #666; }

/* ---- tabs: pill row, active in pink ---- */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
  font: 600 13px var(--font);
  color: var(--ink);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
}
.tab:hover { background: var(--teal-fill); }
.tab[aria-selected="true"] { background: var(--pink-fill); border-color: var(--pink); color: var(--pink-ink); }

/* ---- form controls ---- */
input[type="text"], select {
  font: 500 13px var(--font);
  color: var(--navy);
  background: #fff;
  border: 1.5px solid var(--teal-border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
}
input[type="text"]::placeholder { color: #a5a5a5; }

/* ---- labelled field rows ---- */
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
.fields dt { font-weight: 600; font-size: 12px; color: #8a8a8a; align-self: center; }
.fields dd { margin: 0; color: var(--navy); font-weight: 600; }

/* ---- timeline bar: alternating teal and pink segments, amber pin on the current one ---- */
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
.bar > i { flex: 1; background: var(--teal); }
.bar > i:nth-child(even) { background: var(--pink); }
.bar > i.todo { opacity: 0.22; }

/* ---- callout: amber, for open questions the user should react to ---- */
.flag {
  background: var(--amber-fill);
  border: 1.5px solid #FFE7A8;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12.5px;
  color: #5a4300;
}
.flag b { color: var(--amber-ink); }

/* ---- logo ---- */
.logo { display: block; height: 22px; width: auto; }

</style>

function curPage(s) {
  const ids = PAGES(s).map(p => p.id);
  if (state.page && ids.includes(state.page)) return state.page;
  return state.variant === 'B' ? null : ids[0];
}
const actChip = p => p.act ? `<span class="chip act-${p.act}">${p.act}</span>` : `<span class="chip grey">${esc(p.stage)}</span>`;
const seatsTxt = p => p.seats.length ? p.seats.map(x => `<span class="chip pink">${x}</span>`).join(' ') : '<span class="muted">—</span>';
function swHTML(s, p) {
  const sw = switchesFor(s, p);
  return sw.length ? `<span class="sw">${sw.map(x => `<button data-sw="${esc(x)}" data-who="${esc(p.n)}">${x}</button>`).join('')}</span>` : `<span class="sw"><span class="none">no switches</span></span>`;
}
function filterBar() {
  const opts = ['all', 'Recent', 'Quiet', 'Dormant', 'Access requested', 'Invited, not claimed', 'Deactivated'];
  return `<div class="tabs" role="tablist">${opts.map(o => `<button class="tab" role="tab" aria-selected="${state.filter === o}" data-filter="${o}">${o === 'all' ? 'Everyone' : o}</button>`).join('')}</div>`;
}
const visiblePeople = () => PEOPLE.filter(p => state.filter === 'all' || p.act === state.filter || p.stage === state.filter);
function profileHTML(p) {
  return `<dl class="fields">
    <dt>Branch</dt><dd>${esc(p.b || 'No branch')}</dd>
    <dt>Seats</dt><dd>${seatsTxt(p)}</dd>
    <dt>Departments</dt><dd>${esc(p.depts.join(', ') || '—')}</dd>
    <dt>Projects</dt><dd>${esc(p.projects.join(', ') || '—')}${p.pl ? ' <span class="chip">Project Lead</span>' : ''}</dd>
    <dt>Last seen</dt><dd>${p.seen ? fmt(p.seen) + ' <span class="muted small">(' + ago(p.seen) + ')</span>' : '—'}</dd>
    <dt>Last sign-in</dt><dd>${p.signin ? fmt(p.signin) : '—'}</dd>
    <dt>Activity</dt><dd>${actChip(p)}</dd></dl>`;
}
const latest = b => b.reports[0];
function reportAge(b) { const d = latest(b)[0]; return `<span class="age ${days(d) > 60 ? 'old' : ''}">${ago(d)}</span>`; }
const branchStatus = b => b.active ? '<span class="chip">Active</span>' : '<span class="chip grey">Inactive</span>';
function editBtn(s, label, kind = 'hub') {
  const ok = kind === 'branch' ? branchControls(s) : editsHub(s);
  return ok ? `<button class="btn" data-toast="${esc(label)} — stub">${label}</button>` : '';
}
function flag(html) { return `<div class="flag"><b>Open question.</b> ${html}</div>`; }
function deniedHTML(s) {
  return `<div class="card denied"><div class="circles" style="margin:0 auto 14px"></div><h3 class="title">Not in ${esc(s.name.split(' ')[0])}'s Shell</h3>
  <p class="lede" style="margin:8px auto 0">A plain Volunteer has no Operations Hub — not hidden, not greyed out. An Operations Manager briefs their volunteers instead. A link here is refused and the Shell stays as it is.</p></div>`;
}
function eventsRows(s) {
  return EVENTS.map(e => `<tr><td><b>${esc(e.n)}</b><div class="tiny muted">${esc(e.unit)}</div></td><td class="age">${fmt(e.date)}</td><td>${esc(e.org)}</td><td class="age">${e.signed}</td>
    <td>${e.unit === 'National' ? editBtn(s, 'Edit') : (editsHub(s) || s.exco) ? '<span class="chip amber">backstop</span>' : ''}</td></tr>`).join('');
}
function complianceList(s, asCards) {
  const pages = compliancePages(s);
  if (asCards) return `<div class="grid3">${pages.map((c, i) => `<div class="card ${i % 2 ? 'pink' : ''}"><p class="card-label">${c.n}</p><span class="chip ${c.uc ? 'amber' : 'grey'}">${c.note}</span></div>`).join('')}</div>`;
  return `<table class="t"><tbody>${pages.map(c => `<tr class="click"><td><b>${c.n}</b></td><td class="muted">${c.note}</td><td>${c.uc ? '<span class="chip amber">under construction</span>' : ''}</td></tr>`).join('')}</tbody></table>`;
}
function hubHead(s, sub) {
  return `<div class="spread" style="margin-bottom:18px"><div><p class="eyebrow">Operations Hub · the COO's</p><h1 class="title">${sub}<span class="dot">.</span></h1></div>
  <div class="row">${editsHub(s) ? '<span class="chip">You edit this hub</span>' : '<span class="chip grey">You read this hub</span>'}</div></div>`;
}

/* ======================= VARIANT A — LEDGER ======================= */
function variantA(s) {
  const page = curPage(s);
  const tabs = `<div class="tabs" role="tablist" style="margin-bottom:18px">${PAGES(s).map(p => `<button class="tab" role="tab" aria-selected="${page === p.id}" data-page="${p.id}">${p.n}</button>`).join('')}</div>`;
  let body = '';
  if (page === 'volunteers') {
    body = `<div class="spread" style="margin-bottom:12px">${filterBar()}<input type="text" placeholder="Search people"></div>
    <div class="card" style="padding:6px 8px;overflow:auto"><table class="t"><thead><tr><th>Name</th><th>Branch</th><th>Seats</th><th>Departments</th><th>Projects</th><th>Last seen</th><th>Last sign-in</th><th>Activity</th><th>Your switches</th></tr></thead><tbody>
    ${visiblePeople().map(p => `<tr class="click ${state.sel === p.n ? 'open' : ''}" data-sel="${esc(p.n)}"><td><b>${esc(p.n)}</b></td><td>${esc(p.b || '—')}</td><td>${seatsTxt(p)}</td><td>${esc(p.depts.join(', ') || '—')}</td>
      <td>${esc(p.projects.join(', ') || '—')}${p.pl ? ' <span class="chip">Lead</span>' : ''}</td><td class="age">${p.seen ? ago(p.seen) : '—'}</td><td class="age">${p.signin ? fmt(p.signin) : '—'}</td><td>${actChip(p)}</td><td>${swHTML(s, p)}</td></tr>
      ${state.sel === p.n ? `<tr class="open"><td colspan="9"><div class="card pink" style="margin:4px 0"><p class="eyebrow">Profile</p>${profileHTML(p)}</div></td></tr>` : ''}`).join('')}
    </tbody></table></div>
    ${flag('The Profile opens <i>inline</i> under its row here. Is a Profile a row you unfold, or a page of its own with an address you can send someone?')}`;
  } else if (page === 'branches') {
    body = `<div class="spread" style="margin-bottom:12px"><p class="lede" style="margin:0">One row per branch. The last column is how long ago each branch last reported — nothing turns red.</p>${editBtn(s, '+ Add branch', 'branch')}</div>
    <div class="card" style="padding:6px 8px;overflow:auto"><table class="t"><thead><tr><th>Branch</th><th>Branch Management</th><th>Status</th><th>Volunteers</th><th>Awaiting acceptance</th><th>Latest branch report</th><th></th></tr></thead><tbody>
    ${BRANCHES.map(b => `<tr><td><b>${b.n}</b></td><td class="small">${esc(b.bm)} · ${esc(b.om)} · ${esc(b.fm)}</td><td>${branchStatus(b)}</td><td class="age">${b.count}</td><td class="age">${b.awaiting || '—'}</td>
      <td><b>${esc(latest(b)[1])}</b><div class="tiny">${fmt(latest(b)[0])} · ${reportAge(b)}</div></td><td>${branchControls(s) ? '<span class="sw"><button>Edit</button><button>Delete</button></span>' : ''}</td></tr>`).join('')}
    </tbody></table></div>
    ${s.exco && !editsHub(s) ? flag('The CFO edits nothing in this hub, yet adds, edits and deletes branches here — a collective Exco act keeps its owner wherever its page sits. Does that read as consistent on screen, or does it want a different treatment from hub edits?') : ''}`;
  } else if (page === 'events') {
    body = `<div class="spread" style="margin-bottom:12px"><p class="lede" style="margin:0">The nation's Events, and every Event in the organisation for the backstop. Not a sign-up calendar.</p>${editBtn(s, '+ Put on a national Event')}</div>
    <div class="card" style="padding:6px 8px"><table class="t"><thead><tr><th>Event</th><th>Date</th><th>Organiser</th><th>Signed up</th><th></th></tr></thead><tbody>${eventsRows(s)}</tbody></table></div>
    ${flag('National Events and every other unit\'s Events share one table here, told apart by the unit line. Two lists, or one with a filter?')}`;
  } else if (page === 'sops') {
    body = `<div class="spread" style="margin-bottom:12px"><span></span>${editBtn(s, '+ Add SOP')}</div>
    <div class="card" style="padding:6px 8px"><table class="t"><thead><tr><th>SOP</th><th>Last revised</th><th>Scope</th></tr></thead><tbody>${SOPS.map(x => `<tr class="click"><td><b>${x[0]}</b></td><td>${fmt(x[1])}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div>`;
  } else {
    body = `<p class="lede">Compliance is a section of this hub. Its insides are drawn on the Compliance prototype; here, only the list each seat sees.</p><div class="card" style="padding:6px 8px">${complianceList(s)}</div>`;
  }
  return hubHead(s, 'Operations') + tabs + body +
    (s.pl ? flag('A Project Lead\'s hub has no Volunteers tab, so it opens on Branches. Is that the right first page for them, or should a Project Lead land somewhere that speaks to them?') : '');
}

/* ======================= VARIANT B — FRONT PAGE ======================= */
function variantB(s) {
  const page = curPage(s);
  const back = `<div class="crumb"><a data-page="">Operations Hub</a> › ${PAGES(s).find(p => p.id === page)?.n || ''}</div>`;
  if (!page) {
    const counts = { Recent: 0, Quiet: 0, Dormant: 0 }; PEOPLE.forEach(p => p.act && counts[p.act]++);
    const tot = counts.Recent + counts.Quiet + counts.Dormant;
    const cards = [];
    if (readsTracker(s)) cards.push(`<div class="card bigcard" data-page="volunteers"><span class="num">Volunteers</span><div class="stat" style="margin-top:12px">${BRANCHES.reduce((a, b) => a + b.count, 0) + 5}</div><div class="small">in every branch, and without one</div>
      <div class="actbar"><i style="flex:${counts.Recent};background:var(--teal)"></i><i style="flex:${counts.Quiet};background:var(--amber)"></i><i style="flex:${counts.Dormant};background:#d6d6da"></i></div>
      <div class="tiny row"><span>Recent ${Math.round(counts.Recent / tot * 100)}%</span><span>Quiet ${Math.round(counts.Quiet / tot * 100)}%</span><span>Dormant ${Math.round(counts.Dormant / tot * 100)}%</span></div>
      <div class="tiny muted" style="margin-top:6px">${PEOPLE.filter(p => p.stage === 'Access requested').length} access request · ${PEOPLE.filter(p => p.stage.startsWith('Invited')).length} invitation unclaimed</div></div>`);
    cards.push(`<div class="card pink bigcard" data-page="branches"><span class="num pink">Branches</span><div class="stack small" style="margin-top:12px">${BRANCHES.map(b => `<div class="spread"><span><b class="strong">${b.n}</b> ${b.active ? '' : '<span class="chip grey">Inactive</span>'}</span><span class="tiny">reported ${reportAge(b)}</span></div>`).join('')}</div></div>`);
    cards.push(`<div class="card bigcard" data-page="events"><span class="num amber">Events</span><div class="stack small" style="margin-top:12px">${EVENTS.filter(e => e.unit === 'National').map(e => `<div><b class="strong">${esc(e.n)}</b><div class="tiny">${fmt(e.date)} · ${e.signed} signed up</div></div>`).join('')}<div class="tiny muted">+ ${EVENTS.filter(e => e.unit !== 'National').length} Events across branches, Projects and Departments</div></div></div>`);
    cards.push(`<div class="card pink bigcard" data-page="sops"><span class="num pink">SOPs</span><div class="stat" style="margin-top:12px">${SOPS.length}</div><div class="small">latest: ${SOPS[0][0]}</div></div>`);
    cards.push(`<div class="card bigcard" data-page="compliance" style="grid-column:1/-1"><span class="num">Compliance</span><div class="row" style="margin-top:12px">${compliancePages(s).map(c => `<span class="chip ${c.uc ? 'amber' : 'grey'}">${c.n}</span>`).join('')}</div></div>`);
    return `<div class="band"><div><p class="eyebrow">Operations Hub · the COO's</p><h1 class="title">Our people, our branches, our paperwork<span class="dot">.</span></h1>
      <p style="margin:8px 0 0;opacity:.8">${editsHub(s) ? 'You edit this hub.' : 'You read this hub.'}</p></div><div class="circles"></div></div>
      <div class="grid2" style="margin-top:18px">${cards.join('')}</div>
      ${flag('This front page is a set of signposts with live numbers, the way a Department\'s hub opens on its front page. Does the Operations Hub want a front page at all, or should it open straight onto its busiest page?')}
      ${readsTracker(s) ? flag('The Activity bar summarises the whole organisation. Is a national health figure useful to the COO, or does it invite reading the band as a target — which the model says it is not?') : ''}`;
  }
  let body = '';
  if (page === 'volunteers') {
    body = `<div class="spread" style="margin-bottom:14px">${filterBar()}</div>
    <div class="grid2">${visiblePeople().map((p, i) => `<div class="card ${i % 2 ? 'pink' : ''}"><div class="person"><div class="avatar ${i % 2 ? 'p' : ''}">${ini(p.n)}</div><div>
      <div class="spread"><b class="strong">${esc(p.n)}</b>${actChip(p)}</div><div class="small">${esc(p.b || 'No branch')}${p.seats.length ? ' · ' + p.seats.join(', ') : ''}${p.pl ? ' · Project Lead' : ''}</div>
      <div class="tiny muted">${esc([...p.depts, ...p.projects].join(' · ') || 'No Departments or Projects')} · seen ${p.seen ? ago(p.seen) : 'never'}</div>
      <div style="margin-top:8px" class="row">${swHTML(s, p)}<button class="btn quiet" data-sel="${esc(p.n)}" style="padding:2px 8px;font-size:11px">Profile →</button></div></div></div>
      ${state.sel === p.n ? `<div style="margin-top:12px">${profileHTML(p)}</div>` : ''}</div>`).join('')}</div>
      ${flag('Cards give each person room, but at a few hundred volunteers this is a long scroll. Does the master tracker have to be a table to be a tracker?')}`;
  } else if (page === 'branches') {
    body = `<div class="spread" style="margin-bottom:14px"><span></span>${editBtn(s, '+ Add branch', 'branch')}</div><div class="grid2">${BRANCHES.map((b, i) => `<div class="card ${i % 2 ? 'pink' : ''}">
      <div class="spread"><h3 class="title">${b.n}</h3>${branchStatus(b)}</div>
      <dl class="fields" style="margin-top:12px"><dt>Branch Manager</dt><dd>${esc(b.bm)}</dd><dt>Operations Manager</dt><dd>${esc(b.om)}</dd><dt>Finance Manager</dt><dd>${esc(b.fm)}</dd><dt>Volunteers</dt><dd>${b.count}${b.awaiting ? ` <span class="chip pink">${b.awaiting} awaiting</span>` : ''}</dd></dl>
      <div class="card tint-teal" style="margin-top:12px;padding:12px 14px"><p class="eyebrow teal">Latest branch report · ${reportAge(b)}</p><b class="strong">${esc(latest(b)[1])}</b><div class="tiny">${fmt(latest(b)[0])}, by the Operations Manager</div></div>
      ${branchControls(s) ? '<div class="row" style="margin-top:12px"><button class="btn">Edit</button><button class="btn quiet">Delete</button></div>' : ''}</div>`).join('')}</div>`;
  } else if (page === 'events') {
    body = `<div class="spread" style="margin-bottom:14px"><span></span>${editBtn(s, '+ Put on a national Event')}</div>
      <h3 class="title" style="margin-bottom:10px">The nation's Events</h3><div class="grid2">${EVENTS.filter(e => e.unit === 'National').map(e => `<div class="card"><b class="strong">${esc(e.n)}</b><div class="small">${fmt(e.date)} · organised by ${esc(e.org)} · ${e.signed} signed up</div></div>`).join('')}</div>
      <h3 class="title" style="margin:22px 0 10px">Every other Event</h3><div class="card" style="padding:6px 8px"><table class="t"><tbody>${EVENTS.filter(e => e.unit !== 'National').map(e => `<tr><td><b>${esc(e.n)}</b><div class="tiny muted">${esc(e.unit)}</div></td><td>${fmt(e.date)}</td><td>${esc(e.org)}</td></tr>`).join('')}</tbody></table></div>`;
  } else if (page === 'sops') {
    body = `<div class="spread" style="margin-bottom:14px"><span></span>${editBtn(s, '+ Add SOP')}</div><div class="grid2">${SOPS.map((x, i) => `<div class="card ${i % 2 ? 'pink' : ''}"><span class="num ${i % 2 ? 'pink' : ''}">0${i + 1}</span><h3 class="title" style="margin-top:10px">${x[0]}</h3><div class="small">revised ${fmt(x[1])}</div></div>`).join('')}</div>`;
  } else body = complianceList(s, true);
  return back + hubHead(s, PAGES(s).find(p => p.id === page).n) + body;
}

/* ======================= VARIANT C — WORKBENCH ======================= */
function variantC(s) {
  const page = curPage(s);
  let list = '', detail = '';
  if (page === 'volunteers') {
    const ppl = visiblePeople();
    const sel = ppl.find(p => p.n === state.sel) || ppl[0];
    list = `<div style="margin-bottom:12px">${filterBar()}</div><div class="listy">${ppl.map(p => `<div class="li ${sel && p.n === sel.n ? 'sel' : ''}" data-sel="${esc(p.n)}"><span class="n">${esc(p.n)}</span>${actChip(p)}<span class="tiny muted">${esc(p.b || 'No branch')}${p.seats.length ? ' · ' + p.seats.join(', ') : ''}${p.pl ? ' · Project Lead' : ''}</span><span class="tiny muted age">${p.seen ? ago(p.seen) : '—'}</span></div>`).join('')}</div>`;
    detail = sel ? `<div class="card pink"><p class="eyebrow">Profile</p><h2 class="title">${esc(sel.n)}</h2><div style="margin:14px 0">${profileHTML(sel)}</div>
      <p class="card-label" style="margin-top:16px">Your switches on ${esc(sel.n.split(' ')[0])}</p>${swHTML(s, sel)}
      <p class="tiny muted" style="margin-top:8px">Flipping a switch is an act on this person, not an edit to the hub.</p></div>` : '';
  } else if (page === 'branches') {
    const sel = BRANCHES.find(b => b.n === state.sel) || BRANCHES[0];
    const span = 240;
    list = `<div class="spread" style="margin-bottom:12px"><span class="small">Each dot is a branch report over the last eight months; the pink one is the latest. A quiet branch is the one whose dots stop early.</span>${editBtn(s, '+ Add branch', 'branch')}</div>
      <div class="listy">${BRANCHES.map(b => `<div class="li ${b.n === sel.n ? 'sel' : ''}" data-sel="${b.n}" style="grid-template-columns:110px 1fr 90px;align-items:center">
        <span><span class="n">${b.n}</span><br>${branchStatus(b)}</span>
        <div><div class="timeline">${b.reports.filter(r => days(r[0]) <= span).map((r, i) => `<i class="${i === 0 ? 'latest' : ''}" style="left:${100 - days(r[0]) / span * 100}%" title="${esc(r[1])} · ${fmt(r[0])}"></i>`).join('')}</div></div>
        <span class="tiny" style="text-align:right">${b.count} volunteers${b.awaiting ? `<br><b class="strong">${b.awaiting} awaiting</b>` : ''}</span></div>`).join('')}</div>
      <div class="tlaxis" style="padding:4px 130px 0 126px"><span>Apr</span><span>Jun</span><span>Aug</span><span>Oct</span><span>Nov</span></div>`;
    detail = `<div class="card"><p class="eyebrow teal">Branch</p><div class="spread"><h2 class="title">${sel.n}</h2>${branchStatus(sel)}</div>
      <dl class="fields" style="margin:14px 0"><dt>Branch Manager</dt><dd>${esc(sel.bm)}</dd><dt>Operations Manager</dt><dd>${esc(sel.om)}</dd><dt>Finance Manager</dt><dd>${esc(sel.fm)}</dd><dt>Volunteers</dt><dd>${sel.count}</dd><dt>Awaiting acceptance</dt><dd>${sel.awaiting || '—'}</dd></dl>
      <p class="card-label">Branch reports</p><div class="stack">${sel.reports.map(r => `<div><b class="strong">${esc(r[1])}</b><div class="tiny">${fmt(r[0])} · ${ago(r[0])}</div></div>`).join('')}</div>
      ${branchControls(s) ? '<div class="row" style="margin-top:16px"><button class="btn">Edit branch</button><button class="btn quiet">Delete</button></div>' : ''}</div>`;
  } else if (page === 'events') {
    const sel = EVENTS.find(e => e.n === state.sel) || EVENTS[0];
    list = `<div class="spread" style="margin-bottom:12px"><span></span>${editBtn(s, '+ Put on a national Event')}</div><div class="listy">${EVENTS.map(e => `<div class="li ${e.n === sel.n ? 'sel' : ''}" data-sel="${esc(e.n)}"><span class="n">${esc(e.n)}</span><span class="tiny age">${fmt(e.date)}</span><span class="tiny muted">${esc(e.unit)}</span><span class="tiny muted">${e.signed} signed up</span></div>`).join('')}</div>`;
    detail = `<div class="card pink"><p class="eyebrow">${esc(sel.unit)}</p><h2 class="title">${esc(sel.n)}</h2><dl class="fields" style="margin-top:14px"><dt>Date</dt><dd>${fmt(sel.date)}</dd><dt>Organiser</dt><dd>${esc(sel.org)}</dd><dt>Signed up</dt><dd>${sel.signed}</dd></dl>
      ${flag('An Event\'s own page sits outside every hub. Does selecting one here preview it in place, as now, or leave the hub for the Event\'s page?')}</div>`;
  } else if (page === 'sops') {
    list = `<div class="spread" style="margin-bottom:12px"><span></span>${editBtn(s, '+ Add SOP')}</div><div class="listy">${SOPS.map((x, i) => `<div class="li ${i === 0 ? 'sel' : ''}"><span class="n">${x[0]}</span><span class="tiny">${fmt(x[1])}</span></div>`).join('')}</div>`;
    detail = `<div class="card"><p class="eyebrow teal">SOP</p><h2 class="title">${SOPS[0][0]}</h2><p class="small" style="margin-top:10px">The procedure's text reads here. Seat-holders read it; plain Volunteers don't.</p></div>`;
  } else {
    list = `<div class="listy">${compliancePages(s).map((c, i) => `<div class="li ${i === 0 ? 'sel' : ''}"><span class="n">${c.n}</span>${c.uc ? '<span class="chip amber">under construction</span>' : ''}<span class="tiny muted">${c.note}</span></div>`).join('')}</div>`;
    detail = `<div class="card"><p class="small">Compliance's insides are drawn on the Compliance prototype.</p></div>`;
  }
  return hubHead(s, PAGES(s).find(p => p.id === page).n) + `<div class="bench"><div>${list}</div><div class="detail">${detail}</div></div>` +
    flag('The hub\'s pages live in the Shell here, under the hub\'s name. That makes the Shell three levels deep plus a page level. Is that within the nesting rule, or should pages stay on the page?');
}

/* ======================= READOUT (surface the state) ======================= */
function readoutHTML(s) {
  const y = (ok, t) => `<div class="${ok ? 'y' : 'n'}">${ok ? '✓' : '✗'} ${t}</div>`;
  const sample = PEOPLE.find(p => p.n === 'Liam Peters');
  return `<summary>${esc(s.label)}</summary><div style="margin-top:8px">
    ${y(readsHub(s), 'Operations Hub in their Shell')}
    ${y(readsTracker(s), 'Volunteers page and Profiles')}
    ${y(editsHub(s), 'Edits the hub\'s content (SOPs, national Events)')}
    ${y(branchControls(s), 'Adds, edits, deletes branches')}
    ${y(compliancePages(s).some(c => c.id === 'meet'), 'Meetings and Action Points')}
    <div style="margin-top:6px"><b>Switches on Liam (UCT):</b> ${readsTracker(s) ? (switchesFor(s, sample).join(', ') || 'none') : '—'}</div>
    <div><b>Switches on David (no branch):</b> ${readsTracker(s) ? (switchesFor(s, PEOPLE.find(p => p.n === 'David Cohen')).join(', ') || 'none') : '—'}</div>
    ${state.toast ? `<div style="margin-top:6px;color:#ffd27a">Last action: ${esc(state.toast)}</div>` : ''}</div>`;
}

/* ======================= RENDER + EVENTS ======================= */
function render() {
  const s = seat();
  document.getElementById('shell').innerHTML = shellHTML(s);
  document.getElementById('main').innerHTML = !readsHub(s) ? deniedHTML(s) : ({ A: variantA, B: variantB, C: variantC })[state.variant](s);
  document.getElementById('vlabel').textContent = state.variant + ' (' + VARIANTS[state.variant] + ')';
  document.getElementById('readout').innerHTML = readoutHTML(s);
  document.getElementById('seat').value = state.seat;
  sync();
}
document.getElementById('seat').innerHTML = Object.entries(SEATS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
document.getElementById('seat').onchange = e => { state.seat = e.target.value; state.sel = null; state.toast = null; render(); };
const cycle = d => { const k = Object.keys(VARIANTS); state.variant = k[(k.indexOf(state.variant) + d + k.length) % k.length]; state.sel = null; render(); };
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1);
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-page],[data-sel],[data-filter],[data-sw],[data-toast]');
  if (!t) return;
  if (t.dataset.sw) { state.toast = `${t.dataset.sw} on ${t.dataset.who} (stub — nothing changes)`; }
  else if (t.dataset.toast) { state.toast = t.dataset.toast; }
  else if (t.dataset.filter) { state.filter = t.dataset.filter; }
  else if ('page' in t.dataset) { state.page = t.dataset.page || null; state.sel = null; state.filter = 'all'; }
  else if (t.dataset.sel) { state.sel = state.sel === t.dataset.sel && state.variant !== 'C' ? null : t.dataset.sel; }
  render();
});
render();
</script>

</body>
</html>
